        .dark body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0f172a 50%, #1e1b4b 100%);
            color: #f1f5f9;
        }

        /* Liquid Glass Effect */
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .dark .glass-strong {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animations */
        .snowflake { position: fixed; top: -10px; color: #e0f2fe; font-size: 1em; pointer-events: none; animation: fall linear forwards; z-index: 0; }
        .flower { position: fixed; top: -10px; font-size: 1.5em; pointer-events: none; animation: fall linear forwards; z-index: 0; }
        .lava { position: fixed; bottom: -10px; border-radius: 50%; pointer-events: none; animation: rise linear forwards; z-index: 0; box-shadow: 0 0 10px rgba(255,100,0,0.8); }
        .fog { position: fixed; bottom: 0; left: 0; width: 100%; height: 35vh; background: linear-gradient(to top, rgba(255,255,255,0.7), transparent); pointer-events: none; z-index: 0; }
        .dark .fog { background: linear-gradient(to top, rgba(59,130,246,0.15), transparent); }
        
        @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0.2; } }
        @keyframes rise { to { transform: translateY(-105vh); opacity: 0; } }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* iPhone Dock Animation */
        .dock-item { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .dock-item:active { transform: scale(0.85); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>

        const compressImage = (file, maxW = 400, q = 0.7) => new Promise(res => {
            const r = new FileReader();
            r.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = h * maxW / w; w = maxW; }
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(c.toDataURL('image/jpeg', q));
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(file);
        });

        /* ================= ICON FIX HOOK ================= */
        // Fix triệt để lỗi icon không render khi DOM thay đổi
        function useLucide() {
            useEffect(() => {
                let scheduled = false;
                const run = () => {
                    if (!window.lucide) return;
                    if (!document.querySelector('[data-lucide]')) return;
                    window.lucide.createIcons();
                };
                const schedule = () => {
                    if (scheduled) return;
                    scheduled = true;
                    requestAnimationFrame(() => { scheduled = false; run(); });
                };
                run();
                const obs = new MutationObserver(schedule);
                obs.observe(document.body, { childList: true, subtree: true });
                return () => obs.disconnect();
            }, []);
        }

        /* ================= EFFECTS ================= */
        function Effects({ type }) {
            useEffect(() => {
                const layer = document.getElementById('effect-layer');
                if (!layer) return;
                layer.innerHTML = '';
                if (type === 'none') return;
                
                let interval;
                const timeouts = [];
                
                const add = (html, cls, style, dur) => {
                    const el = document.createElement('div');
                    el.innerHTML = html; el.className = cls;
                    Object.assign(el.style, style);
                    layer.appendChild(el);
                    timeouts.push(setTimeout(() => el.remove(), dur));
                };

                if (type === 'snow') {
                    interval = setInterval(() => {
                        add('❄', 'snowflake', {
                            left: Math.random() * 100 + 'vw',
                            animationDuration: (Math.random() * 4 + 4) + 's',
                            opacity: Math.random() * 0.7 + 0.3,
                            fontSize: (Math.random() * 10 + 12) + 'px'
                        }, 8000);
                    }, 300);
                } else if (type === 'flower') {
                    const flowers = ['🌸', '🌺', '🌼', '🌷', '🍁', '🍂'];
                    interval = setInterval(() => {
                        add(flowers[Math.floor(Math.random() * flowers.length)], 'flower', {
                            left: Math.random() * 100 + 'vw',
                            animationDuration: (Math.random() * 4 + 5) + 's',
                            fontSize: (Math.random() * 12 + 14) + 'px'
                        }, 9000);
                    }, 500);
                } else if (type === 'lava') {
                    interval = setInterval(() => {
                        const size = Math.random() * 6 + 4;
                        add('', 'lava', {
                            left: Math.random() * 100 + 'vw',
                            animationDuration: (Math.random() * 3 + 4) + 's',
                            width: size + 'px', height: size + 'px',
                            background: `radial-gradient(circle, hsl(${Math.random() * 30 + 15}, 100%, 60%), hsl(${Math.random() * 20}, 100%, 40%))`
                        }, 7000);
                    }, 150);
                } else if (type === 'fog') {
                    layer.innerHTML = '<div class="fog"></div>';
                }

                return () => {
                    if (interval) clearInterval(interval);
                    timeouts.forEach(t => clearTimeout(t));
                    layer.innerHTML = '';
                };
            }, [type]);
            return null;
        }

        function SpeedTest() {
            const [speed, setSpeed] = useState(null);
            const [testing, setTesting] = useState(false);
            const [netInfo, setNetInfo] = useState(null);

            const test = async () => {
                setTesting(true); setSpeed(null);
                const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (c) setNetInfo({ type: c.effectiveType, down: c.downlink });
                
                const start = performance.now();
                try {
                    // Dùng file test tốc độ của Cloudflare
                    await fetch('https://speed.cloudflare.com/__down?bytes=2000000&cache=' + Date.now(), { cache: 'no-store' });
                    const dur = (performance.now() - start) / 1000;
                    setSpeed(((2000000 * 8) / (dur * 1000000)).toFixed(2));
                } catch (e) { alert('Lỗi test mạng'); }
                setTesting(false);
            };

            return (
                <div className="glass p-5 rounded-2xl animate-fade-in">
                    <h2 className="text-xl font-bold mb-3 flex items-center gap-2"><i data-lucide="wifi" size="22" className="text-purple-500"></i> Check 4G / 5G / WiFi</h2>
                    <button onClick={test} disabled={testing} className="w-full bg-purple-500 hover:bg-purple-600 text-white py-2.5 rounded-xl font-bold shadow-lg shadow-purple-500/30 transition">

                    {netInfo && (
                        <div className="mt-3 glass-strong p-3 rounded-xl text-xs space-y-1">

                        <div className="mt-3 glass-strong p-4 rounded-xl text-center">

        function TempMail() {
            const [mail, setMail] = useState(() => ls.get('tempmail', null));
            const [messages, setMessages] = useState([]);
            const [loading, setLoading] = useState(false);

            const create = async () => {
                setLoading(true);
                try {
                    const dr = await fetch('https://api.mail.tm/domains');
                    const dd = await dr.json();
                    const domain = dd['hydra:member'][0].domain;
                    const address = `user${Math.floor(Math.random() * 1000000)}@${domain}`;
                    const password = 'Password123!';
                    
                    const cr = await fetch('https://api.mail.tm/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                    if (!cr.ok) throw new Error();
                    
                    const tr = await fetch('https://api.mail.tm/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                    const td = await tr.json();
                    
                    const m = { address, token: td.token };
                    ls.set('tempmail', m); setMail(m);
                } catch (e) { alert('Lỗi tạo mail, thử lại!'); }
                setLoading(false);
            };

            const fetchM = async () => {
                if (!mail) return;
                try {
                    const r = await fetch('https://api.mail.tm/messages', { headers: { Authorization: `Bearer ${mail.token}` } });
                    const d = await r.json();
                    setMessages(d['hydra:member'] || []);
                } catch (e) { alert('Lỗi tải mail'); }
            };

            return (
                <div className="glass p-5 rounded-2xl animate-fade-in">
                    <h2 className="text-xl font-bold mb-3 flex items-center gap-2"><i data-lucide="mail" size="22" className="text-orange-500"></i> Email Tạm</h2>
                    {!mail ? (
                        <button onClick={create} disabled={loading} className="w-full bg-orange-500 hover:bg-orange-600 text-white py-2.5 rounded-xl font-bold shadow-lg shadow-orange-500/30">
                            {loading ? 'Đang tạo...' : 'Tạo Mail Tạm'}
                        </button>
                    ) : (
                        <div className="glass-strong p-3 rounded-xl text-sm">
                            <p className="font-bold text-orange-500 break-all">{mail.address}</p>
                            <div className="flex gap-2 mt-2">
                                <button onClick={fetchM} className="flex-1 glass-strong py-1.5 rounded-lg text-xs font-bold">Tải hộp thư</button>
                                <button onClick={() => { ls.del('tempmail'); setMail(null); setMessages([]); }} className="flex-1 bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 py-1.5 rounded-lg text-xs font-bold">Xoá</button>
                            </div>
                            {messages.length > 0 && (
                                <ul className="mt-3 space-y-1 max-h-48 overflow-y-auto no-scrollbar">
                                    {messages.map(m => (
                                        <li key={m.id} className="border-b border-white/30 pb-1 text-xs">
                                            <p className="font-semibold">{m.subject || '(Không tiêu đề)'}</p>
                                            <p className="text-gray-500 text-[10px]">Từ: {m.from?.address}</p>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    )}
                </div>
            );
        }

                        <div className="glass-strong p-3 rounded-xl space-y-2">
                            <input value={form.title || ''} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="Tiêu đề" className="w-full p-2 rounded text-sm outline-none" />
                            <textarea value={form.content || ''} onChange={e => setForm({ ...form, content: e.target.value })} placeholder="Nội dung" rows="3" className="w-full p-2 rounded text-sm outline-none" />
                            <div className="flex items-center gap-2">
                                {form.image && <img src={form.image} className="w-10 h-10 rounded object-cover" />}
                                <input type="file" accept="image/*" onChange={e => updImg(e, 'image', (k, v) => setForm({ ...form, [k]: v }))} className="text-xs" />
                            </div>
                            <div className="flex gap-2">
                                <button onClick={save} className="flex-1 bg-green-500 text-white py-2 rounded font-bold text-sm">{editId ? 'Cập nhật' : 'Đăng'}</button>
                                {editId && <button onClick={() => { setEditId(null); setForm({}); }} className="bg-gray-500 text-white px-3 rounded text-sm">Hủy</button>}
                            </div>
                        </div>
                        <div className="space-y-1 max-h-60 overflow-y-auto">
                            {data.posts.map(p => (
                                <div key={p.id} className="glass-strong p-2 rounded-xl flex items-center gap-2 text-xs">
                                    <div className="flex-1 truncate">{p.title}</div>
                                    <button onClick={() => { setForm(p); setEditId(p.id); }} className="text-blue-500"><i data-lucide="edit" size="14"></i></button>
                                    <button onClick={() => setData({ ...data, posts: data.posts.filter(x => x.id !== p.id) })} className="text-red-500"><i data-lucide="trash-2" size="14"></i></button>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const NotifsTab = () => {
                const [text, setText] = useState('');
                return (
                    <div className="space-y-3">
                        <div className="flex gap-2">
                            <input value={text} onChange={e => setText(e.target.value)} placeholder="Thông báo mới..." className="flex-1 p-2 rounded-xl text-sm outline-none glass-strong" />
                            <button onClick={() => { if(!text)return; setData({ ...data, notifications: [...data.notifications, { id: Date.now(), text, createdAt: Date.now() }] }); setText(''); }} className="bg-blue-500 text-white px-4 rounded-xl font-bold">+</button>
                        </div>
                        <div className="space-y-1">
                            {data.notifications.map(n => (
                                <div key={n.id} className="glass-strong p-2 rounded-xl flex items-center gap-2 text-xs">
                                    <div className="flex-1 truncate">{n.text}</div>
                                    <button onClick={() => setData({ ...data, notifications: data.notifications.filter(x => x.id !== n.id) })} className="text-red-500"><i data-lucide="trash-2" size="14"></i></button>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in">
                    <div className="glass p-3 rounded-2xl mb-4 flex justify-between items-center">
                        <h2 className="font-bold text-lg flex items-center gap-2"><i data-lucide="shield-check" size="20" className="text-red-500"></i> Dashboard</h2>
                        <button onClick={onLogout} className="bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Thoát</button>
                    </div>
                    <div className="flex gap-2 overflow-x-auto no-scrollbar mb-4">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => { setTab(t.id); setForm({}); setEditId(null); }} className={`whitespace-nowrap px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 ${tab === t.id ? 'bg-blue-500 text-white' : 'glass-strong'}`}>
                                <i data-lucide={t.icon} size="14"></i> {t.label}
                            </button>
                        ))}
                    </div>
                    <div className="glass p-4 rounded-2xl">
                        {tab === 'profile' && <ProfileTab />}
                        {tab === 'site' && <SiteTab />}
                        {tab === 'products' && <ProductsTab />}
                        {tab === 'posts' && <PostsTab />}
                        {tab === 'notifs' && <NotifsTab />}
                    </div>
                </div>
            );
        }

        /* ================= DRAWER & NAV ================= */
        function Drawer({ open, onClose, activePage, onNavigate, data, isAdmin }) {
            const [expanded, setExpanded] = useState(null);
            const items = [
                { id: 'profile', label: 'Tài khoản / Profile', icon: 'user' },
                { id: 'shop', label: 'Sản phẩm', icon: 'shopping-bag', expandable: true },
                { id: 'notifications', label: 'Thông báo', icon: 'bell' },
                { id: 'posts', label: 'Bài viết', icon: 'newspaper' },
                { id: 'ipcheck', label: 'Check IP', icon: 'globe' },
                { id: 'weather', label: 'Thời tiết', icon: 'cloud-sun' },
                { id: 'notes', label: 'Ghi chú', icon: 'sticky-note' },
                { id: 'tempmail', label: 'Email Tạm', icon: 'mail' },
                { id: 'speedtest', label: 'Check 4G/5G/WiFi', icon: 'wifi' },
                { id: 'contact', label: 'Contact Support', icon: 'phone' }
            ];

            return (
                <>
                    {open && <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40" onClick={onClose}></div>}
                    <div className={`fixed top-0 left-0 h-full w-80 max-w-[85vw] glass-strong z-50 transform transition-transform duration-300 ${open ? 'translate-x-0' : '-translate-x-full'} flex flex-col`}>
                        <div className="p-4 flex items-center gap-3 border-b border-white/20">
                            <img src={data.profile.avatar} className="w-12 h-12 rounded-full object-cover border-2 border-blue-500" alt="Avt" />
                            <div className="flex-1 min-w-0">
                                <p className="font-bold flex items-center text-sm truncate">{data.profile.name}{data.profile.verified && <VerifiedIcon size={14} />}</p>
                                <p className="text-[10px] text-gray-500 truncate">@{ADMIN_USER}</p>
                            </div>
                            <button onClick={onClose} className="p-1"><i data-lucide="x" size="20"></i></button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-3 space-y-1 no-scrollbar">
                            {items.map(it => (
                                <div key={it.id}>
                                    <button onClick={() => {
                                        if (it.expandable) setExpanded(expanded === it.id ? null : it.id);
                                        else { onNavigate(it.id); onClose(); }
                                    }} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium hover:bg-blue-500/10 transition ${activePage === it.id ? 'text-blue-500' : ''}`}>
                                        <i data-lucide={it.icon} size="18" className="text-blue-500"></i>
                                        <span className="flex-1 text-left">{it.label}</span>
                                        {it.expandable && <i data-lucide={expanded === it.id ? 'chevron-down' : 'chevron-right'} size="16"></i>}
                                    </button>
                                    
                                    {it.expandable && expanded === it.id && (
                                        <div className="ml-6 mt-1 space-y-0.5">
                                            {CATEGORIES.map(c => (
                                                <div key={c.name}>
                                                    <button onClick={() => { onNavigate('shop', c.name); onClose(); }} className="w-full text-left px-2 py-1.5 rounded text-xs hover:bg-blue-500/10">
                                                        {c.name}
                                                    </button>
                                                    {c.subs.length > 0 && (
                                                        <div className="ml-3">
                                                            {c.subs.map(s => (
                                                                <button key={s} onClick={() => { onNavigate('shop', s); onClose(); }} className="w-full text-left px-2 py-1 rounded text-[11px] hover:bg-blue-500/10 text-gray-600 dark:text-gray-400">• {s}</button>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                            
                            <div className="pt-2 border-t border-white/20 mt-2">
                                {isAdmin ? (
                                    <button onClick={() => { onNavigate('admin'); onClose(); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-500 hover:bg-red-500/10">
                                        <i data-lucide="shield-check" size="18"></i> Admin Panel
                                    </button>
                                ) : (
                                    <button onClick={() => { onNavigate('admin-login'); onClose(); }} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium hover:bg-gray-500/10">
                                        <i data-lucide="lock" size="18"></i> Đăng nhập Admin
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        function Accessibility({ effect, setEffect, musicOn, setMusicOn, track, setTrack }) {
            const [open, setOpen] = useState(false);
            const effects = ['none', 'snow', 'flower', 'fog', 'lava'];
            
            return (
                <>
                    <button onClick={() => setOpen(!open)} className="fixed top-20 right-4 z-40 w-12 h-12 rounded-2xl glass-strong flex items-center justify-center shadow-xl hover:scale-105 transition">
                        <i data-lucide="sparkles" size="22" className="text-blue-500"></i>
                    </button>
                    
                    {open && (
                        <div className="fixed top-36 right-4 z-40 w-72 glass-strong rounded-2xl p-3 animate-fade-in shadow-2xl">
                            <div className="flex justify-between items-center mb-2">
                                <p className="text-xs font-bold">Tiện ích</p>
                                <button onClick={() => setOpen(false)}><i data-lucide="x" size="16"></i></button>
                            </div>
                            
                            <div className="grid grid-cols-4 gap-1.5 mb-2">
                                <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} title="Lên đầu" className="glass rounded-xl p-2 flex justify-center"><i data-lucide="arrow-up" size="16"></i></button>
                                <button onClick={() => window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})} title="Xuống cuối" className="glass rounded-xl p-2 flex justify-center"><i data-lucide="arrow-down" size="16"></i></button>
                                <button onClick={() => { const q=prompt("Tìm kiếm:"); if(q) window.find(q); }} title="Tìm kiếm" className="glass rounded-xl p-2 flex justify-center"><i data-lucide="search" size="16"></i></button>
                                <button onClick={() => { ls.set('readPos', {url: location.href, pos: window.scrollY, time: Date.now()}); alert('Đã lưu vị trí!'); }} title="Lưu vị trí" className="glass rounded-xl p-2 flex justify-center"><i data-lucide="bookmark" size="16"></i></button>
                            </div>

                            <div className="mb-2">
                                <p className="text-[10px] font-bold text-gray-500 mb-1">Hiệu ứng</p>
                                <div className="grid grid-cols-3 gap-1">
                                    {effects.map(e => (
                                        <button key={e} onClick={() => setEffect(e)} className={`text-[10px] py-1 rounded-lg capitalize ${effect === e ? 'bg-blue-500 text-white' : 'glass'}`}>{e === 'none' ? 'Tắt' : e}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="mb-2">
                                <div className="flex justify-between items-center mb-1">
                                    <p className="text-[10px] font-bold text-gray-500">Nhạc nền</p>
                                    <button onClick={() => setMusicOn(!musicOn)} className={`px-2 py-0.5 rounded-full text-[10px] ${musicOn ? 'bg-green-500 text-white' : 'bg-gray-300 text-gray-600'}`}>{musicOn ? 'BẬT' : 'TẮT'}</button>
                                </div>
                                {musicOn && (
                                    <div className="space-y-1">
                                        <div className="rounded-xl overflow-hidden">
                                            <iframe width="100%" height="60" scrolling="no" frameBorder="no" allow="autoplay" src={`https://w.soundcloud.com/player/?url=${encodeURIComponent(SC_TRACKS[track])}&color=%233b82f6&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false`}></iframe>
                                        </div>
                                        <button onClick={() => setTrack((track + 1) % SC_TRACKS.length)} className="w-full glass rounded-lg py-1 text-[10px] font-bold flex justify-center items-center gap-1">
                                            <i data-lucide="skip-forward" size="12"></i> Bài kế tiếp
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </>
            );
        }

        /* ================= MAIN APP ================= */
        function App() {
            useLucide();
            const [darkMode, setDarkMode] = useState(() => ls.get('darkMode', true));
            const [effect, setEffect] = useState(() => ls.get('effect', 'snow'));
            const [musicOn, setMusicOn] = useState(() => ls.get('musicOn', false));
            const [track, setTrack] = useState(0);
            const [activePage, setActivePage] = useState('profile');
            const [shopFilter, setShopFilter] = useState('');
            const [drawerOpen, setDrawerOpen] = useState(false);
            const [isAdmin, setIsAdmin] = useState(() => ls.get('isAdmin', false));

            // State dữ liệu chính
            const [data, setDataState] = useState(() => ({
                profile: ls.get('profile', DEFAULT_PROFILE),
                products: ls.get('products', DEFAULT_PRODUCTS),
                posts: ls.get('posts', DEFAULT_POSTS),
                notifications: ls.get('notifications', DEFAULT_NOTIFS),
                siteName: ls.get('siteName', 'Thao Service'),
                defaultEffect: ls.get('defaultEffect', 'snow')
            }));

            const setData = (d) => {
                setDataState(d);
                ls.set('profile', d.profile); ls.set('products', d.products); ls.set('posts', d.posts);
                ls.set('notifications', d.notifications); ls.set('siteName', d.siteName); ls.set('defaultEffect', d.defaultEffect);
            };

            useEffect(() => { ls.set('darkMode', darkMode); document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);
            useEffect(() => { ls.set('effect', effect); }, [effect]);
            useEffect(() => { ls.set('musicOn', musicOn); }, [musicOn]);
            useEffect(() => { ls.set('isAdmin', isAdmin); }, [isAdmin]);

            const navigate = (page, filter) => {
                setActivePage(page);
                if (filter !== undefined) setShopFilter(filter);
                if (page === 'shop' && !filter) setShopFilter('');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Notif 12H
            const [dismissed, setDismissed] = useState(() => ls.get('notifDismissed', {}));
            const visibleNotifs = data.notifications.filter(n => (dismissed[n.id] || 0) < Date.now());

            return (
                <div className="max-w-4xl mx-auto p-3 pb-32">
                    <Effects type={effect} />
                    
                    {/* Header */}
                    <header className="glass sticky top-3 z-20 rounded-2xl p-3 mb-4 flex justify-between items-center">
                        <button onClick={() => setDrawerOpen(true)} className="p-2"><i data-lucide="menu" size="22" className="text-blue-500"></i></button>
                        <h1 className="text-base font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-cyan-400">{data.siteName}</h1>
                        <div className="flex gap-1">
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2 glass-strong rounded-full">
                                <i data-lucide={darkMode ? 'sun' : 'moon'} size="18"></i>
                            </button>
                        </div>
                    </header>

                    {/* Notification Banners */}
                    {visibleNotifs.length > 0 && (
                        <div className="space-y-2 mb-4">
                            {visibleNotifs.map(n => (
                                <div key={n.id} className="glass rounded-xl p-3 flex items-start gap-2 animate-fade-in">
                                    <i data-lucide="bell" size="16" className="text-blue-500 mt-0.5"></i>
                                    <p className="flex-1 text-xs">{n.text}</p>
                                    <button onClick={() => { const nd = { ...dismissed, [n.id]: Date.now() + 12 * 3600 * 1000 }; ls.set('notifDismissed', nd); setDismissed(nd); }} className="text-gray-400 hover:text-red-500"><i data-lucide="x" size="14"></i></button>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Page Content */}
                    <div className="min-h-[60vh]">
                        {activePage === 'profile' && <ProfileHome profile={data.profile} posts={data.posts} onNavigate={navigate} />}
                        {activePage === 'shop' && <Shop products={data.products} filter={shopFilter} setFilter={setShopFilter} />}
                        {activePage === 'posts' && <PostsPage posts={data.posts} />}
                        {activePage === 'notifications' && <NotificationsPage notifications={data.notifications} />}
                        {activePage === 'weather' && <Weather />}
                        {activePage === 'ipcheck' && <IpCheck />}
                        {activePage === 'speedtest' && <SpeedTest />}
                        {activePage === 'notes' && <Notes />}
                        {activePage === 'tempmail' && <TempMail />}
                        {activePage === 'contact' && <ContactPage profile={data.profile} />}
                        {activePage === 'admin-login' && <AdminLogin onLogin={() => { setIsAdmin(true); navigate('admin'); }} />}
                        {activePage === 'admin' && (isAdmin ? <AdminPanel data={data} setData={setData} onLogout={() => { setIsAdmin(false); navigate('profile'); }} /> : <AdminLogin onLogin={() => { setIsAdmin(true); navigate('admin'); }} />)}
                    </div>

                    {/* Floating Tools */}
                    <Accessibility effect={effect} setEffect={setEffect} musicOn={musicOn} setMusicOn={setMusicOn} track={track} setTrack={setTrack} />
                    
                    {/* Drawer Menu */}
                    <Drawer open={drawerOpen} onClose={() => setDrawerOpen(false)} activePage={activePage} onNavigate={navigate} data={data} isAdmin={isAdmin} />

                    {/* Bottom Nav (Chỉ 3 nút) */}
                    <nav className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md glass-strong rounded-3xl p-2 flex justify-around items-center z-30 shadow-2xl">
                        <button onClick={() => setDrawerOpen(true)} className={`dock-item flex flex-col items-center p-2 px-4 ${drawerOpen ? 'text-blue-500' : 'text-gray-500'}`}>
                            <i data-lucide="menu" size="22"></i><span className="text-[10px] font-bold mt-1">Menu</span>
                        </button>
                        <button onClick={() => navigate('shop')} className={`dock-item flex flex-col items-center p-2 px-4 ${activePage === 'shop' ? 'text-blue-500' : 'text-gray-500'}`}>
                            <i data-lucide="shopping-bag" size="22"></i><span className="text-[10px] font-bold mt-1">Shop</span>
                        </button>
                        <button onClick={() => navigate('contact')} className={`dock-item flex flex-col items-center p-2 px-4 ${activePage === 'contact' ? 'text-blue-500' : 'text-gray-500'}`}>
                            <i data-lucide="phone" size="22"></i><span className="text-[10px] font-bold mt-1">Contact</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
