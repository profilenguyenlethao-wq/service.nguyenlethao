<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05070d;--bg-2:#0a0f1a;--glass:rgba(255,255,255,.06);--glass-2:rgba(255,255,255,.1);--border:rgba(255,255,255,.12);--text:#eaf0ff;--muted:#8b98b0;--primary:#4d7bff;--secondary:#a855f7;--accent:#22d3ee;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--radius:18px;--blur:20px;--shadow:0 8px 32px rgba(0,0,0,.4);--fs:16px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
[data-theme="light"]{--bg:#eef2f9;--bg-2:#e4eaf5;--glass:rgba(255,255,255,.6);--glass-2:rgba(255,255,255,.85);--border:rgba(10,20,40,.08);--text:#0b1425;--muted:#59677f;--shadow:0 8px 32px rgba(30,50,90,.1)}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--fs);overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.55;transition:background .3s,color .3s}
#bg-layer{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
#bg-layer::before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 15% 20%,rgba(77,123,255,.25),transparent 45%),radial-gradient(circle at 85% 80%,rgba(168,85,247,.2),transparent 45%),radial-gradient(circle at 60% 40%,rgba(34,211,238,.15),transparent 50%);animation:bgMove 30s ease-in-out infinite}
@keyframes bgMove{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-3%) scale(1.08)}}
[data-reduce-motion="1"] *{animation-duration:.01ms !important;transition-duration:.01ms !important}
.glass{background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 40%)}
header.topbar{position:sticky;top:0;z-index:100;background:var(--glass);backdrop-filter:blur(calc(var(--blur) * 1.2));border-bottom:1px solid var(--border);transition:all .3s}
header.topbar.scrolled{box-shadow:var(--shadow);background:var(--glass-2)}
.nav-wrap{max-width:1400px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;cursor:pointer;user-select:none}
.logo-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:800;font-size:19px;box-shadow:0 4px 16px rgba(77,123,255,.5)}
nav.desktop-nav{display:flex;gap:2px;flex:1;margin-left:12px}
nav.desktop-nav a{padding:8px 12px;border-radius:10px;color:var(--muted);font-size:14px;text-decoration:none;cursor:pointer;transition:all .18s;font-weight:500}
nav.desktop-nav a:hover,nav.desktop-nav a.active{background:var(--glass-2);color:var(--text)}
.nav-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .18s}
.icon-btn:hover{background:var(--glass-2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.96)}
main{max-width:1400px;margin:0 auto;padding:20px 18px 100px}
.page-title{font-size:clamp(24px,4vw,36px);font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.page-sub{color:var(--muted);margin-bottom:22px;font-size:15px}
.section{margin:28px 0}
.section h2{font-size:22px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.hero{padding:60px 30px;text-align:center;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,5.5vw,54px);font-weight:800;line-height:1.1;margin-bottom:16px;letter-spacing:-.03em}
.hero h1 .grad{background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:17px;max-width:640px;margin:0 auto 24px}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:13px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;color:#fff;box-shadow:0 6px 22px rgba(77,123,255,.4)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn-danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#ff8585}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{padding:20px;cursor:pointer;transition:transform .2s,box-shadow .2s}

.card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.card p{font-size:13px;color:var(--muted);line-height:1.5}
.card .icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(135deg,rgba(77,123,255,.25),rgba(168,85,247,.25));color:var(--primary)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
input,textarea,select{width:100%;padding:11px 14px;border-radius:11px;background:var(--glass);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;transition:border .18s,box-shadow .18s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(77,123,255,.15)}

.input-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--border)}
.tbl th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tbl tr:hover td{background:var(--glass)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:1000;display:grid;place-items:center;padding:16px;animation:fadeIn .2s}
.modal{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:24px;background:var(--bg-2);border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:slideUp .25s}

@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal h3{font-size:20px;margin-bottom:16px}
#toast-container{position:fixed;top:80px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{padding:12px 18px;border-radius:12px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:slideIn .25s;display:flex;align-items:center;gap:10px}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--primary)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
nav.mobile-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:none;gap:4px;padding:8px;background:var(--glass-2);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);z-index:150;max-width:calc(100vw - 24px)}
nav.mobile-nav a{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--muted);cursor:pointer;transition:all .18s;position:relative}
nav.mobile-nav a.active{color:var(--primary);background:rgba(77,123,255,.15)}
nav.mobile-nav a span{position:absolute;bottom:3px;font-size:9px;font-weight:600;opacity:0}
nav.mobile-nav a.active span{opacity:1}
@media(max-width:900px){nav.desktop-nav{display:none}nav.mobile-nav{display:flex}main{padding-bottom:120px}}
#effects-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.fab{position:fixed;z-index:200;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 24px rgba(77,123,255,.5);transition:transform .2s}
.fab:hover{transform:scale(1.08)}
.fab:active{transform:scale(.95)}
.a11y-panel{position:fixed;z-index:210;width:320px;max-height:80vh;overflow-y:auto;padding:20px;background:var(--glass-2);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);display:none}
.a11y-panel.open{display:block;animation:slideUp .25s}
.a11y-panel h4{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.a11y-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.a11y-row:last-child{border:none}
.a11y-row input[type="range"]{width:110px}
.switch{position:relative;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--border);border-radius:22px;cursor:pointer;transition:.2s}
.switch span::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + span{background:var(--primary)}
.switch input:checked + span::before{transform:translateX(16px)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.badge-success{background:rgba(34,197,94,.15);color:#4ade80}
.badge-warn{background:rgba(245,158,11,.15);color:#fbbf24}
.badge-danger{background:rgba(239,68,68,.15);color:#f87171}
.badge-info{background:rgba(77,123,255,.15);color:#93c5fd}
.product-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.product-img{aspect-ratio:16/9;background:linear-gradient(135deg,rgba(77,123,255,.3),rgba(168,85,247,.3));display:grid;place-items:center;font-size:40px;color:var(--primary)}
.product-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:8px}
.product-body .price{font-size:18px;font-weight:800;color:var(--primary)}
.product-body .price s{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.hidden{display:none !important}
.center{text-align:center}
.mt-2{margin-top:16px}
.mt-3{margin-top:24px}
.flex{display:flex}
.gap-2{gap:16px}
.gap-1{gap:8px}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.totp-display{font-size:44px;font-weight:800;letter-spacing:8px;font-family:'SF Mono',Menlo,monospace;text-align:center;padding:20px;color:var(--primary)}
.totp-bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:10px}
.totp-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s linear}
.note-card{padding:14px;min-height:120px;cursor:pointer}
.note-card textarea{background:transparent;border:none;width:100%;resize:none;color:inherit;font-family:inherit;font-size:14px;min-height:80px}
#qr-output{display:grid;place-items:center;padding:16px;background:#fff;border-radius:14px;min-height:180px;margin-top:10px}
#qr-output img{max-width:100%}
.weather-hero{padding:30px;text-align:center;margin-bottom:20px}
.weather-hero .temp{font-size:72px;font-weight:800;line-height:1;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.weather-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.weather-detail{padding:14px;background:rgba(255,255,255,.06);border-radius:12px;text-align:center}
.weather-detail .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.weather-detail .val{font-size:16px;font-weight:700}
.hourly-scroll{display:flex;gap:10px;overflow-x:auto;padding:14px 0}
.hourly-item{min-width:80px;padding:12px;border-radius:12px;background:var(--glass);border:1px solid var(--border);text-align:center;font-size:12px}
.hourly-item .hour{font-size:11px;color:var(--muted);margin-bottom:6px}
.hourly-item .h-temp{font-size:16px;font-weight:700}
.admin-tabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.admin-tabs button{padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--glass);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:.18s;font-family:inherit}
.admin-tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.music-widget{position:fixed;bottom:80px;right:16px;z-index:180;width:300px;padding:14px;background:var(--glass-2);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);display:none}
.music-widget.open{display:block}

.music-widget iframe{width:100%;border:none;border-radius:10px;height:100px}
@media(max-width:600px){.hero{padding:40px 18px}.page-title{font-size:24px}}
</style>
</head>
<body>
<div id="bg-layer"></div>
<canvas id="effects-canvas"></canvas>

  <div class="nav-wrap">

      <button class="icon-btn" id="music-btn" title="Music"><i data-lucide="music"></i></button>
      <button class="icon-btn" onclick="SPS.nav('admin')" title="Admin"><i data-lucide="shield"></i></button>

  </div>

</button>

<script>
/* ======================================================
   SPS – Service Processing Support (Full build)
   ====================================================== */

const SPS = {
  state: {
    lang: 'vi', theme: 'dark', page: 'home', admin: null,
    effects: { stars: true, snow: false, rain: false, speed: 1, density: 1, brightness: 1 },
    reduceMotion: false,
    music: { open: false, track: 0 },
    products: [], blog: [], orders: [], settings: {},
    notes: [], todos: [], events: [],
    pageData: {}
  },

  store: {
    key: 'sps_v1',
    save() {
      try {
        const { lang, theme, effects, reduceMotion, products, blog, orders, settings, notes, todos, events, admin } = SPS.state;
        localStorage.setItem(this.key, JSON.stringify({ lang, theme, effects, reduceMotion, products, blog, orders, settings, notes, todos, events, admin }));
      } catch (e) { console.warn('Save failed', e); }
    },
    load() {
      try {
        const raw = localStorage.getItem(this.key);
        if (!raw) return false;
        Object.assign(SPS.state, JSON.parse(raw));
        return true;
      } catch (e) { console.warn('Load failed', e); return false; }
    },
    export() {
      const data = localStorage.getItem(this.key) || '{}';
      SPS.download(new Blob([data], { type: 'application/json' }), 'sps-backup-' + new Date().toISOString().slice(0, 10) + '.json');
    },
    async import(file) {
      const text = await file.text();
      try {
        const obj = JSON.parse(text);
        if (typeof obj !== 'object' || Array.isArray(obj)) throw new Error('Invalid backup');
        localStorage.setItem(this.key, JSON.stringify(obj));
        SPS.toast('Đã phục hồi. Đang tải lại...', 'success');
        setTimeout(() => location.reload(), 800);
      } catch (e) { SPS.toast('File backup không hợp lệ: ' + e.message, 'error'); }
    }
  },

  /* ==================== I18N (7 languages) ==================== */
  i18n: {

  t(key) { return (this.i18n[this.state.lang] || {})[key] || this.i18n.en[key] || key; },

  /* ==================== UTILS ==================== */
  toast(msg, type = 'info', duration = 3500) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
    el.innerHTML = '<i data-lucide="' + icon + '" style="width:18px;height:18px;flex-shrink:0"></i><span>' + this.esc(msg) + '</span>';
    document.getElementById('toast-container').appendChild(el);
    if (window.lucide) lucide.createIcons();
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, duration);
  },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  id() { return Math.random().toString(36).slice(2, 10); },
  download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
  },
  copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => this.toast('Đã sao chép', 'success')).catch(() => this.fallbackCopy(text));
    } else this.fallbackCopy(text);
  },
  fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); this.toast('Đã sao chép', 'success'); }
    catch (e) { this.toast('Không thể sao chép', 'error'); }
    ta.remove();
  },
  async fetchJSON(url, timeout = 12000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeout);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { clearTimeout(t); throw e; }
  },
  modal(html) {
    const root = document.getElementById('modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = '<div class="modal glass">' + html + '</div>';
    wrap.addEventListener('click', e => { if (e.target === wrap) this.closeModal(); });
    root.appendChild(wrap);
    if (window.lucide) lucide.createIcons();
    return wrap;
  },
  closeModal() { document.getElementById('modal-root').innerHTML = ''; },

  toggleTheme() {
    this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', this.state.theme);

    this.toast('Theme: ' + this.state.theme, 'info');
  },
  setLang(lang) {
    this.state.lang = lang;

    this.store.save();
    this.renderNav(); this.render();
    this.toast('Language: ' + lang.toUpperCase(), 'success');

  openLangPicker() {

      { code: 'zh-CN', name: '中文简体' }, { code: 'zh-TW', name: '中文繁體' },
      { code: 'ja', name: '日本語' }, { code: 'de', name: 'Deutsch' },
      { code: 'ru', name: 'Русский' }
    ];
    this.modal(
      '<h3>🌐 Ngôn ngữ</h3>' +
      langs.map(l => '<button class="btn" style="width:100%;margin-bottom:8px;justify-content:space-between" onclick="SPS.setLang(\'' + l.code + '\');SPS.closeModal()">' +
        '<span>' + l.name + '</span>' + (this.state.lang === l.code ? '<span class="badge badge-success">✓</span>' : '') + '</button>').join('')
    );
  },

  nav(page) { if (location.hash === '#/' + page) { this.render(); return; } location.hash = '#/' + page; },
  parseRoute() { const h = location.hash.replace(/^#\/?/, '') || 'home'; const [page, ...params] = h.split('/'); return { page, params }; },

  navItems() {
    return [
      { id: 'home', label: this.t('home'), icon: 'home' },
      { id: 'products', label: this.t('products'), icon: 'shopping-bag' },
      { id: 'services', label: this.t('services'), icon: 'briefcase' },
      { id: 'tools', label: this.t('tools'), icon: 'wrench' },
      { id: 'blog', label: this.t('blog'), icon: 'newspaper' },
      { id: 'support', label: this.t('support'), icon: 'life-buoy' }
    ];
  },
  renderNav() {
    const items = this.navItems();
    const current = this.parseRoute().page;
    document.getElementById('desktop-nav').innerHTML = items.map(it => '<a class="' + (current === it.id ? 'active' : '') + '" onclick="SPS.nav(\'' + it.id + '\')">' + it.label + '</a>').join('');
    document.getElementById('mobile-nav').innerHTML = items.map(it => '<a class="' + (current === it.id ? 'active' : '') + '" onclick="SPS.nav(\'' + it.id + '\')" title="' + it.label + '"><i data-lucide="' + it.icon + '"></i><span>' + it.label.slice(0, 3) + '</span></a>').join('');
    if (window.lucide) lucide.createIcons();
  },
  render() {
    const { page, params } = this.parseRoute();
    this.state.page = page;
    this.renderNav();
    const main = document.getElementById('main');
    const renderer = this.pages[page] || this.pages.notfound;
    try { main.innerHTML = ''; renderer.call(this, main, params); }
    catch (e) { console.error(e); main.innerHTML = '<div class="glass" style="padding:24px"><h2>Lỗi tải trang</h2><p class="muted">' + this.esc(e.message) + '</p></div>'; }
    if (window.lucide) lucide.createIcons();
    window.scrollTo({ top: 0, behavior: this.state.reduceMotion ? 'auto' : 'smooth' });
  },

  /* ==================== PAGES ==================== */
  pages: {
    home(main) {
      const featured = (this.state.products || []).filter(p => p.featured).slice(0, 4);
      const services = [
        { icon: 'smartphone', name: 'Shop Liên Quân', desc: 'Acc giá rẻ, uy tín' },
        { icon: 'flame', name: 'Shop Free Fire', desc: 'Kim cương, acc VIP' },
        { icon: 'facebook', name: 'Support Meta', desc: 'Hỗ trợ FB, IG, WA' },
        { icon: 'search', name: 'Support Google', desc: 'Gmail, Business' },

        { icon: 'code', name: 'Source Code', desc: 'Website, tool, bot' }
      ];
      main.innerHTML = `

          <div class="grid grid-3">${services.map(s => `<div class="card glass" onclick="SPS.nav('services')"><div class="icon"><i data-lucide="${s.icon}"></i></div><h3>${s.name}</h3><p>${s.desc}</p></div>`).join('')}</div>
        </div>
        ${featured.length ? `<div class="section"><h2><i data-lucide="star" style="color:var(--warning)"></i> ${this.t('featured_products')}</h2><div class="grid grid-3">${featured.map(p => this.renderProductCard(p)).join('')}</div></div>` : ''}
        <div class="section"><h2><i data-lucide="zap" style="color:var(--accent)"></i> ${this.t('why_sps')}</h2>
          <div class="grid grid-4">${[
            { i: 'shield-check', t: 'Bảo mật', d: 'Dữ liệu lưu trên máy bạn' },
            { i: 'rocket', t: 'Nhanh', d: 'Xử lý client-side' },
            { i: 'globe', t: 'Đa ngôn ngữ', d: 'Hỗ trợ 7 ngôn ngữ' },
            { i: 'heart', t: 'Miễn phí', d: 'Hầu hết công cụ' }
          ].map(x => `<div class="card glass"><div class="icon"><i data-lucide="${x.i}"></i></div><h3>${x.t}</h3><p>${x.d}</p></div>`).join('')}</div>
        </div>
        <div class="section"><h2><i data-lucide="newspaper" style="color:var(--secondary)"></i> ${this.t('latest_updates')}</h2>
          <div class="grid grid-2">${(this.state.blog || []).slice(0, 4).map(b => `<div class="card glass" onclick="SPS.nav('blog/${b.id}')"><span class="badge badge-info">${this.esc(b.category || 'Blog')}</span><h3 style="margin-top:8px">${this.esc(b.title)}</h3><p>${this.esc((b.excerpt || b.content || '').slice(0, 100))}...</p></div>`).join('') || '<p class="muted">Chưa có bài viết. Thêm trong Admin.</p>'}</div>
        </div>`;
    },

    products(main) {
      const cats = [...new Set((this.state.products || []).map(p => p.category).filter(Boolean))];
      main.innerHTML = `
        <h1 class="page-title">${this.t('products')}</h1>
        <p class="page-sub">Danh sách sản phẩm số, dịch vụ MMO và source code.</p>
        <div class="glass" style="padding:16px;margin-bottom:20px">
          <div class="input-row">
            <input id="p-search" placeholder="Tìm sản phẩm..." oninput="SPS.filterProducts()">
            <select id="p-cat" onchange="SPS.filterProducts()"><option value="">Tất cả danh mục</option>${cats.map(c => `<option>${this.esc(c)}</option>`).join('')}</select>
          </div>
          <div class="input-row mt-2">
            <select id="p-sort" onchange="SPS.filterProducts()"><option value="new">Mới nhất</option><option value="price-asc">Giá tăng dần</option><option value="price-desc">Giá giảm dần</option></select>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="p-featured" onchange="SPS.filterProducts()" style="width:auto"> Chỉ nổi bật</label>
          </div>
        </div>
        <div id="products-grid" class="grid grid-3"></div>`;
      this.filterProducts();
    },
    filterProducts() {
      const q = (document.getElementById('p-search')?.value || '').toLowerCase();
      const cat = document.getElementById('p-cat')?.value || '';
      const sort = document.getElementById('p-sort')?.value || 'new';
      const feat = document.getElementById('p-featured')?.checked;
      let list = (this.state.products || []).filter(p => (!q || (p.name || '').toLowerCase().includes(q)) && (!cat || p.category === cat) && (!feat || p.featured));
      if (sort === 'price-asc') list.sort((a, b) => (+a.price || 0) - (+b.price || 0));
      else if (sort === 'price-desc') list.sort((a, b) => (+b.price || 0) - (+a.price || 0));
      else list.sort((a, b) => (b.created || 0) - (a.created || 0));
      const grid = document.getElementById('products-grid');
      if (!grid) return;
      grid.innerHTML = list.length ? list.map(p => this.renderProductCard(p)).join('') : '<p class="muted">Không có sản phẩm.</p>';
      if (window.lucide) lucide.createIcons();
    },
    renderProductCard(p) {
      return `<div class="card glass product-card"><div class="product-img"><i data-lucide="package"></i></div><div class="product-body">${p.featured ? '<span class="badge badge-warn">★ Nổi bật</span>' : ''}<h3>${this.esc(p.name || '')}</h3><p>${this.esc(p.category || '')}</p><div class="price">${(+p.price || 0).toLocaleString('vi-VN')}₫ ${p.sale ? `<s>${(+p.sale).toLocaleString('vi-VN')}₫</s>` : ''}</div><button class="btn btn-primary btn-sm" onclick="SPS.openOrder('${p.id}')"><i data-lucide="shopping-cart"></i> Đặt hàng</button></div></div>`;
    },
    openOrder(id) {
      const p = (this.state.products || []).find(x => x.id === id);
      if (!p) return;
      this.modal(`
        <h3>🛒 Đặt hàng</h3>
        <div class="glass" style="padding:14px;margin-bottom:14px"><strong>${this.esc(p.name)}</strong><br><span class="muted">${this.esc(p.category || '')}</span><br><span style="color:var(--primary);font-size:18px;font-weight:700">${(+p.price || 0).toLocaleString('vi-VN')}₫</span></div>
        <div class="form-group"><label>Số lượng</label><input type="number" id="ord-qty" value="1" min="1" oninput="SPS.updateOrderTotal('${p.id}')"></div>
        <div class="form-group"><label>Họ tên</label><input id="ord-name"></div>
        <div class="form-group"><label>SĐT / Email</label><input id="ord-contact"></div>
        <div class="form-group"><label>Ghi chú</label><textarea id="ord-note" rows="2"></textarea></div>
        <div class="glass" style="padding:12px;margin-bottom:14px">Tổng: <strong id="ord-total" style="color:var(--primary);font-size:18px">${(+p.price || 0).toLocaleString('vi-VN')}₫</strong></div>

        <p class="muted" style="font-size:12px;margin-top:14px">⚠️ Đơn được lưu local. KHÔNG tự xác nhận thanh toán.</p>
      `);
    },
    updateOrderTotal(id) {
      const p = (this.state.products || []).find(x => x.id === id);
      const qty = +document.getElementById('ord-qty').value || 1;
      document.getElementById('ord-total').textContent = ((+p.price || 0) * qty).toLocaleString('vi-VN') + '₫';
    },
    submitOrder(id) {
      const p = (this.state.products || []).find(x => x.id === id);
      const qty = +document.getElementById('ord-qty').value || 1;
      const name = document.getElementById('ord-name').value.trim();

  totp: {
    _int: null, _secret: '',
    init() { this._secret = ''; },
    toggle() { const el = document.getElementById('totp-secret'); el.type = el.type === 'password' ? 'text' : 'password'; },
    start() {
      this._secret = document.getElementById('totp-secret').value.trim();
      if (this._int) clearInterval(this._int);
      if (!this._secret) { document.getElementById('totp-code').textContent = '------'; return; }
      this.tick(); this._int = setInterval(() => this.tick(), 1000);
    },
    async tick() {
      if (!this._secret) return;
      try {
        const code = await this.generate(this._secret);
        document.getElementById('totp-code').textContent = code;
        const rem = 30 - (Math.floor(Date.now() / 1000) % 30);
        document.getElementById('totp-timer').textContent = rem + 's';
        document.getElementById('totp-bar').style.width = ((30 - rem) / 30 * 100) + '%';
      } catch (e) { document.getElementById('totp-code').textContent = 'ERROR'; document.getElementById('totp-timer').textContent = e.message; }
    },
    base32Decode(str) {
      str = str.replace(/=+$/, '').replace(/\s+/g, '').toUpperCase();
      const map = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      let bits = 0, value = 0, out = [];
      for (const c of str) {
        const idx = map.indexOf(c);
        if (idx === -1) throw new Error('Ký tự Base32 không hợp lệ: ' + c);
        value = (value << 5) | idx; bits += 5;
        if (bits >= 8) { out.push((value >>> (bits - 8)) & 0xff); bits -= 8; }
      }
      return new Uint8Array(out);
    },
    async generate(secret, digits = 6, period = 30) {
      const key = this.base32Decode(secret);
      const counter = Math.floor(Date.now() / 1000 / period);
      const buf = new ArrayBuffer(8); const view = new DataView(buf);
      view.setUint32(0, Math.floor(counter / 0x100000000), false);
      view.setUint32(4, counter, false);
      const ck = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
      const sig = new Uint8Array(await crypto.subtle.sign('HMAC', ck, buf));
      const off = sig[sig.length - 1] & 0x0f;
      const bin = ((sig[off] & 0x7f) << 24) | ((sig[off + 1] & 0xff) << 16) | ((sig[off + 2] & 0xff) << 8) | (sig[off + 3] & 0xff);
      return String(bin % Math.pow(10, digits)).padStart(digits, '0');
    },
    copy() { const c = document.getElementById('totp-code').textContent; if (c.includes('-') || c === 'ERROR') return SPS.toast('Chưa có mã', 'error'); SPS.copy(c); }

  calendar: {
    _cur: new Date(), _sel: new Date(),
    init() { this._cur = new Date(); this._sel = new Date(); this.render(); },
    prev() { this._cur.setMonth(this._cur.getMonth() - 1); this.render(); },
    next() { this._cur.setMonth(this._cur.getMonth() + 1); this.render(); },
    render() {
      const title = document.getElementById('cal-title'); if (!title) return;
      const d = this._cur; title.textContent = d.toLocaleDateString('vi-VN', { month: 'long', year: 'numeric' });
      const y = d.getFullYear(), m = d.getMonth();
      const fd = new Date(y, m, 1).getDay();
      const dm = new Date(y, m + 1, 0).getDate();
      const today = new Date();
      const g = document.getElementById('cal-grid');
      let html = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map(w => `<div style="text-align:center;font-size:11px;color:var(--muted);padding:6px 0">${w}</div>`).join('');
      for (let i = 0; i < fd; i++) html += '<div></div>';
      for (let day = 1; day <= dm; day++) {
        const isT = y === today.getFullYear() && m === today.getMonth() && day === today.getDate();
        const isS = y === this._sel.getFullYear() && m === this._sel.getMonth() && day === this._sel.getDate();
        const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasEv = (SPS.state.events || []).some(e => e.date === ds);
        html += `<div onclick="SPS.calendar.select(${y},${m},${day})" style="text-align:center;padding:8px 4px;border-radius:8px;cursor:pointer;font-size:13px;background:${isS ? 'var(--primary)' : isT ? 'rgba(77,123,255,.2)' : 'transparent'};color:${isS ? '#fff' : 'var(--text)'};position:relative">${day}${hasEv ? '<span style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--accent);border-radius:50%"></span>' : ''}</div>`;
      }
      g.innerHTML = html;
      document.getElementById('cal-selected').textContent = this._sel.toLocaleDateString('vi-VN');
      this.renderEvents();
    },
    select(y, m, d) { this._sel = new Date(y, m, d); this.render(); },
    addEvent() {
      const t = document.getElementById('cal-ev-title').value.trim(); if (!t) return;
      const date = `${this._sel.getFullYear()}-${String(this._sel.getMonth() + 1).padStart(2, '0')}-${String(this._sel.getDate()).padStart(2, '0')}`;
      SPS.state.events = SPS.state.events || [];
      SPS.state.events.push({ id: SPS.id(), title: t, date });
      SPS.store.save(); document.getElementById('cal-ev-title').value = ''; this.render();
    },
    delEvent(id) { SPS.state.events = SPS.state.events.filter(e => e.id !== id); SPS.store.save(); this.render(); },
    renderEvents() {
      const date = `${this._sel.getFullYear()}-${String(this._sel.getMonth() + 1).padStart(2, '0')}-${String(this._sel.getDate()).padStart(2, '0')}`;
      const evs = (SPS.state.events || []).filter(e => e.date === date);
      const el = document.getElementById('cal-events'); if (!el) return;
      el.innerHTML = evs.length ? evs.map(e => `<div class="glass" style="padding:8px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:13px"><span>${SPS.esc(e.title)}</span><button class="btn btn-sm btn-danger" onclick="SPS.calendar.delEvent('${e.id}')">×</button></div>`).join('') : '<p class="muted" style="font-size:13px">Không có sự kiện.</p>';
    }

        const merged = await PDFLib.PDFDocument.create();
        for (const f of files) { const b = await f.arrayBuffer(); const d = await PDFLib.PDFDocument.load(b); const p = await merged.copyPages(d, d.getPageIndices()); p.forEach(x => merged.addPage(x)); }
        const out = await merged.save();
        SPS.download(new Blob([out], { type: 'application/pdf' }), 'sps-merged.pdf');
        SPS.toast('Đã ghép ' + files.length + ' file', 'success');
      } catch (e) { SPS.toast('Lỗi: ' + e.message, 'error'); }
    },
    async text() {
      const txt = document.getElementById('pdf-text').value; if (!txt.trim()) return SPS.toast('Nhập văn bản', 'error');
      if (typeof PDFLib === 'undefined') return SPS.toast('pdf-lib chưa tải', 'error');
      try {
        const doc = await PDFLib.PDFDocument.create();
        const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
        const page = doc.addPage([595, 842]);
        let y = 800; const size = 12;
        for (const line of txt.split('\n')) {
          if (y < 40) { page.drawText(line.slice(0, 100), { x: 50, y: 40, size, font, maxWidth: 495 }); break; }
          page.drawText(line.slice(0, 100), { x: 50, y, size, font, maxWidth: 495 }); y -= size * 1.5;
        }
        const out = await doc.save();
        SPS.download(new Blob([out], { type: 'application/pdf' }), 'sps-text.pdf');
        SPS.toast('Đã tạo PDF', 'success');
      } catch (e) { SPS.toast('Lỗi: ' + e.message, 'error'); }
    },
    async split() {
      const file = document.getElementById('pdf-split-file').files[0];
      const from = +document.getElementById('pdf-split-from').value;
      const to = +document.getElementById('pdf-split-to').value;
      if (!file) return SPS.toast('Chọn file', 'error');
      if (!from || !to || from < 1 || to < from) return SPS.toast('Khoảng trang không hợp lệ', 'error');
      if (typeof PDFLib === 'undefined') return SPS.toast('pdf-lib chưa tải', 'error');
      try {
        const b = await file.arrayBuffer();
        const d = await PDFLib.PDFDocument.load(b);
        const total = d.getPageCount();
        const fi = from - 1, ti = Math.min(to - 1, total - 1);
        if (fi >= total) return SPS.toast('Trang vượt quá ' + total, 'error');
        const nd = await PDFLib.PDFDocument.create();
        const idx = []; for (let i = fi; i <= ti; i++) idx.push(i);
        const ps = await nd.copyPages(d, idx); ps.forEach(p => nd.addPage(p));
        const out = await nd.save();
        SPS.download(new Blob([out], { type: 'application/pdf' }), `sps-pages-${from}-${ti + 1}.pdf`);
        SPS.toast('Đã tách ' + idx.length + ' trang', 'success');
      } catch (e) { SPS.toast('Lỗi: ' + e.message, 'error'); }
    },
    async meta() {
      const file = document.getElementById('pdf-meta-file').files[0];
      const out = document.getElementById('pdf-meta-out'); if (!file) return;
      if (typeof PDFLib === 'undefined') return SPS.toast('pdf-lib chưa tải', 'error');
      try {
        const b = await file.arrayBuffer();
        const d = await PDFLib.PDFDocument.load(b);
        out.innerHTML = `<div class="glass" style="padding:12px"><div><strong>Trang:</strong> ${d.getPageCount()}</div><div><strong>Tiêu đề:</strong> ${SPS.esc(d.getTitle() || 'N/A')}</div><div><strong>Tác giả:</strong> ${SPS.esc(d.getAuthor() || 'N/A')}</div><div><strong>Chủ đề:</strong> ${SPS.esc(d.getSubject() || 'N/A')}</div><div><strong>Dung lượng:</strong> ${(file.size / 1024).toFixed(1)} KB</div></div>`;
      } catch (e) { out.innerHTML = '<span style="color:var(--danger)">Lỗi: ' + SPS.esc(e.message) + '</span>'; }
    }
  },

  async imgbbUpload() {
    const key = document.getElementById('imgbb-key').value.trim();
    const file = document.getElementById('imgbb-file').files[0];
    const out = document.getElementById('imgbb-result');
    if (!key) return SPS.toast('Nhập ImgBB API key', 'error');
    if (!file) return SPS.toast('Chọn ảnh', 'error');
    if (file.size > 32 * 1024 * 1024) return SPS.toast('Vượt 32MB', 'error');
    out.innerHTML = '<p class="muted">Đang upload...</p>';
    try {
      const fd = new FormData(); fd.append('image', file);
      const r = await fetch(`https://api.imgbb.com/1/upload?key=${key}`, { method: 'POST', body: fd });
      const d = await r.json();
      if (!d.success) throw new Error(d.error?.message || 'Upload thất bại');
      const url = d.data.url;
      out.innerHTML = `<div class="glass" style="padding:12px;word-break:break-all"><strong>URL:</strong><br>${SPS.esc(url)} <button class="btn btn-sm mt-2" onclick="SPS.copy('${url}')">Sao chép</button></div><img src="${url}" style="max-width:100%;border-radius:12px;margin-top:10px">`;
    } catch (e) { out.innerHTML = `<span class="badge badge-danger">Lỗi</span> ${SPS.esc(e.message)}`; }
  },

  async cloudinaryUpload() {
    const cn = document.getElementById('cld-cloud').value.trim();
    const pr = document.getElementById('cld-preset').value.trim();
    const file = document.getElementById('cld-file').files[0];
    const out = document.getElementById('cld-result');
    if (!cn || !pr) return SPS.toast('Nhập Cloud name và preset', 'error');
    if (!file) return SPS.toast('Chọn ảnh', 'error');
    out.innerHTML = '<p class="muted">Đang upload...</p>';
    try {
      const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', pr);
      const r = await fetch(`https://api.cloudinary.com/v1_1/${cn}/image/upload`, { method: 'POST', body: fd });
      const d = await r.json();
      if (d.error) throw new Error(d.error.message);
      out.innerHTML = `<div class="glass" style="padding:12px;word-break:break-all"><strong>URL:</strong><br>${SPS.esc(d.secure_url)} <button class="btn btn-sm mt-2" onclick="SPS.copy('${d.secure_url}')">Sao chép</button></div>`;
    } catch (e) { out.innerHTML = `<span class="badge badge-danger">Lỗi</span> ${SPS.esc(e.message)}`; }
  },

  async shortUrl() {
    const url = document.getElementById('short-url').value.trim();
    const out = document.getElementById('short-result');
    if (!/^https?:\/\//i.test(url)) return SPS.toast('URL phải bắt đầu bằng http(s)://', 'error');
    out.innerHTML = '<p class="muted">Đang xử lý...</p>';
    const ep = `https://is.gd/create.php?format=simple&url=${encodeURIComponent(url)}`;
    try {
      let r = await fetch(ep); let text = await r.text();
      if (!r.ok || !text.startsWith('http')) {
        const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(ep)}`;
        r = await fetch(proxy); text = await r.text();
      }
      if (!text.startsWith('http')) throw new Error(text.trim() || 'Không thể rút gọn');
      out.innerHTML = `<div class="glass" style="padding:12px;word-break:break-all"><strong>Link:</strong><br><a href="${text}" target="_blank" style="color:var(--primary)">${text}</a> <button class="btn btn-sm mt-2" onclick="SPS.copy('${text}')">Sao chép</button></div>`;
    } catch (e) {
      out.innerHTML = `<span class="badge badge-danger">Lỗi</span> ${SPS.esc(e.message)}<br><p class="muted" style="font-size:12px;margin-top:8px">is.gd có thể đã giới hạn request. Thử lại sau.</p>`;
    }
  },

  async checkFb() {
    const url = document.getElementById('fb-url').value.trim();
    const out = document.getElementById('fb-result');
    if (!/^https?:\/\/(www\.)?(facebook|fb)\.com\//i.test(url)) { out.innerHTML = '<span class="badge badge-danger">URL không hợp lệ</span>'; return; }
    out.innerHTML = '<p class="muted">Đang kiểm tra...</p>';
    try {
      const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
      const r = await fetch(proxy, { method: 'HEAD' });
      out.innerHTML = `<div class="glass" style="padding:12px"><strong>HTTP:</strong> ${r.status}<br><span class="badge ${r.ok ? 'badge-success' : 'badge-danger'}">${r.ok ? 'Có thể truy cập' : 'Không truy cập'}</span><p class="muted" style="font-size:11px;margin-top:8px">Thời gian: ${new Date().toLocaleString('vi-VN')}</p></div>`;
    } catch (e) {
      out.innerHTML = `<span class="badge badge-warn">Không thể kiểm tra</span><p class="muted" style="font-size:12px;margin-top:6px">${SPS.esc(e.message)}. Facebook chặn truy cập từ bên thứ ba.</p>`;
    }
  },

  disaster: {
    async load() {
      const out = document.getElementById('disaster-output');
      if (!out) return;
      out.innerHTML = '<p class="muted">Đang tải cảnh báo...</p>';
      const feeds = [
        'https://vnexpress.net/rss/thoi-su.rss',
        'https://tuoitre.vn/rss/tin-moi-nhat.rss'
      ];
      try {
        let all = [];
        for (const feed of feeds) {
          try {
            const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(feed)}`;
            const r = await fetch(proxy);
            const text = await r.text();
            const doc = new DOMParser().parseFromString(text, 'text/xml');
            const items = [...doc.querySelectorAll('item')];
            all.push(...items.map(it => ({
              title: it.querySelector('title')?.textContent || '',
              link: it.querySelector('link')?.textContent || '#',
              date: it.querySelector('pubDate')?.textContent || ''
            })).filter(x => /bão|lũ|lụt|sạt lở|dông|sét|áp thấp|mưa lớn|nắng nóng|rét|triều cường|thiên tai|ngập/i.test(x.title)));
          } catch (e) {}
        }
        if (!all.length) { out.innerHTML = '<p class="muted">Không có tin cảnh báo mới. Theo dõi <a href="https://kttv.gov.vn" target="_blank" style="color:var(--primary)">kttv.gov.vn</a>.</p>'; return; }
        all = all.slice(0, 6);
        out.innerHTML = all.map(n => `<div class="glass" style="padding:10px;margin-bottom:6px"><strong>${SPS.esc(n.title)}</strong><p class="muted" style="font-size:11px;margin-top:4px">${new Date(n.date).toLocaleString('vi-VN')}</p><a href="${SPS.esc(n.link)}" target="_blank" style="color:var(--primary);font-size:12px">Đọc tiếp →</a></div>`).join('') +
          `<p class="muted" style="font-size:11px;margin-top:8px">⚠️ Tin từ báo chí, không phải cảnh báo chính thức NCHMF.</p>`;
      } catch (e) { out.innerHTML = `<span class="badge badge-danger">Lỗi</span> ${SPS.esc(e.message)}`; }
    }
  },

  music: {
    tracks: [
      { name: 'Người Đứng Wen Remix', url: 'https://m.soundcloud.com/doyu-358490204/jack-j97-ng-i-d-ng-wen-remix' },
      { name: 'Vợ Bạn Anh Remix', url: 'https://m.soundcloud.com/quang-huynhh/v-b-n-anh-remix-jack-j97-x' }
    ],
    open() {
      document.getElementById('music-widget').classList.add('open');
      const sel = document.getElementById('music-select');
      sel.innerHTML = this.tracks.map((t, i) => `<option value="${i}" ${i === SPS.state.music.track ? 'selected' : ''}>${t.name}</option>`).join('');
      this.load(SPS.state.music.track || 0);
    },
    close() { document.getElementById('music-widget').classList.remove('open'); },
    load(i) {
      SPS.state.music.track = i;
      const embed = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(this.tracks[i].url) + '&color=%234d7bff&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false';
      document.getElementById('music-iframe-wrap').innerHTML = `<iframe allow="autoplay" src="${embed}" style="height:120px"></iframe>`;
    },
    next() { const i = (SPS.state.music.track + 1) % this.tracks.length; document.getElementById('music-select').value = i; this.load(i); },
    prev() { const i = (SPS.state.music.track - 1 + this.tracks.length) % this.tracks.length; document.getElementById('music-select').value = i; this.load(i); }
  },

  effects: {
    _raf: null,
    init() {
      this.canvas = document.getElementById('effects-canvas');
      if (!this.canvas) return;
      this.ctx = this.canvas.getContext('2d');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      this.loop();
    },
    resize() { if (!this.canvas) return; this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
    loop() {
      const ctx = this.ctx; if (!ctx) return;
      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      const fx = SPS.state.effects;
      if (!SPS.state.reduceMotion) {
        if (fx.stars) { for (let i = 0; i < 30 * fx.density; i++) { ctx.fillStyle = `rgba(255,255,255,${0.3 * fx.brightness})`; ctx.beginPath(); ctx.arc((i * 137) % this.canvas.width, (i * 89 + Date.now() * 0.01 * fx.speed) % this.canvas.height, 1.2, 0, Math.PI * 2); ctx.fill(); } }
        if (fx.rain) { ctx.strokeStyle = 'rgba(150,200,255,0.4)'; ctx.lineWidth = 1; for (let i = 0; i < 80 * fx.density; i++) { const x = (i * 73 + Date.now() * 0.1 * fx.speed) % this.canvas.width; const y = (i * 137 + Date.now() * 0.8 * fx.speed) % this.canvas.height; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 15); ctx.stroke(); } }
        if (fx.snow) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; for (let i = 0; i < 40 * fx.density; i++) { const x = (i * 97 + Math.sin(Date.now() * 0.001 + i) * 30) % this.canvas.width; const y = (i * 53 + Date.now() * 0.05 * fx.speed) % this.canvas.height; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill(); } }
      }
      this._raf = requestAnimationFrame(() => this.loop());
    }
  },

  a11y: {
    render() {
      const p = document.getElementById('a11y-panel'); if (!p) return;
      const fx = SPS.state.effects;
      p.innerHTML = `<h4>♿ Trợ năng <button class="icon-btn" style="width:26px;height:26px" onclick="SPS.a11y.close()"><i data-lucide="x" style="width:14px;height:14px"></i></button></h4>
        <div class="a11y-row"><span>Theme</span><button class="btn btn-sm" onclick="SPS.toggleTheme()">${SPS.state.theme === 'dark' ? '☀️ Sáng' : '🌙 Tối'}</button></div>
        <div class="a11y-row"><span>Cỡ chữ</span><input type="range" min="12" max="22" value="${parseInt(getComputedStyle(document.documentElement).fontSize) || 16}" oninput="document.documentElement.style.setProperty('--fs', this.value + 'px')"></div>
        <div class="a11y-row"><span>Giảm chuyển động</span><label class="switch"><input type="checkbox" ${SPS.state.reduceMotion ? 'checked' : ''} onchange="SPS.state.reduceMotion=this.checked;document.documentElement.setAttribute('data-reduce-motion',this.checked?1:0);SPS.store.save()"><span></span></label></div>
        <div style="margin:12px 0 8px;font-size:12px;font-weight:600;color:var(--muted)">HIỆU ỨNG NỀN</div>
        ${[['stars', '⭐ Sao'], ['snow', '❄️ Tuyết'], ['rain', '🌧️ Mưa']].map(([k, l]) => `<div class="a11y-row"><span>${l}</span><label class="switch"><input type="checkbox" ${fx[k] ? 'checked' : ''} onchange="SPS.state.effects.${k}=this.checked;SPS.store.save()"><span></span></label></div>`).join('')}
        <div class="a11y-row"><span>Tốc độ</span><input type="range" min="0.2" max="3" step="0.1" value="${fx.speed}" oninput="SPS.state.effects.speed=+this.value;SPS.store.save()"></div>
        <div class="a11y-row"><span>Mật độ</span><input type="range" min="0.2" max="3" step="0.1" value="${fx.density}" oninput="SPS.state.effects.density=+this.value;SPS.store.save()"></div>
        <div class="a11y-row"><span>Độ sáng</span><input type="range" min="0.2" max="1.5" step="0.1" value="${fx.brightness}" oninput="SPS.state.effects.brightness=+this.value;SPS.store.save()"></div>
        <button class="btn btn-sm" style="width:100%;margin-top:12px" onclick="SPS.a11y.reset()">Đặt lại</button>`;
      if (window.lucide) lucide.createIcons();
    },
    open() { document.getElementById('a11y-panel').classList.add('open'); this.render(); },
    close() { document.getElementById('a11y-panel').classList.remove('open'); },
    toggle() { document.getElementById('a11y-panel').classList.toggle('open'); this.render(); },
    reset() { SPS.state.effects = { stars: true, snow: false, rain: false, speed: 1, density: 1, brightness: 1 }; SPS.state.reduceMotion = false; document.documentElement.removeAttribute('data-reduce-motion'); document.documentElement.style.removeProperty('--fs'); SPS.store.save(); this.render(); SPS.toast('Đã reset', 'success'); }
  },

  init() {
    this.store.load();
    document.documentElement.setAttribute('data-theme', this.state.theme || 'dark');
    document.documentElement.setAttribute('lang', this.state.lang || 'vi');
    if (this.state.reduceMotion) document.documentElement.setAttribute('data-reduce-motion', '1');

    if (!this.state.products || !this.state.products.length) {
      this.state.products = [
        { id: 'p1', name: 'Acc Liên Quân VIP', category: 'Shop Liên Quân', price: 250000, sale: 199000, featured: true, created: Date.now() - 1000 },
        { id: 'p2', name: 'Kim Cương FF 500', category: 'Shop Free Fire', price: 100000, featured: true, created: Date.now() - 2000 },
        { id: 'p3', name: 'Source Code Website Tool', category: 'Source Code', price: 500000, sale: 399000, featured: false, created: Date.now() - 3000 },
        { id: 'p4', name: 'Proxy Riêng 30 Ngày', category: 'VPN / Proxy', price: 300000, featured: true, created: Date.now() - 4000 }
      ];
      this.store.save();
    }
    if (!this.state.blog || !this.state.blog.length) {
      this.state.blog = [
        { id: 'b1', title: 'Chào mừng đến với SPS', category: 'Tin tức', author: 'Admin', content: 'SPS là nền tảng công cụ MMO và dịch vụ số dành cho cộng đồng Việt Nam.\n\nChúng tôi cung cấp nhiều tool hữu ích: TOTP, QR, PDF, Weather, Crypto và nhiều hơn nữa. Tất cả miễn phí, xử lý trên trình duyệt.', created: Date.now() - 86400000 },
        { id: 'b2', title: 'Hướng dẫn dùng TOTP Generator', category: 'Hướng dẫn', author: 'Admin', content: 'TOTP Generator giúp tạo mã 2FA 6 số từ Secret Key Base32.\n\nBước 1: Nhập secret (VD: JBSWY3DPEHPK3PXP)\nBước 2: Mã tự động cập nhật mỗi 30 giây\nBước 3: Sao chép và dùng để đăng nhập', created: Date.now() - 3600000 }
      ];
      this.store.save();
    }

    this.effects.init();
    document.getElementById('lang-btn').addEventListener('click', () => this.openLangPicker());
    document.getElementById('music-btn').addEventListener('click', () => this.music.open());
    document.getElementById('music-select').addEventListener('change', e => this.music.load(+e.target.value));
    document.getElementById('music-next').addEventListener('click', () => this.music.next());
    document.getElementById('music-prev').addEventListener('click', () => this.music.prev());
    document.getElementById('a11y-fab').addEventListener('click', () => this.a11y.toggle());

    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const tb = document.getElementById('topbar');
        if (window.scrollY > 20) tb.classList.add('scrolled'); else tb.classList.remove('scrolled');
        ticking = false;
      });
    });

    window.addEventListener('hashchange', () => this.render());
    if (!location.hash) location.hash = '#/home';

    this.render();
    this.a11y.render();
    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 100);
  }
};

document.addEventListener('DOMContentLoaded', () => SPS.init());
</script>
</body>
</html>
