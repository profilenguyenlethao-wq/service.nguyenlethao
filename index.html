const compressImage=(file,maxW=400,q=.7)=>new Promise(res=>{
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');let w=img.width,h=img.height;
    if(w>maxW){h=h*maxW/w;w=maxW}
    c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',q));
  };img.src=e.target.result};
  r.readAsDataURL(file);
});

/* ===== ICON HOOK (fix lỗi icon) ===== */
function useLucide(){
  useEffect(()=>{
    let scheduled=false;
    const run=()=>{if(!window.lucide)return;if(!document.querySelector('[data-lucide]'))return;window.lucide.createIcons();};
    const schedule=()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;run();});};
    run();
    const obs=new MutationObserver(schedule);
    obs.observe(document.body,{childList:true,subtree:true});
    return()=>obs.disconnect();
  },[]);
}

/* ===== EFFECTS ===== */
function Effects({type}){
  useEffect(()=>{
    const layer=document.getElementById('fx-layer');if(!layer)return;
    layer.innerHTML='';if(type==='none')return;
    let interval,timeouts=[];
    const add=(html,cls,styleFn,dur)=>{
      const el=document.createElement('div');el.innerHTML=html;el.className=cls;
      Object.assign(el.style,styleFn());layer.appendChild(el);
      timeouts.push(setTimeout(()=>el.remove(),dur));
    };
    if(type==='snow')interval=setInterval(()=>{
      add('❄','fx-snow',()=>({left:Math.random()*100+'vw',animationDuration:(Math.random()*4+4)+'s',opacity:Math.random()*.7+.3,fontSize:(Math.random()*10+12)+'px'}),8000);
    },300);
    else if(type==='flower'){
      const a=['🌸','🌺','🌼','🌷','🍁','🍂'];
      interval=setInterval(()=>{
        add(a[Math.floor(Math.random()*a.length)],'fx-flower',()=>({left:Math.random()*100+'vw',animationDuration:(Math.random()*4+5)+'s',fontSize:(Math.random()*12+14)+'px'}),9000);
      },500);
    }else if(type==='lava')interval=setInterval(()=>{
      const s=Math.random()*6+4;
      add('','fx-lava',()=>({left:Math.random()*100+'vw',animationDuration:(Math.random()*3+4)+'s',width:s+'px',height:s+'px',background:`radial-gradient(circle,hsl(${Math.random()*30+15},100%,60%),hsl(${Math.random()*20},100%,40%))`,borderRadius:'50%',boxShadow:'0 0 10px rgba(255,100,0,.8)'}),7000);
    },120);
    else if(type==='bubbles')interval=setInterval(()=>{
      const s=Math.random()*25+15;
      add('','fx-bubble',()=>({left:Math.random()*100+'vw',animationDuration:(Math.random()*5+5)+'s',width:s+'px',height:s+'px',border:'2px solid rgba(96,165,250,.5)',borderRadius:'50%',opacity:Math.random()*.6+.3}),10000);
    },400);
    else if(type==='fog')layer.innerHTML='<div class="fx-fog"></div>';
    return()=>{if(interval)clearInterval(interval);timeouts.forEach(t=>clearTimeout(t));layer.innerHTML='';};
  },[type]);
  return null;
}

/* ===== WEATHER ===== */
function Weather(){
  const [weather,setWeather]=useState(null);
  const [loading,setLoading]=useState(false);
  const [activeCity,setActiveCity]=useState(null);
  const cities=[
    {name:"Quy Nhơn",lat:13.78,lon:109.22},
    {name:"Nha Trang",lat:12.24,lon:109.19},
    {name:"Đà Nẵng",lat:16.05,lon:108.20},
    {name:"Hà Nội",lat:21.03,lon:105.85},
    {name:"HCM",lat:10.82,lon:106.63}
  ];
  const getW=async(lat,lon,name)=>{
    setLoading(true);
    try{
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability&timezone=Asia/Ho_Chi_Minh`);
      const d=await r.json();
      setWeather({name,current:d.current,hourly:d.hourly});setActiveCity(name);
    }catch(e){alert('Lỗi tải thời tiết');}
    setLoading(false);
  };
  const myLoc=async()=>{
    setLoading(true);
    try{
      const r=await fetch('https://ipapi.co/json/');
      const d=await r.json();
      if(d.latitude)getW(d.latitude,d.longitude,`📍 ${d.city||'Vị trí'}`);
    }catch(e){alert('Lỗi check vị trí');}
    setLoading(false);
  };
  useEffect(()=>{getW(cities[0].lat,cities[0].lon,cities[0].name);},[]);
  const codeMap={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌦',55:'🌧',61:'🌧',63:'🌧',65:'🌧',80:'🌧',95:'⛈'};
  return(
    <div className="glass p-5 rounded-2xl animate-fade-in">
      <h2 className="text-xl font-bold mb-3 flex items-center gap-2"><i data-lucide="cloud-sun" size="22" className="text-blue-500"/> Thời tiết</h2>
      <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
        {cities.map(c=>(
          <button key={c.name} onClick={()=>getW(c.lat,c.lon,c.name)} className={`whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold ${activeCity===c.name?'bg-blue-500 text-white':'glass-strong'}`}>{c.name}</button>
        ))}
        <button onClick={myLoc} className="whitespace-nowrap bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1">
          <i data-lucide="map-pin" size="12"/> Vị trí của tôi
        </button>
      </div>
      {loading?<p className="text-sm text-center py-3 animate-pulse">Đang tải...</p>:weather&&(
        <div className="mt-3 space-y-3">
          <div className="glass-strong p-4 rounded-xl flex justify-between items-center">
            <div>
              <p className="font-bold">{weather.name}</p>
              <p className="text-xs text-gray-500">Độ ẩm: {weather.current.relative_humidity_2m}% • Gió: {weather.current.wind_speed_10m} km/h</p>
            </div>
            <div className="text-right">
              <p className="text-4xl">{codeMap[weather.current.weather_code]||'🌤'}</p>
              <p className="text-2xl font-extrabold text-blue-500">{weather.current.temperature_2m}°C</p>
            </div>
          </div>
          <div>
            <p className="text-xs font-bold mb-2 text-gray-500">Dự báo 24H</p>
            <div className="overflow-x-auto no-scrollbar flex gap-3 glass-strong p-3 rounded-xl">
              {weather.hourly.time.slice(0,12).map((time,i)=>(
                <div key={i} className="text-center min-w-[60px]">
                  <p className="text-[10px] text-gray-500">{time.split('T')[1]}</p>
                  <p className="font-bold text-sm">{weather.hourly.temperature_2m[i]}°</p>
                  <p className="text-[10px] text-blue-500">{weather.hourly.precipitation_probability[i]}%</p>
                </div>
              ))}
            </div>

/* ===== SPEED TEST ===== */
function SpeedTest(){
  const [speed,setSpeed]=useState(null);
  const [testing,setTesting]=useState(false);
  const [netInfo,setNetInfo]=useState(null);
  const test=async()=>{
    setTesting(true);setSpeed(null);
    const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
    if(c)setNetInfo({type:c.effectiveType,down:c.downlink,type2:c.type||'unknown'});
    const start=performance.now();
    try{
      await fetch('https://upload.wikimedia.org/wikipedia/commons/3/3d/LARGE_elevation.jpg?cache='+Date.now(),{cache:'no-store'});
      const dur=(performance.now()-start)/1000;
      setSpeed(((5000000*8)/(dur*1000000)).toFixed(2));
    }catch(e){alert('Lỗi test mạng');}
    setTesting(false);
  };
  return(
    <div className="glass p-5 rounded-2xl animate-fade-in">
      <h2 className="text-xl font-bold mb-3 flex items-center gap-2"><i data-lucide="wifi" size="22" className="text-purple-500"/> Check 4G / 5G / WiFi</h2>
      <button onClick={test} disabled={testing} className="w-full bg-purple-500 hover:bg-purple-600 text-white py-2.5 rounded-xl font-bold shadow-lg shadow-purple-500/30 transition">
        {testing?'Đang test...':'Bắt đầu test'}
      </button>
      {netInfo&&(
        <div className="mt-3 glass-strong p-3 rounded-xl text-xs space-y-1">
          <div className="flex justify-between"><span className="text-gray-500">Loại kết nối:</span><span className="font-bold">{netInfo.type?.toUpperCase()||'N/A'}</span></div>
          <div className="flex justify-between"><span className="text-gray-500">Loại thiết bị:</span><span className="font-bold">{netInfo.type2}</span></div>
          <div className="flex justify-between"><span className="text-gray-500">Ước tính:</span><span className="font-bold">{netInfo.down} Mbps</span></div>
        </div>
      )}
      {speed&&(
        <div className="mt-3 glass-strong p-4 rounded-xl text-center">
          <p className="text-xs text-gray-500">Tốc độ tải xuống</p>
          <p className="text-3xl font-extrabold text-purple-500">{speed} <span className="text-lg">Mbps</span></p>
        </div>
      )}
    </div>
  );
}

/* ===== TEMPMAIL ===== */
function TempMail(){
  const [mail,setMail]=useState(()=>ls.get('tempmail',null));
  const [messages,setMessages]=useState([]);
  const [loading,setLoading]=useState(false);
  const [showDetail,setShowDetail]=useState(null);
  const create=async()=>{
    setLoading(true);
    try{
      const dr=await fetch('https://api.mail.tm/domains');
      const dd=await dr.json();
      const domain=dd['hydra:member'][0].domain;
      const address=`user${Math.floor(Math.random()*1000000)}@${domain}`;
      const password='Password123!';
      const cr=await fetch('https://api.mail.tm/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address,password})});
      if(!cr.ok)throw new Error();
      const tr=await fetch('https://api.mail.tm/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address,password})});
      const td=await tr.json();
      const m={address,token:td.token};
      ls.set('tempmail',m);setMail(m);
    }catch(e){alert('Lỗi tạo mail, thử lại!');}
    setLoading(false);
  };
  const fetchM=async()=>{
    if(!mail)return;
    try{
      const r=await fetch('https://api.mail.tm/messages',{headers:{Authorization:`Bearer ${mail.token}`}});
      const d=await r.json();
      setMessages(d['hydra:member']||[]);
    }catch(e){alert('Lỗi tải mail');}
  };
  const viewM=async(m)=>{
    try{
      const r=await fetch(`https://api.mail.tm/messages/${m.id}`,{headers:{Authorization:`Bearer ${mail.token}`}});
      const d=await r.json();
      setShowDetail(d);
    }catch{}
  };
  const del=()=>{ls.del('tempmail');setMail(null);setMessages([]);setShowDetail(null);};
  return(
    <div className="glass p-5 rounded-2xl animate-fade-in">
      <h2 className="text-xl font-bold mb-3 flex items-center gap-2"><i data-lucide="mail" size="22" className="text-orange-500"/> Email Tạm</h2>
      {!mail?(
        <button onClick={create} disabled={loading} className="w-full bg-orange-500 hover:bg-orange-600 text-white py-2.5 rounded-xl font-bold shadow-lg shadow-orange-500/30">
          {loading?'Đang tạo...':'Tạo Mail Tạm'}
        </button>
      ):(
        <div className="glass-strong p-3 rounded-xl text-sm">
          <p className="font-bold text-orange-500 break-all">{mail.address}</p>
          <div className="flex gap-2 mt-2">
            <button onClick={fetchM} className="flex-1 glass-strong py-1.5 rounded-lg text-xs font-bold">Tải hộp thư</button>
            <button onClick={del} className="flex-1 bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 py-1.5 rounded-lg text-xs font-bold">Xoá</button>
          </div>
          {messages.length>0&&(
            <ul className="mt-3 space-y-1 max-h-48 overflow-y-auto no-scrollbar">
              {messages.map(m=>(
                <li key={m.id} onClick={()=>viewM(m)} className="border-b border-white/30 pb-1 text-xs cursor-pointer hover:text-blue-500">
                  <p className="font-semibold">{m.subject||'(Không tiêu đề)'}</p>
                  <p className="text-gray-500 text-[10px]">Từ: {m.from?.address}</p>
                </li>
              ))}
            </ul>
          )}
          {showDetail&&(
            <div className="mt-3 p-3 glass rounded-xl text-xs max-h-60 overflow-y-auto">
              <div className="flex justify-between mb-2">
                <p className="font-bold">{showDetail.subject}</p>
                <button onClick={()=>setShowDetail(null)} className="text-red-500"><i data-lucide="x" size="14"/></button>
              </div>
              <p className="text-gray-500 mb-2 text-[10px]">{showDetail.from?.address}</p>
              <div dangerouslySetInnerHTML={{__html:Array.isArray(showDetail.html)?showDetail.html[0]:showDetail.html||showDetail.text||''}} className="prose prose-sm max-w-none"/>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

    if(!form.name||!form.price)return alert('Nhập tên & giá');
    const list=data.products||[];

      const n=list.map(x=>x.id===edit?{...form,id:edit}:x);

  const editP=p=>{setForm(p);setEdit(p.id);};
  return(
    <div className="space-y-3">
      <div className="glass p-5 rounded-2xl space-y-2">

          <button onClick={save} className="flex-1 bg-blue-500 text-white py-2 rounded-xl font-bold text-sm">{edit?'Cập nhật':'Thêm'}</button>
          {edit&&<button onClick={()=>{setEdit(null);setForm({category:'',subcategory:'',name:'',price:'',desc:'',stock:0,image:''});}} className="bg-gray-500 text-white py-2 px-4 rounded-xl text-sm">Hủy</button>}

function AdminPosts({data,setData}){
  const [edit,setEdit]=useState(null);
  const [form,setForm]=useState({title:'',content:'',image:''});
  const save=()=>{
    if(!form.title||!form.content)return alert('Nhập tiêu đề & nội dung');
    if(edit){
      setData({...data,posts:data.posts.map(p=>p.id===edit?{...form,id:edit,date:p.date}:p)});
    }else{
      setData({...data,posts:[...data.posts,{...form,id:Date.now(),date:new Date().toISOString()}]});
    }
    setForm({title:'',content:'',image:''});setEdit(null);
  };
  const updImg=async e=>{const f=e.target.files[0];if(!f)return;const b64=await compressImage(f,600,.7);setForm({...form,image:b64});};
  return(
    <div className="space-y-3">
      <div className="glass p-5 rounded-2xl space-y-2">
        <input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Tiêu đề" className="w-full glass-strong rounded-xl px-3 py-2 text-sm outline-none"/>
        <textarea value={form.content} onChange={e=>setForm({...form,content:e.target.value})} placeholder="Nội dung..." rows="4" className="w-full glass-strong rounded-xl px-3 py-2 text-sm outline-none"/>
        <div className="flex items-center gap-2">
          {form.image&&<img src={form.image} className="w-12 h-12 rounded object-cover"/>}
          <input type="file" accept="image/*" onChange={updImg} className="text-xs"/>
        </div>
        <div className="flex gap-2">
          <button onClick={save} className="flex-1 bg-green-500 text-white py-2 rounded-xl font-bold text-sm">{edit?'Cập nhật':'Đăng'}</button>
          {edit&&<button onClick={()=>{setEdit(null);setForm({title:'',content:'',image:''});}} className="bg-gray-500 text-white py-2 px-4 rounded-xl text-sm">Hủy</button>}
        </div>
      </div>
      <div className="glass p-5 rounded-2xl">
        <div className="space-y-2 max-h-96 overflow-y-auto no-scrollbar">
          {data.posts.map(p=>(
            <div key={p.id} className="glass-strong p-2 rounded-xl flex items-center gap-2">
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold truncate">{p.title}</p>
                <p className="text-[10px] text-gray-500 line-clamp-2">{p.content}</p>
              </div>
              <button onClick={()=>{setForm(p);setEdit(p.id);}} className="text-blue-500 p-1"><i data-lucide="edit" size="16"/></button>
              <button onClick={()=>confirm('Xóa?')&&setData({...data,posts:data.posts.filter(x=>x.id!==p.id)})} className="text-red-500 p-1"><i data-lucide="trash-2" size="16"/></button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ===== DRAWER MENU ===== */

  const [expanded,setExpanded]=useState(null);
  const items=[
    {id:'profile',label:'Tài khoản / Profile',icon:'user'},
    {id:'products',label:'Sản phẩm',icon:'shopping-bag',expandable:true},
    {id:'notifications',label:'Thông báo',icon:'bell'},
    {id:'posts',label:'Bài viết',icon:'newspaper'},
    {id:'ipcheck',label:'Check IP',icon:'globe'},
    {id:'weather',label:'Thời tiết',icon:'cloud-sun'},
    {id:'notes',label:'Ghi chú',icon:'sticky-note'},
    {id:'tempmail',label:'Email Tạm',icon:'mail'},
    {id:'speedtest',label:'Check 4G/5G/WiFi',icon:'wifi'},
    {id:'contact',label:'Contact Support',icon:'phone'}

    <>
      {open&&<div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40" onClick={onClose}/>}

        <div className="p-4 flex items-center gap-3 border-b border-white/20">
          <img src={data.profile.avatar} className="w-12 h-12 rounded-full object-cover border-2 border-blue-500"/>
          <div className="flex-1 min-w-0">
            <p className="font-bold flex items-center gap-1 text-sm truncate">{data.profile.name}{data.profile.verified&&<Verified size={14}/>}</p>
            <p className="text-[10px] text-gray-500 truncate">@{ADMIN_USERNAME}</p>
          </div>
          <button onClick={onClose} className="p-1"><i data-lucide="x" size="20"/></button>
        </div>
        <div className="flex-1 overflow-y-auto p-3 space-y-1">
          {items.map(it=>(
            <div key={it.id}>
              <button onClick={()=>{
                if(it.expandable)setExpanded(expanded===it.id?null:it.id);
                else{onNavigate(it.id);onClose();}

                <i data-lucide={it.icon} size="18" className="text-blue-500"/>

                      <button onClick={()=>{onNavigate('shop',c.name);onClose();}} className="w-full text-left px-2 py-1.5 rounded text-xs hover:bg-blue-500/10 flex items-center justify-between">

                          ))}

                      )}
                    </div>
                  ))}

                <i data-lucide="shield-check" size="18"/> Admin Panel

            ):(
              <button onClick={()=>{onNavigate('admin-login');onClose();}} className="drawer-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium">
                <i data-lucide="lock" size="18" className="text-gray-500"/> Đăng nhập Admin
              </button>
            )}
          </div>
        </div>
        <div className="p-3 border-t border-white/20 text-[10px] text-center text-gray-500">
          © Thao Service {new Date().getFullYear()}
        </div>
      </div>
    </>
  );
}

/* ===== ACCESSIBILITY PANEL (gộp nhạc + menu) ===== */
function Accessibility({effect,setEffect,musicOn,setMusicOn,track,setTrack}){
  const [open,setOpen]=useState(false);
  const effects=['none','snow','flower','fog','lava','bubbles'];
  const scrollTop=()=>window.scrollTo({top:0,behavior:'smooth'});
  const scrollBot=()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  const search=()=>{
    const q=prompt('Từ khóa cần tìm:');
    if(q){
      const found=window.find(q);
      if(!found)alert('Không tìm thấy!');
    }
  };
  const savePos=()=>{
    ls.set('readPos',{url:location.href,pos:window.scrollY,time:Date.now()});
    alert('Đã lưu vị trí đọc!');
  };
  return(
    <>
      <button onClick={()=>setOpen(!open)} className="fixed top-20 right-4 z-40 w-12 h-12 rounded-2xl glass-strong flex items-center justify-center shadow-xl hover:scale-105 transition" title="Trợ năng">
        <i data-lucide="sparkles" size="22" className="text-blue-500"/>
      </button>
      {open&&(
        <div className="fixed top-36 right-4 z-40 w-72 glass-strong rounded-2xl p-3 animate-fade-in shadow-2xl">
          <div className="flex justify-between items-center mb-2">
            <p className="text-xs font-bold">Tiện ích</p>
            <button onClick={()=>setOpen(false)}><i data-lucide="x" size="16"/></button>
          </div>
          <div className="grid grid-cols-4 gap-1.5 mb-2">
            <button onClick={scrollTop} title="Lên đầu" className="glass rounded-xl p-2 flex flex-col items-center"><i data-lucide="arrow-up" size="16"/></button>
            <button onClick={scrollBot} title="Xuống cuối" className="glass rounded-xl p-2 flex flex-col items-center"><i data-lucide="arrow-down" size="16"/></button>
            <button onClick={search} title="Tìm kiếm" className="glass rounded-xl p-2 flex flex-col items-center"><i data-lucide="search" size="16"/></button>
            <button onClick={savePos} title="Lưu vị trí đọc" className="glass rounded-xl p-2 flex flex-col items-center"><i data-lucide="bookmark" size="16"/></button>
          </div>
          <div className="mb-2">
            <p className="text-[10px] font-bold text-gray-500 mb-1">Hiệu ứng</p>
            <div className="grid grid-cols-3 gap-1">
              {effects.map(e=>(
                <button key={e} onClick={()=>setEffect(e)} className={`text-[10px] py-1 rounded-lg ${effect===e?'bg-blue-500 text-white':'glass'}`}>{e==='none'?'Tắt':e}</button>
              ))}
            </div>
          </div>
          <div className="mb-2">
            <p className="text-[10px] font-bold text-gray-500 mb-1 flex items-center justify-between">
              <span>Nhạc nền</span>
              <button onClick={()=>setMusicOn(!musicOn)} className={`px-2 py-0.5 rounded-full text-[10px] ${musicOn?'bg-green-500 text-white':'bg-gray-300'}`}>{musicOn?'BẬT':'TẮT'}</button>
            </p>
            {musicOn&&(
              <div className="space-y-1">
                <iframe width="100%" height="120" scrolling="no" frameBorder="no" allow="autoplay" src={`https://w.soundcloud.com/player/?url=${encodeURIComponent(SC_TRACKS[track])}&color=%233b82f6&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false&show_artwork=true`}></iframe>
                <button onClick={()=>setTrack((track+1)%SC_TRACKS.length)} className="w-full glass rounded-lg py-1 text-[10px] font-bold flex items-center justify-center gap-1"><i data-lucide="skip-forward" size="12"/> Bài kế tiếp</button>
              </div>
            )}
          </div>
        </div>
      )}
    </>
  );
}

/* ===== BOTTOM NAV (chỉ 3 nút) ===== */

/* ===== HEADER ===== */
function Header({siteName,darkMode,setDarkMode,lang,setLang,onMenuOpen}){

    <header className="glass sticky top-3 z-20 rounded-2xl p-3 mb-4 flex justify-between items-center">

      <h1 className="text-base font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-cyan-400">{siteName}</h1>

        <button onClick={()=>setLang(lang==='vi'?'en':'vi')} className="p-2 glass-strong rounded-full text-xs font-bold">{lang.toUpperCase()}</button>

          <i data-lucide={darkMode?'sun':'moon'} size="18"/>
        </button>
      </div>
    </header>
  );
}

/* ===== NOTIFICATION BANNER (dismiss 12h) ===== */
function NotifBanner({notifications}){
  const [dismissed,setDismissed]=useState(()=>ls.get('notifDismissed',{}));
  const [visible,setVisible]=useState([]);
  useEffect(()=>{
    const now=Date.now();
    const arr=notifications.filter(n=>(dismissed[n.id]||0)<now);
    setVisible(arr);
  },[notifications,dismissed]);
  if(visible.length===0)return null;
  const dismiss=id=>{
    const nd={...dismissed,[id]:Date.now()+12*60*60*1000};
    ls.set('notifDismissed',nd);setDismissed(nd);
  };
  return(
    <div className="space-y-2 mb-4">
      {visible.map(n=>(
        <div key={n.id} className="glass rounded-xl p-3 flex items-start gap-2 animate-slide-up">
          <i data-lucide="bell" size="16" className="text-blue-500 mt-0.5 flex-shrink-0"/>
          <p className="flex-1 text-xs">{n.text}</p>
          <button onClick={()=>dismiss(n.id)} className="text-gray-400 hover:text-red-500 p-0.5"><i data-lucide="x" size="14"/></button>
        </div>
      ))}
    </div>
  );
}

/* ===== MAIN APP ===== */
function App(){
  useLucide();
  const [darkMode,setDarkMode]=useState(()=>ls.get('darkMode',true));
  const [lang,setLang]=useState(()=>ls.get('lang','vi'));
  const [effect,setEffect]=useState(()=>ls.get('effect','snow'));
  const [musicOn,setMusicOn]=useState(()=>ls.get('musicOn',false));
  const [track,setTrack]=useState(0);
  const [activePage,setActivePage]=useState('profile');
  const [shopFilter,setShopFilter]=useState('');
  const [drawerOpen,setDrawerOpen]=useState(false);
  const [isAdmin,setIsAdmin]=useState(()=>ls.get('isAdmin',false));
  
  const [data,setDataState]=useState(()=>({
    profile:ls.get('profile',DEFAULT_PROFILE),
    products:ls.get('products',DEFAULT_PRODUCTS),
    posts:ls.get('posts',DEFAULT_POSTS),
    notifications:ls.get('notifications',DEFAULT_NOTIFICATIONS),
    siteName:ls.get('siteName','Thao Service'),
    defaultEffect:ls.get('defaultEffect','snow')
  }));
  
  const setData=(d)=>{
    setDataState(d);
    ls.set('profile',d.profile);ls.set('products',d.products);ls.set('posts',d.posts);
    ls.set('notifications',d.notifications);ls.set('siteName',d.siteName);ls.set('defaultEffect',d.defaultEffect);
  };
  
  useEffect(()=>{
    ls.set('darkMode',darkMode);
    document.documentElement.classList.toggle('dark',darkMode);
  },[darkMode]);
  useEffect(()=>ls.set('lang',lang),[lang]);
  useEffect(()=>ls.set('effect',effect),[effect]);
  useEffect(()=>ls.set('musicOn',musicOn),[musicOn]);
  useEffect(()=>ls.set('isAdmin',isAdmin),[isAdmin]);
  
  // restore read position
  useEffect(()=>{
    const rp=ls.get('readPos',null);
    if(rp&&rp.url===location.href&&Date.now()-rp.time<24*3600*1000)setTimeout(()=>window.scrollTo({top:rp.pos,behavior:'smooth'}),500);
  },[]);
  
  const navigate=(page,filter)=>{
    setActivePage(page);
    if(filter!==undefined)setShopFilter(filter);
    if(page==='shop'&&!filter)setShopFilter('');
    window.scrollTo({top:0,behavior:'smooth'});
  };
  
  const bottomClick=(id)=>{
    if(id==='menu')setDrawerOpen(true);
    else navigate(id);
  };
  
  return(
    <div className="max-w-4xl mx-auto p-3 pb-32">
      <Effects type={effect}/>
      <Header siteName={data.siteName} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang} onMenuOpen={()=>setDrawerOpen(true)}/>
      <NotifBanner notifications={data.notifications}/>
      
      <div className="min-h-[60vh]">
        {activePage==='profile'&&<ProfileHome profile={data.profile} posts={data.posts} products={data.products} onNavigate={navigate}/>}
        {activePage==='shop'&&<Shop products={data.products} filter={shopFilter} setFilter={setShopFilter}/>}
        {activePage==='posts'&&<PostsPage posts={data.posts}/>}
        {activePage==='notifications'&&<NotificationsPage notifications={data.notifications}/>}
        {activePage==='weather'&&<Weather/>}
        {activePage==='ipcheck'&&<IpCheck/>}
        {activePage==='speedtest'&&<SpeedTest/>}
        {activePage==='notes'&&<Notes/>}
        {activePage==='tempmail'&&<TempMail/>}
        {activePage==='contact'&&<ContactPage profile={data.profile}/>}
        {activePage==='admin-login'&&<AdminLogin onLogin={()=>{setIsAdmin(true);navigate('admin');}}/>}
        {activePage==='admin'&&(isAdmin?<AdminPanel data={data} setData={setData} onLogout={()=>{setIsAdmin(false);navigate('profile');}}/>:<AdminLogin onLogin={()=>{setIsAdmin(true);navigate('admin');}}/>)}
      </div>
      
      <Drawer open={drawerOpen} onClose={()=>setDrawerOpen(false)} activePage={activePage} onNavigate={navigate} data={data} isAdmin={isAdmin} onAdmin={()=>navigate('admin')}/>
      
      <Accessibility effect={effect} setEffect={setEffect} musicOn={musicOn} setMusicOn={setMusicOn} track={track} setTrack={setTrack}/>
      
      <BottomNav active={activePage==='shop'?'shop':activePage==='contact'?'contact':'menu'} onClick={bottomClick}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
