    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Quicksand:wght@400;600;700&display=swap');
        
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0f1e 0%, #0f172a 50%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        html.light {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #f8fafc 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Quicksand', 'Inter', sans-serif; 
            overflow-x: hidden; 
            background: var(--bg-gradient);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
            color: #f1f5f9;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.3s;
        }
        html.light body { color: #0f172a; }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Liquid Glass Core */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
        }
        .glass-strong {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), var(--glass-shadow);
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }

        .float-anim { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* Background Effects */
        .snowflake, .flower, .lava { position: fixed; top: -10px; pointer-events: none; z-index: 0; animation: fall linear forwards; }
        .lava { bottom: -10px; top: auto; border-radius: 50%; animation: rise linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: 0.1; } }
        @keyframes rise { to { transform: translateY(-105vh) rotate(-360deg); opacity: 0; } }

        /* Premium Product Card */
        .product-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
        }
        .light .product-card { background: linear-gradient(145deg, #ffffff 0%, #f0f9ff 100%); border-color: #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.4); }
        
        .product-image-wrapper {
            position: relative;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
        }
        .product-img { position: relative; z-index: 1; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .product-card:hover .product-img { transform: scale(1.1) translateY(-10px); }

        /* Buttons */
        .btn-3d { transition: all 0.1s; }
        .btn-3d:active { transform: translateY(2px) scale(0.98); box-shadow: none !important; }

        /* iOS Style Bottom Nav */
        .ios-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 50;
        }
        .light .ios-nav { background: rgba(255, 255, 255, 0.7); border-color: rgba(255, 255, 255, 0.9); }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 8px 16px; border-radius: 20px; transition: all 0.3s;
            color: #94a3b8;
        }
        .nav-item.active { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .light .nav-item.active { background: rgba(59, 130, 246, 0.1); }
        
        /* FAB */
        .fab { position: fixed; z-index: 50; touch-action: none; cursor: grab; }
        .fab:active { cursor: grabbing; }
    </style>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6' } } } }

</head>

        const compressImage = (file, maxW = 400, q = 0.7) => new Promise(res => {
            const r = new FileReader();
            r.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = h * maxW / w; w = maxW; }
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(c.toDataURL('image/jpeg', q));
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(file);
        });

        function useLucide() {
            useEffect(() => {
                let scheduled = false;
                const run = () => {
                    if (!window.lucide) return;
                    if (!document.querySelector('[data-lucide]')) return;
                    window.lucide.createIcons();
                };
                const schedule = () => {
                    if (scheduled) return;
                    scheduled = true;
                    requestAnimationFrame(() => { scheduled = false; run(); });
                };
                run();
                const obs = new MutationObserver(schedule);
                obs.observe(document.body, { childList: true, subtree: true });
                return () => obs.disconnect();
            }, []);
        }

        /* ================= EFFECTS ================= */
        function Effects({ type }) {
            useEffect(() => {
                const layer = document.getElementById('effect-layer');
                if (!layer) return;
                layer.innerHTML = '';
                if (type === 'none') return;
                
                let interval;
                const timeouts = [];
                
                const add = (html, cls, style, dur) => {
                    const el = document.createElement('div');
                    el.innerHTML = html; el.className = cls;
                    Object.assign(el.style, style);
                    layer.appendChild(el);
                    timeouts.push(setTimeout(() => el.remove(), dur));
                };

                if (type === 'snow') {
                    interval = setInterval(() => {
                        add('❄', 'snowflake', { left: Math.random()*100+'vw', animationDuration: (Math.random()*4+4)+'s', opacity: Math.random()*0.5+0.2, fontSize: (Math.random()*10+12)+'px' }, 8000);
                    }, 300);
                } else if (type === 'flower') {
                    const flowers = ['🌸','🌺','🌼','🌷','🍁','🍂'];
                    interval = setInterval(() => {
                        add(flowers[Math.floor(Math.random()*flowers.length)], 'flower', { left: Math.random()*100+'vw', animationDuration: (Math.random()*4+5)+'s', fontSize: (Math.random()*12+14)+'px' }, 9000);
                    }, 500);
                } else if (type === 'lava') {
                    interval = setInterval(() => {
                        const size = Math.random()*6+4;
                        add('', 'lava', { left: Math.random()*100+'vw', animationDuration: (Math.random()*3+4)+'s', width: size+'px', height: size+'px', background: `radial-gradient(circle, hsl(${Math.random()*30+15},100%,60%), hsl(${Math.random()*20},100%,40%))` }, 7000);
                    }, 150);
                }

                return () => { if(interval) clearInterval(interval); timeouts.forEach(t=>clearTimeout(t)); layer.innerHTML=''; };
            }, [type]);
            return null;
        }

                { name: "Hà Nội", lat: 21.03, lon: 105.85 },
                { name: "HCM", lat: 10.82, lon: 106.63 }
            ];

            const fetchWeather = async (lat, lon, name) => {
                setLoading(true);
                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,uv_index&hourly=temperature_2m,precipitation_probability,weather_code&daily=sunrise,sunset,uv_index_max,precipitation_sum,wind_speed_10m_max&timezone=Asia%2FHo_Chi_Minh`;
                    const r = await fetch(url);
                    const d = await r.json();
                    setWeather({ name, current: d.current, daily: d.daily, hourly: d.hourly });
                    setActiveCity(name);
                } catch (e) { alert('Lỗi tải thời tiết'); }
                setLoading(false);
            };

            const getMyLocation = () => {
                if (navigator.geolocation) {
                    setLoading(true);
                    navigator.geolocation.getCurrentPosition(
                        (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude, "Vị trí hiện tại"),
                        (err) => { alert('Không thể lấy vị trí. Vui lòng cấp quyền!'); setLoading(false); }

                setLoadingIp(true); setIp(null);

                    else alert('Lỗi check IP');
                } catch (e) { alert('Lỗi mạng!'); }
                setLoadingIp(false);
            };

            // Speed Test
            const testSpeed = async () => {
                setTesting(true); setSpeed(null);
                const start = performance.now();
                try {
                    await fetch('https://speed.cloudflare.com/__down?bytes=5000000&cache=' + Date.now(), { cache: 'no-store' });
                    const dur = (performance.now() - start) / 1000;
                    setSpeed(((5000000 * 8) / (dur * 1000000)).toFixed(2));
                } catch (e) { alert('Lỗi test mạng'); }
                setTesting(false);
            };

            // Temp Mail
            const createMail = async () => {
                setLoadingMail(true);
                try {
                    const dr = await fetch('https://api.mail.tm/domains');
                    const dd = await dr.json();
                    const domain = dd['hydra:member'][0].domain;
                    const address = `user${Math.floor(Math.random() * 1000000)}@${domain}`;
                    const password = 'Password123!';
                    
                    const cr = await fetch('https://api.mail.tm/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                    if (!cr.ok) throw new Error();
                    
                    const tr = await fetch('https://api.mail.tm/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                    const td = await tr.json();
                    
                    const m = { address, token: td.token };
                    ls.set('tempmail', m); setMail(m);
                } catch (e) { alert('Lỗi tạo mail, thử lại!'); }
                setLoadingMail(false);
            };

            const fetchMail = async () => {
                if (!mail) return;
                try {
                    const r = await fetch('https://api.mail.tm/messages', { headers: { Authorization: `Bearer ${mail.token}` } });

                    setMessages(d['hydra:member'] || []);
                } catch (e) { alert('Lỗi tải mail'); }

            return (

                            <button onClick={testSpeed} disabled={testing} className="w-full bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-2xl font-bold shadow-lg shadow-purple-500/30 transition btn-3d mb-4">

        /* ================= DRAWER MENU ================= */

                        <div className="flex-1 overflow-y-auto p-4 space-y-1 no-scrollbar">

                                    {it.expandable && expanded === it.id && (
                                        <div className="ml-10 mt-1 space-y-1 border-l-2 border-blue-500/30 pl-3">
                                            {CATEGORIES.map(c => (
                                                <div key={c.name}>
                                                    <button onClick={() => { onNavigate('shop', c.name); onClose(); }} className="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-gray-400 hover:text-white hover:bg-white/10 transition">
                                                        {c.name}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                            <div className="pt-4 border-t border-white/10 mt-4">

        /* ================= FLOATING FAB & MUSIC ================= */
        function GlobalTools({ effect, setEffect, musicOn, setMusicOn, track, setTrack }) {
            const [open, setOpen] = useState(false);
            const effects = ['none', 'snow', 'flower', 'lava'];
            
            // Drag logic
            const [pos, setPos] = useState(() => ls.get('fabPos', { x: window.innerWidth - 80, y: window.innerHeight - 160 }));
            const [dragging, setDragging] = useState(false);
            const [rel, setRel] = useState({ x: 0, y: 0 });

            const onStart = (e) => {
                if (e.target.closest('.fab-menu')) return;
                setDragging(true);
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                setRel({ x: clientX - pos.x, y: clientY - pos.y });
            };

            const onMove = useCallback((e) => {
                if (!dragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let newX = Math.max(10, Math.min(window.innerWidth - 70, clientX - rel.x));
                let newY = Math.max(10, Math.min(window.innerHeight - 70, clientY - rel.y));
                setPos({ x: newX, y: newY });
            }, [dragging, rel]);

            const onEnd = () => {
                setDragging(false);
                ls.set('fabPos', pos);
            };

            useEffect(() => {
                if (dragging) {
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd);
                }
                return () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onEnd);
                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('touchend', onEnd);
                };
            }, [dragging, onMove]);

            // Music Control via hidden iframe (Moved to root App for persistence, this is just UI)
            return (
                <div className="fab" style={{ left: pos.x, top: pos.y }} onMouseDown={onStart} onTouchStart={onStart}>
                    <button onClick={() => setOpen(!open)} className={`w-14 h-14 rounded-full glass-strong flex items-center justify-center shadow-2xl transition-transform ${open ? 'rotate-90 scale-110 bg-blue-600/80 border-blue-400' : 'hover:scale-105 border-white/30'}`}>
                        <i data-lucide={open ? "x" : "sparkles"} size="24" className={open ? "text-white" : "text-blue-400"}></i>
                    </button>
                    
                    {open && (
                        <div className="fab-menu absolute top-16 right-0 w-64 glass-strong rounded-3xl p-5 animate-bounce-in shadow-2xl origin-top-right border border-white/20">
                            <h4 className="text-xs font-extrabold text-blue-400 uppercase mb-3 flex items-center gap-2"><i data-lucide="settings" size="14"></i> Bảng Điều Khiển</h4>
                            
                            <div className="mb-4">
                                <p className="text-[10px] font-bold text-gray-400 mb-2">Hiệu ứng nền</p>
                                <div className="grid grid-cols-2 gap-1.5">
                                    {effects.map(e => (
                                        <button key={e} onClick={() => setEffect(e)} className={`text-[11px] py-1.5 rounded-lg capitalize transition font-bold ${effect === e ? 'bg-blue-600 text-white shadow-lg' : 'bg-black/20 text-gray-300 hover:bg-white/10'}`}>{e === 'none' ? 'Tắt' : e}</button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <p className="text-[10px] font-bold text-gray-400">Nhạc nền</p>
                                    <button onClick={() => setMusicOn(!musicOn)} className={`w-10 h-5 rounded-full relative transition-colors ${musicOn ? 'bg-green-500' : 'bg-gray-600'}`}>
                                        <div className={`absolute top-1 w-3 h-3 rounded-full bg-white transition-all ${musicOn ? 'left-6' : 'left-1'}`}></div>
                                    </button>
                                </div>
                                {musicOn && (
                                    <div className="bg-black/30 p-2 rounded-xl flex items-center justify-between border border-white/10 mt-2">
                                        <div className="flex items-center gap-2 overflow-hidden">
                                            <div className="w-8 h-8 rounded-full bg-blue-500 flex flex-shrink-0 items-center justify-center animate-spin-slow"><i data-lucide="disc" size="16" className="text-white"></i></div>
                                            <div>
                                                <p className="text-[9px] font-bold truncate text-gray-300">Đang phát...</p>
                                                <p className="text-[8px] text-gray-500 truncate w-24">Nhạc Remix</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setTrack((track + 1) % SC_TRACKS.length)} className="p-1.5 bg-white/10 rounded-lg hover:bg-white/20 transition"><i data-lucide="skip-forward" size="14"></i></button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /* ================= MAIN APP ================= */
        function App() {
            useLucide();
            const [darkMode, setDarkMode] = useState(() => ls.get('darkMode', true));
            const [effect, setEffect] = useState(() => ls.get('effect', 'snow'));
            const [musicOn, setMusicOn] = useState(false);
            const [track, setTrack] = useState(0);
            const [activePage, setActivePage] = useState('profile');
            const [shopFilter, setShopFilter] = useState('');
            const [drawerOpen, setDrawerOpen] = useState(false);
            const [isAdmin, setIsAdmin] = useState(() => ls.get('isAdmin', false));

            const [data, setDataState] = useState(() => ({
                profile: ls.get('profile', DEFAULT_PROFILE),
                products: ls.get('products', DEFAULT_PRODUCTS),
                posts: ls.get('posts', DEFAULT_POSTS),
                siteName: ls.get('siteName', 'Thao Service Premium'),
                defaultEffect: ls.get('defaultEffect', 'snow')
            }));

            const setData = (d) => {
                setDataState(d);
                ls.set('profile', d.profile); ls.set('products', d.products); ls.set('posts', d.posts);
                ls.set('siteName', d.siteName); ls.set('defaultEffect', d.defaultEffect);
            };

            useEffect(() => { 
                ls.set('darkMode', darkMode); 
                if(darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                document.documentElement.classList.toggle('light', !darkMode);
            }, [darkMode]);
            
            useEffect(() => { ls.set('effect', effect); }, [effect]);
            useEffect(() => { ls.set('isAdmin', isAdmin); }, [isAdmin]);

            const navigate = (page, filter) => {
                setActivePage(page);
                if (page === 'shop') {
                    setShopFilter(filter !== undefined ? filter : '');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Soundcloud Widget setup
            const widgetRef = useRef(null);
            useEffect(() => {
                if (!window.SC) return;
                const container = document.getElementById('sc-container');
                if (container && !container.innerHTML) {
                    container.innerHTML = `<iframe id="sc-player" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(SC_TRACKS[0])}&color=%233b82f6&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"></iframe>`;
                    widgetRef.current = window.SC.Widget(document.getElementById('sc-player'));
                }
            }, []);

            useEffect(() => {
                if (!widgetRef.current) return;
                if (musicOn) {
                    widgetRef.current.load(SC_TRACKS[track], { auto_play: true });
                } else {
                    widgetRef.current.pause();
                }
            }, [musicOn, track]);

            return (
                <div className="max-w-4xl mx-auto p-4 pb-32">
                    <Effects type={effect} />
                    
                    {/* Header - Glass */}
                    <header className="glass sticky top-4 z-30 rounded-full p-2 px-3 mb-6 flex justify-between items-center shadow-lg transition-all duration-300">
                        <button onClick={() => setDrawerOpen(true)} className="p-2.5 bg-white/10 rounded-full hover:bg-white/20 transition border border-white/5 active:scale-95"><i data-lucide="menu" size="20" className="text-blue-500"></i></button>
                        <h1 className="text-base font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300 tracking-tight">{data.siteName}</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 bg-white/10 rounded-full hover:bg-white/20 transition border border-white/5 active:scale-95">
                                <i data-lucide={darkMode ? 'sun' : 'moon'} size="18" className={darkMode ? 'text-yellow-400' : 'text-slate-700'}></i>
                            </button>
                        </div>
                    </header>

                    {/* Page Content */}
                    <div className="min-h-[60vh] relative">
                        {activePage === 'profile' && <ProfileHome profile={data.profile} posts={data.posts} onNavigate={navigate} />}
                        {activePage === 'shop' && <Shop products={data.products} filter={shopFilter} setFilter={setShopFilter} />}
                        {activePage === 'weather' && <Weather />}
                        {activePage === 'tools' && <Tools />}
                        {activePage === 'contact' && <ContactPage profile={data.profile} />}
                        {activePage === 'posts' && (
                            <div className="glass p-6 rounded-3xl space-y-4 animate-fade-in">
                                <h2 className="text-xl font-extrabold mb-4">Bài Viết Mới Nhất</h2>
                                {data.posts.map(p => (
                                    <div key={p.id} className="glass-strong p-5 rounded-2xl">
                                        <h3 className="font-bold text-blue-400">{p.title}</h3>
                                        <p className="text-xs text-gray-500 mt-1 mb-2">{new Date(p.date).toLocaleDateString('vi-VN')}</p>
                                        <p className="text-sm text-gray-300 leading-relaxed whitespace-pre-wrap">{p.content}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                        {activePage === 'admin-login' && <AdminLogin onLogin={() => { setIsAdmin(true); navigate('admin'); }} />}
                        {activePage === 'admin' && (isAdmin ? <AdminPanel data={data} setData={setData} onLogout={() => { setIsAdmin(false); navigate('profile'); }} /> : <AdminLogin onLogin={() => { setIsAdmin(true); navigate('admin'); }} />)}
                    </div>

                    {/* Floating Tools & Music Controller */}
                    <GlobalTools effect={effect} setEffect={setEffect} musicOn={musicOn} setMusicOn={setMusicOn} track={track} setTrack={setTrack} />
                    
                    {/* Drawer Menu */}
                    <Drawer open={drawerOpen} onClose={() => setDrawerOpen(false)} activePage={activePage} onNavigate={navigate} data={data} isAdmin={isAdmin} />

                    {/* iOS Style Bottom Nav */}
                    <nav className="ios-nav">
                        <button onClick={() => navigate('profile')} className={`nav-item ${activePage === 'profile' ? 'active' : ''}`}>
                            <i data-lucide="home" size="22"></i>
                            <span className="text-[10px] font-bold mt-1">Home</span>
                        </button>
                        <button onClick={() => navigate('shop')} className={`nav-item ${activePage === 'shop' ? 'active' : ''}`}>
                            <i data-lucide="shopping-bag" size="22"></i>
                            <span className="text-[10px] font-bold mt-1">Shop</span>
                        </button>
                        <button onClick={() => navigate('tools')} className={`nav-item ${activePage === 'tools' ? 'active' : ''}`}>
                            <i data-lucide="layout-grid" size="22"></i>
                            <span className="text-[10px] font-bold mt-1">Tools</span>
                        </button>
                        <button onClick={() => navigate('contact')} className={`nav-item ${activePage === 'contact' ? 'active' : ''}`}>
                            <i data-lucide="phone" size="22"></i>
                            <span className="text-[10px] font-bold mt-1">Contact</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
