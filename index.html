        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --bg-grad: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 50%, #e0e7ff 100%);
            --text-main: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.45);

        .dark {
            --bg-grad: linear-gradient(135deg, #050914 0%, #0f172a 40%, #2e1065 100%);
            --text-main: #f8fafc;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            transition: background 0.5s ease, color 0.5s ease; 
            background: var(--bg-grad);
            color: var(--text-main);
            min-height: 100vh;
            background-attachment: fixed;
        }

        /* Animated Background Lights */
        .bg-orbs {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none;
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 10s infinite ease-in-out alternate; }
        .orb-1 { background: #3b82f6; width: 300px; height: 300px; top: -10%; left: -10%; }
        .orb-2 { background: #8b5cf6; width: 400px; height: 400px; bottom: 10%; right: -20%; animation-delay: -5s; }
        .dark .orb { opacity: 0.3; }
        
        @keyframes float { 
            0% { transform: translate(0, 0) scale(1); } 
            100% { transform: translate(50px, 50px) scale(1.1); } 
        }

        /* Liquid Glass Core */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        .dark .glass { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
        
        .glass-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .dark .glass-card:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Dock Menu */
        .dock-item { transition: all 0.2s ease; }
        .dock-item:active { transform: scale(0.9); }
        .dock-active { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .dark .dock-active { background: rgba(59, 130, 246, 0.25); color: #60a5fa; }

        /* Weather Styling */
        .weather-gradient { background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(59, 130, 246, 0.2)); }
    </style>

        const compressImage = (file, maxW = 500, q = 0.7) => new Promise(res => {
            const r = new FileReader();
            r.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = h * maxW / w; w = maxW; }
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(c.toDataURL('image/jpeg', q));
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(file);
        });

        function useLucide() {
            useEffect(() => {

                obs.observe(document.body, { childList: true, subtree: true });

            }, []);

        /* ================= EFFECTS ================= */
        function Effects({ type }) {
            useEffect(() => {
                const layer = document.getElementById('effect-layer');
                if (!layer) return;
                layer.innerHTML = '';
                if (type === 'none') return;
                
                let interval;
                const timeouts = [];
                
                const add = (html, cls, style, dur) => {
                    const el = document.createElement('div');
                    el.innerHTML = html; el.className = cls;
                    Object.assign(el.style, style);
                    layer.appendChild(el);
                    timeouts.push(setTimeout(() => el.remove(), dur));
                };

                if (type === 'snow') {
                    interval = setInterval(() => {
                        add('❄', 'snowflake fixed text-white/50', { left: Math.random() * 100 + 'vw', top: '-10px', animation: `fall ${Math.random()*4+4}s linear forwards`, fontSize: (Math.random()*10+10)+'px' }, 8000);
                    }, 300);
                } else if (type === 'flower') {
                    const flowers = ['🌸', '🌺', '🌼', '🌷', '🍁'];
                    interval = setInterval(() => {
                        add(flowers[Math.floor(Math.random() * flowers.length)], 'flower fixed', { left: Math.random() * 100 + 'vw', top: '-10px', animation: `fall ${Math.random()*4+5}s linear forwards`, fontSize: (Math.random()*12+14)+'px' }, 9000);
                    }, 500);
                } else if (type === 'lava') {
                    interval = setInterval(() => {
                        const size = Math.random() * 6 + 4;
                        add('', 'lava fixed rounded-full', { left: Math.random() * 100 + 'vw', bottom: '-10px', animation: `rise ${Math.random()*3+4}s linear forwards`, width: size+'px', height: size+'px', background: `hsl(${Math.random()*30+15}, 100%, 60%)`, boxShadow: '0 0 10px rgba(255,100,0,0.8)' }, 7000);
                    }, 150);
                }
                return () => { if (interval) clearInterval(interval); timeouts.forEach(t => clearTimeout(t)); layer.innerHTML = ''; };
            }, [type]);
            return null;
        }

        function SpeedTest() {
            const [speed, setSpeed] = useState(null);
            const [testing, setTesting] = useState(false);
            const [netInfo, setNetInfo] = useState(null);
            const test = async () => {
                setTesting(true); setSpeed(null);
                const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (c) setNetInfo({ type: c.effectiveType, down: c.downlink });
                const start = performance.now();
                try {
                    await fetch('https://speed.cloudflare.com/__down?bytes=2000000&cache=' + Date.now(), { cache: 'no-store' });
                    const dur = (performance.now() - start) / 1000;
                    setSpeed(((2000000 * 8) / (dur * 1000000)).toFixed(2));
                } catch (e) { alert('Lỗi test mạng'); }
                setTesting(false);
            };
            return (
                <div className="glass p-6 rounded-3xl animate-fade-in shadow-xl">
                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="wifi" size="24" className="text-purple-500"></i> Check Mạng</h2>

        function TempMail() {
            const [mail, setMail] = useState(() => ls.get('tempmail', null));
            const [messages, setMessages] = useState([]);
            const [loading, setLoading] = useState(false);
            const create = async () => {
                setLoading(true);
                try {
                    const dr = await fetch('https://api.mail.tm/domains');
                    const dd = await dr.json();
                    const domain = dd['hydra:member'][0].domain;
                    const address = `user${Math.floor(Math.random() * 1000000)}@${domain}`;
                    const password = 'Password123!';
                    const cr = await fetch('https://api.mail.tm/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                    if (!cr.ok) throw new Error();
                    const tr = await fetch('https://api.mail.tm/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                    const td = await tr.json();
                    const m = { address, token: td.token };
                    ls.set('tempmail', m); setMail(m);
                } catch (e) { alert('Lỗi tạo mail, vui lòng thử lại!'); }
                setLoading(false);
            };
            const fetchM = async () => {
                if (!mail) return;
                try {
                    const r = await fetch('https://api.mail.tm/messages', { headers: { Authorization: `Bearer ${mail.token}` } });
                    const d = await r.json();
                    setMessages(d['hydra:member'] || []);
                } catch (e) { alert('Lỗi tải mail'); }
            };
            return (
                <div className="glass p-6 rounded-3xl animate-fade-in shadow-xl">
                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="mail" size="24" className="text-orange-500"></i> Email Tạm</h2>
                    {!mail ? (
                        <button onClick={create} disabled={loading} className="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-2xl font-bold shadow-lg shadow-orange-500/30 transition active:scale-95">
                            {loading ? 'Đang tạo...' : 'Tạo Mail Tạm'}

                    ) : (
                        <div className="glass rounded-2xl p-4 text-sm border border-white/20">
                            <p className="font-bold text-orange-500 break-all mb-3">{mail.address}</p>
                            <div className="flex gap-2">
                                <button onClick={fetchM} className="flex-1 bg-white/50 dark:bg-black/20 py-2 rounded-xl text-xs font-bold hover:bg-white/70 transition">Tải hộp thư</button>
                                <button onClick={() => { ls.del('tempmail'); setMail(null); setMessages([]); }} className="flex-1 bg-red-500/10 text-red-500 py-2 rounded-xl text-xs font-bold hover:bg-red-500/20 transition">Xoá</button>
                            </div>
                            {messages.length > 0 && (
                                <ul className="mt-4 space-y-2 max-h-48 overflow-y-auto no-scrollbar">
                                    {messages.map(m => (
                                        <li key={m.id} className="border-b border-white/10 pb-2 text-xs">

                                            <p className="opacity-60 text-[10px]">Từ: {m.from?.address}</p>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    )}
                </div>
            );
        }

            const NotifsTab = () => {

                            <button onClick={() => { if(!text)return; setData({ ...data, notifications: [...data.notifications, { id: Date.now(), text, createdAt: Date.now() }] }); setText(''); }} className="bg-blue-500 text-white px-5 rounded-xl font-bold shadow-lg active:scale-95 transition">Thêm</button>

                        <div className="space-y-2">

                                    <button onClick={() => setData({ ...data, notifications: data.notifications.filter(x => x.id !== n.id) })} className="text-red-500 p-1 hover:bg-red-500/10 rounded"><i data-lucide="trash-2" size="14"></i></button>

            return (

                                <i data-lucide={t.icon} size="14"></i> {t.label}

                    </div>
                    <div className="glass p-5 rounded-3xl shadow-xl">

        /* ================= DRAWER & NAV ================= */
        function Drawer({ open, onClose, activePage, onNavigate, data, isAdmin }) {
            const [expanded, setExpanded] = useState(null);
            const items = [
                { id: 'profile', label: 'Tài khoản / Profile', icon: 'user' },
                { id: 'shop', label: 'Sản phẩm', icon: 'shopping-bag', expandable: true },
                { id: 'notifications', label: 'Thông báo', icon: 'bell' },
                { id: 'posts', label: 'Bài viết', icon: 'newspaper' },
                { id: 'ipcheck', label: 'Check IP', icon: 'globe' },
                { id: 'weather', label: 'Thời tiết', icon: 'cloud-sun' },
                { id: 'notes', label: 'Ghi chú', icon: 'sticky-note' },
                { id: 'tempmail', label: 'Email Tạm', icon: 'mail' },
                { id: 'speedtest', label: 'Check Mạng', icon: 'wifi' },
                { id: 'contact', label: 'Liên hệ Hỗ trợ', icon: 'phone' }

            return (
                <>
                    {open && <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 transition-opacity" onClick={onClose}></div>}
                    <div className={`fixed top-0 left-0 h-full w-80 max-w-[85vw] glass z-50 transform transition-transform duration-300 ease-out ${open ? 'translate-x-0' : '-translate-x-full'} flex flex-col border-r border-white/20`}>
                        <div className="p-5 flex items-center gap-3 border-b border-white/20">
                            <img src={data.profile.avatar} className="w-14 h-14 rounded-full object-cover border-2 border-blue-500 shadow-md" alt="Avt" />
                            <div className="flex-1 min-w-0">
                                <p className="font-bold flex items-center text-sm truncate">{data.profile.name}{data.profile.verified && <VerifiedIcon size={16} />}</p>
                                <p className="text-[11px] opacity-60 truncate">@{ADMIN_USER}</p>
                            </div>
                            <button onClick={onClose} className="p-2 glass rounded-full hover:bg-white/20 transition"><i data-lucide="x" size="18"></i></button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-1.5 no-scrollbar">
                            {items.map(it => (
                                <div key={it.id}>
                                    <button onClick={() => {
                                        if (it.expandable) setExpanded(expanded === it.id ? null : it.id);
                                        else { onNavigate(it.id); onClose(); }
                                    }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all hover:bg-white/40 dark:hover:bg-white/10 ${activePage === it.id ? 'text-blue-500 bg-white/30' : ''}`}>
                                        <i data-lucide={it.icon} size="20" className={activePage === it.id ? 'text-blue-500' : 'text-blue-400'}></i>
                                        <span className="flex-1 text-left">{it.label}</span>
                                        {it.expandable && <i data-lucide={expanded === it.id ? 'chevron-down' : 'chevron-right'} size="16" className="opacity-50"></i>}
                                    </button>
                                    
                                    {it.expandable && expanded === it.id && (
                                        <div className="ml-8 mt-1 space-y-1">
                                            {CATEGORIES.map(c => (
                                                <div key={c.name}>
                                                    <button onClick={() => { onNavigate('shop', c.name); onClose(); }} className="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-white/30 dark:hover:bg-white/10 transition">
                                                        {c.name}
                                                    </button>
                                                    {c.subs.length > 0 && (
                                                        <div className="ml-3 border-l border-white/20 pl-2">
                                                            {c.subs.map(s => (
                                                                <button key={s} onClick={() => { onNavigate('shop', s); onClose(); }} className="w-full text-left px-3 py-1.5 rounded-lg text-[11px] opacity-70 hover:bg-white/30 dark:hover:bg-white/10 hover:opacity-100 transition">• {s}</button>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                            
                            <div className="pt-3 border-t border-white/20 mt-3">
                                {isAdmin ? (
                                    <button onClick={() => { onNavigate('admin'); onClose(); }} className="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold text-red-500 hover:bg-red-500/10 transition">
                                        <i data-lucide="shield-check" size="20"></i> Admin Panel
                                    </button>
                                ) : (
                                    <button onClick={() => { onNavigate('admin-login'); onClose(); }} className="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold hover:bg-white/20 transition">
                                        <i data-lucide="lock" size="20"></i> Đăng nhập Admin
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        function Accessibility({ effect, setEffect, musicOn, setMusicOn, track, setTrack, lang, setLang }) {
            const [open, setOpen] = useState(false);
            const effects = ['none', 'snow', 'flower', 'lava'];
            
            return (
                <>
                    {/* Nút trợ năng nhỏ gọn, lơ lửng */}
                    <button onClick={() => setOpen(!open)} className="fixed top-24 right-4 z-40 w-10 h-10 rounded-full glass flex items-center justify-center shadow-xl hover:scale-110 transition-transform active:scale-90">
                        <i data-lucide="settings-2" size="20" className="text-blue-500"></i>
                    </button>
                    
                    {open && (
                        <div className="fixed top-36 right-4 z-40 w-72 glass rounded-3xl p-4 animate-pop shadow-2xl border border-white/30">
                            <div className="flex justify-between items-center mb-3">
                                <p className="text-sm font-extrabold flex items-center gap-2"><i data-lucide="sliders-horizontal" size="16"></i> Tiện ích</p>
                                <button onClick={() => setOpen(false)} className="p-1 glass rounded-full hover:bg-white/20"><i data-lucide="x" size="14"></i></button>
                            </div>
                            
                            <div className="mb-4">
                                <p className="text-[10px] font-bold opacity-60 mb-1.5 uppercase tracking-wider">Hiệu ứng nền</p>
                                <div className="grid grid-cols-4 gap-1.5">
                                    {effects.map(e => (
                                        <button key={e} onClick={() => setEffect(e)} className={`text-[10px] py-1.5 rounded-xl capitalize font-bold transition ${effect === e ? 'bg-blue-500 text-white shadow-md' : 'glass hover:bg-white/40'}`}>{e === 'none' ? 'Tắt' : e}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="mb-4">
                                <p className="text-[10px] font-bold opacity-60 mb-1.5 uppercase tracking-wider">Ngôn ngữ</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setLang('vi')} className={`flex-1 text-xs py-1.5 rounded-xl font-bold ${lang === 'vi' ? 'bg-blue-500 text-white' : 'glass'}`}>Tiếng Việt</button>
                                    <button onClick={() => setLang('en')} className={`flex-1 text-xs py-1.5 rounded-xl font-bold ${lang === 'en' ? 'bg-blue-500 text-white' : 'glass'}`}>English</button>
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <p className="text-[10px] font-bold opacity-60 uppercase tracking-wider">Nhạc nền</p>
                                    <button onClick={() => setMusicOn(!musicOn)} className={`px-3 py-1 rounded-full text-[10px] font-bold transition ${musicOn ? 'bg-green-500 text-white shadow-md' : 'bg-gray-300 text-gray-600'}`}>{musicOn ? 'BẬT' : 'TẮT'}</button>
                                </div>
                                
                                {/* Nhạc luôn tồn tại trong DOM, chỉ ẩn/hiện UI */}
                                <div className={`overflow-hidden transition-all duration-300 ${musicOn ? 'h-auto opacity-100' : 'h-0 opacity-0'}`}>
                                    <div className="rounded-xl overflow-hidden glass mb-2 border border-white/20">
                                        <iframe width="100%" height="60" scrolling="no" frameBorder="no" allow="autoplay" src={`https://w.soundcloud.com/player/?url=${encodeURIComponent(SC_TRACKS[track])}&color=%233b82f6&auto_play=${musicOn}&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false`}></iframe>
                                    </div>
                                    <button onClick={() => setTrack((track + 1) % SC_TRACKS.length)} className="w-full glass rounded-xl py-2 text-xs font-bold flex justify-center items-center gap-1 hover:bg-white/40 transition">
                                        <i data-lucide="skip-forward" size="14"></i> Bài kế tiếp
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        /* ================= MAIN APP ================= */
        function App() {
            useLucide();
            const [darkMode, setDarkMode] = useState(() => ls.get('darkMode', true));
            const [effect, setEffect] = useState(() => ls.get('effect', 'snow'));
            const [musicOn, setMusicOn] = useState(() => ls.get('musicOn', false));
            const [lang, setLang] = useState(() => ls.get('lang', 'vi'));
            const [track, setTrack] = useState(0);
            const [activePage, setActivePage] = useState('profile');
            const [shopFilter, setShopFilter] = useState('');
            const [drawerOpen, setDrawerOpen] = useState(false);
            const [isAdmin, setIsAdmin] = useState(() => ls.get('isAdmin', false));
            const [scrolled, setScrolled] = useState(false);

            const [data, setDataState] = useState(() => ({
                profile: ls.get('profile', DEFAULT_PROFILE),
                products: ls.get('products', DEFAULT_PRODUCTS),
                posts: ls.get('posts', DEFAULT_POSTS),
                notifications: ls.get('notifications', DEFAULT_NOTIFS),
                siteName: ls.get('siteName', 'Thao Service'),
                defaultEffect: ls.get('defaultEffect', 'snow')
            }));

            const setData = (d) => {
                setDataState(d);
                ls.set('profile', d.profile); ls.set('products', d.products); ls.set('posts', d.posts);
                ls.set('notifications', d.notifications); ls.set('siteName', d.siteName); ls.set('defaultEffect', d.defaultEffect);
            };

            useEffect(() => { ls.set('darkMode', darkMode); document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);
            useEffect(() => { ls.set('effect', effect); }, [effect]);
            useEffect(() => { ls.set('musicOn', musicOn); }, [musicOn]);
            useEffect(() => { ls.set('isAdmin', isAdmin); }, [isAdmin]);
            useEffect(() => { ls.set('lang', lang); }, [lang]);
            
            // Hiệu ứng scroll header
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navigate = (page, filter) => {
                setActivePage(page);
                if (filter !== undefined) setShopFilter(filter);
                if (page === 'shop' && !filter) setShopFilter('');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const [dismissed, setDismissed] = useState(() => ls.get('notifDismissed', {}));
            const visibleNotifs = data.notifications.filter(n => (dismissed[n.id] || 0) < Date.now());

            return (
                <div className="max-w-3xl mx-auto p-4 pb-32">
                    <Effects type={effect} />
                    
                    {/* Nút Setting chìm */}
                    <Accessibility effect={effect} setEffect={setEffect} musicOn={musicOn} setMusicOn={setMusicOn} track={track} setTrack={setTrack} lang={lang} setLang={setLang} />
                    
                    {/* Header Glass (Chỉ hiện khi scroll) */}
                    <header className={`fixed top-0 left-0 w-full z-30 transition-all duration-300 px-4 py-3 ${scrolled ? 'glass shadow-lg' : 'bg-transparent'}`}>
                        <div className="max-w-3xl mx-auto flex justify-between items-center">
                            <h1 className="text-lg font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-cyan-400">{data.siteName}</h1>
                            <button onClick={() => setDarkMode(!darkMode)} className="w-10 h-10 glass rounded-full flex items-center justify-center shadow-md active:scale-90 transition">
                                <i data-lucide={darkMode ? 'sun' : 'moon'} size="18" className="text-yellow-500"></i>
                            </button>
                        </div>
                    </header>

                    <div className="mt-14"></div>

                    {/* Notification Banners */}
                    {visibleNotifs.length > 0 && (
                        <div className="space-y-2 mb-5">
                            {visibleNotifs.map(n => (
                                <div key={n.id} className="glass rounded-2xl p-4 flex items-start gap-3 animate-fade-in border border-white/30 shadow-md">
                                    <div className="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="bell" size="16" className="text-blue-500"></i>
                                    </div>
                                    <p className="flex-1 text-sm font-medium pt-1">{n.text}</p>
                                    <button onClick={() => { const nd = { ...dismissed, [n.id]: Date.now() + 12 * 3600 * 1000 }; ls.set('notifDismissed', nd); setDismissed(nd); }} className="text-gray-400 hover:text-red-500 transition p-1"><i data-lucide="x" size="16"></i></button>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Page Content */}
                    <div className="min-h-[70vh]">
                        {activePage === 'profile' && <ProfileHome profile={data.profile} posts={data.posts} onNavigate={navigate} />}
                        {activePage === 'shop' && <Shop products={data.products} filter={shopFilter} setFilter={setShopFilter} />}
                        {activePage === 'posts' && <PostsPage posts={data.posts} />}
                        {activePage === 'notifications' && <NotificationsPage notifications={data.notifications} />}
                        {activePage === 'weather' && <Weather />}
                        {activePage === 'ipcheck' && <IpCheck />}
                        {activePage === 'speedtest' && <SpeedTest />}
                        {activePage === 'notes' && <Notes />}
                        {activePage === 'tempmail' && <TempMail />}
                        {activePage === 'contact' && <ContactPage profile={data.profile} />}
                        {activePage === 'admin-login' && <AdminLogin onLogin={() => { setIsAdmin(true); navigate('admin'); }} />}
                        {activePage === 'admin' && (isAdmin ? <AdminPanel data={data} setData={setData} onLogout={() => { setIsAdmin(false); navigate('profile'); }} /> : <AdminLogin onLogin={() => { setIsAdmin(true); navigate('admin'); }} />)}
                    </div>

                    {/* Drawer Menu */}
                    <Drawer open={drawerOpen} onClose={() => setDrawerOpen(false)} activePage={activePage} onNavigate={navigate} data={data} isAdmin={isAdmin} />

                    {/* Bottom Nav (Floating iOS Dock) */}
                    <nav className="fixed bottom-5 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass rounded-[2.5rem] p-2 flex justify-between items-center z-30 shadow-2xl border border-white/30 backdrop-blur-3xl">
                        <button onClick={() => setDrawerOpen(true)} className={`dock-item flex-1 flex flex-col items-center py-2.5 rounded-3xl ${drawerOpen ? 'dock-active' : 'text-gray-500 hover:text-blue-500'}`}>
                            <i data-lucide="menu" size="22"></i>
                            <span className="text-[10px] font-bold mt-1">Menu</span>
                        </button>
                        <button onClick={() => navigate('shop')} className={`dock-item flex-1 flex flex-col items-center py-2.5 rounded-3xl ${activePage === 'shop' ? 'dock-active' : 'text-gray-500 hover:text-blue-500'}`}>
                            <i data-lucide="shopping-bag" size="22"></i>
                            <span className="text-[10px] font-bold mt-1">Shop</span>
                        </button>
                        <button onClick={() => navigate('weather')} className={`dock-item flex-1 flex flex-col items-center py-2.5 rounded-3xl ${activePage === 'weather' ? 'dock-active' : 'text-gray-500 hover:text-blue-500'}`}>
                            <i data-lucide="cloud-sun" size="22"></i>
                            <span className="text-[10px] font-bold mt-1">Weather</span>
                        </button>
                        <button onClick={() => navigate('contact')} className={`dock-item flex-1 flex flex-col items-center py-2.5 rounded-3xl ${activePage === 'contact' ? 'dock-active' : 'text-gray-500 hover:text-blue-500'}`}>
                            <i data-lucide="phone" size="22"></i>
                            <span className="text-[10px] font-bold mt-1">Contact</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
