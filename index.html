        /* Gradient background orbs */
        .orb {

        @keyframes float {

            66% { transform: translate(-20px, 20px) scale(0.95); }

        .dark .orb { opacity: 0.25; }

        .snowflake, .flower, .rain, .volcano, .leaf {

        .volcano { top: auto; bottom: -30px; animation: rise linear forwards; }

        .fog {

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease; }

        function Icon({ name, size = 24, className = '', strokeWidth = 2 }) {
            const node = useMemo(() => {
                if (!window.lucide || !window.lucide.icons) return null;
                const key = name.split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('');
                const data = window.lucide.icons[name] || window.lucide.icons[key];
                return Array.isArray(data) ? data : null;
            }, [name]);

            if (!node) {
                return <span className={className} style={{ display: 'inline-block', width: size, height: size }} />;
            }

            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width={size} height={size} viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" strokeWidth={strokeWidth}
                    strokeLinecap="round" strokeLinejoin="round"
                    className={className}
                >
                    {node.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
                </svg>
            );
        }

        function EffectManager({ type }) {
            useEffect(() => {
                const layer = document.getElementById('effect-layer');
                if (!layer) return;
                layer.innerHTML = '';
                if (!type || type === 'none') return;

                const configs = {
                    snow:  { chars: ['❄', '❅', '❆'], cls: 'snowflake', interval: 180, dur: [3, 6], size: [10, 20] },
                    flower:{ chars: ['🌸','🌺','🌼','🌷','🍁'], cls: 'flower', interval: 400, dur: [4, 8], size: [16, 28] },
                    leaf:  { chars: ['🍃','🍂','🍁'], cls: 'leaf', interval: 350, dur: [4, 7], size: [16, 26] },
                    rain:  { chars: ['💧'], cls: 'rain', interval: 80, dur: [0.8, 1.5], size: [10, 16] },
                    volcano:{ chars: ['🔥','💥','✨','🌟'], cls: 'volcano', interval: 350, dur: [3, 6], size: [14, 26] },
                };

                if (type === 'fog') {
                    layer.innerHTML = '<div class="fog"></div>';
                    return;
                }

                const cfg = configs[type];
                if (!cfg) return;

                const interval = setInterval(() => {
                    const el = document.createElement('div');
                    el.textContent = cfg.chars[Math.floor(Math.random() * cfg.chars.length)];
                    el.className = cfg.cls;
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.fontSize = (cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0])) + 'px';
                    el.style.animationDuration = (cfg.dur[0] + Math.random() * (cfg.dur[1] - cfg.dur[0])) + 's';
                    el.style.opacity = 0.5 + Math.random() * 0.5;
                    layer.appendChild(el);
                    setTimeout(() => el.remove(), (cfg.dur[1] + 1) * 1000);
                }, cfg.interval);

                return () => clearInterval(interval);
            }, [type]);
            return null;
        }

                        `&hourly=temperature_2m,precipitation_probability,weather_code` +
                        `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Ho_Chi_Minh&forecast_days=2`;
                    const res = await fetch(url);
                    const data = await res.json();
                    setWeather({ name, ...data });
                    setCoords({ lat, lon, name });
                } catch (e) {
                    console.error('Weather error:', e);
                } finally {
                    setLoading(false);
                }

                                </p>

        /* ============================================================
           SPEED TEST
           ============================================================ */
        function SpeedTestWidget({ t }) {
            const [speed, setSpeed] = useState(null);
            const [testing, setTesting] = useState(false);
            const [info, setInfo] = useState(null);

            const testSpeed = async () => {
                setTesting(true); setSpeed(null);
                try {
                    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    if (conn) setInfo({ type: conn.effectiveType, down: conn.downlink, rtt: conn.rtt, save: conn.saveData });

                    const start = performance.now();
                    const url = 'https://speed.cloudflare.com/__down?bytes=3000000&r=' + Date.now();
                    const res = await fetch(url, { cache: 'no-store' });
                    const blob = await res.blob();
                    const dur = (performance.now() - start) / 1000;
                    const mbps = ((blob.size * 8) / (dur * 1000000)).toFixed(2);
                    setSpeed({ mbps, size: (blob.size / 1024 / 1024).toFixed(2), time: dur.toFixed(2) });
                } catch (e) {
                    alert('Lỗi test mạng. Vui lòng thử lại!');
                } finally { setTesting(false); }
            };

            return (
                <div className="glass p-5 rounded-3xl mb-4 animate-slide-up">
                    <h2 className="text-lg font-extrabold mb-3 flex items-center gap-2">

        function IpCheckWidget({ t }) {
            const [ip, setIp] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const check = async () => {
                setLoading(true); setError(''); setIp(null);
                const apis = [
                    'https://ipwho.is/',
                    'https://ipapi.co/json/',
                    'https://ipinfo.io/json',
                ];
                for (const url of apis) {
                    try {
                        const res = await fetch(url);
                        const data = await res.json();
                        if (data.success === false) continue;
                        const info = {
                            ip: data.ip || data.query || '?',
                            city: data.city || '?',
                            region: data.region || data.region_name || '?',
                            country: data.country || data.country_name || '?',
                            countryCode: data.country_code || data.countryCode || '?',
                            postal: data.postal || data.postal_code || '?',
                            org: data.connection?.isp || data.org || data.isp || '?',
                            timezone: data.timezone?.id || data.timezone || '?',
                            isLocal: (data.country_code || data.countryCode) === 'VN',
                            type: (data.connection?.type || data.type || 'Unknown'),
                        };
                        setIp(info);
                        break;
                    } catch (e) { continue; }
                }
                if (!ip) setError('Không thể kiểm tra IP. Vui lòng thử lại sau!');
                setLoading(false);
            };

            return (
                <div className="glass p-5 rounded-3xl mb-4 animate-slide-up">
                    <h2 className="text-lg font-extrabold mb-3 flex items-center gap-2">
                        <Icon name="globe" size={22} className="text-cyan-500" /> {t.ipCheck}
                    </h2>
                    <button onClick={check} disabled={loading}
                        className="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-cyan-500/30 disabled:opacity-60 transition">
                        {loading ? '⏳ Đang check...' : '🌐 Check IP Ngay'}

                    {error && <p className="mt-3 text-xs text-red-500 text-center">{error}</p>}
                    {ip && (
                        <div className="mt-4 bg-white/50 dark:bg-black/20 p-4 rounded-2xl text-sm space-y-2">
                            <div className="flex justify-between border-b border-gray-200 dark:border-slate-700 pb-1"><span className="text-gray-500">IP:</span><span className="font-bold">{ip.ip}</span></div>
                            <div className="flex justify-between border-b border-gray-200 dark:border-slate-700 pb-1"><span className="text-gray-500">Loại:</span>
                                <span className={`font-bold ${ip.isLocal ? 'text-green-500' : 'text-orange-500'}`}>{ip.isLocal ? '🏠 Local (VN)' : '🌍 Proxy / VPN'}</span>

                            <div className="flex justify-between border-b border-gray-200 dark:border-slate-700 pb-1"><span className="text-gray-500">Quốc gia:</span><span>{ip.country}</span></div>

        /* ============================================================
           TEMP MAIL (FIXED)
           ============================================================ */
        function TempMailWidget({ t }) {
            const [mail, setMail] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tempmail') || 'null'); } catch { return null; }
            });
            const [messages, setMessages] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const createMail = async () => {
                setLoading(true); setError('');
                try {
                    const domRes = await fetch('https://api.mail.tm/domains');
                    const doms = await domRes.json();
                    const domain = doms['hydra:member'][0].domain;
                    const address = `user${Math.floor(Math.random() * 99999)}${Date.now().toString().slice(-4)}@${domain}`;
                    const password = 'Password123!';

                    const accRes = await fetch('https://api.mail.tm/accounts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address, password }),
                    });
                    if (!accRes.ok) throw new Error('Create account failed');

                    const tokRes = await fetch('https://api.mail.tm/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address, password }),
                    });
                    const tokenData = await tokRes.json();
                    if (!tokenData.token) throw new Error('No token');

                    const data = { address, token: tokenData.token };
                    localStorage.setItem('tempmail', JSON.stringify(data));
                    setMail(data);
                } catch (e) {
                    setError('Lỗi tạo mail. Vui lòng thử lại!');
                } finally { setLoading(false); }
            };

            const fetchMails = async () => {
                if (!mail) return;
                try {
                    const res = await fetch('https://api.mail.tm/messages', {
                        headers: { Authorization: `Bearer ${mail.token}` },
                    });
                    const data = await res.json();
                    setMessages(data['hydra:member'] || []);
                } catch (e) { setError('Lỗi tải hộp thư'); }
            };

            const del = () => {
                localStorage.removeItem('tempmail');
                setMail(null); setMessages([]);
            };

            const copy = () => {
                navigator.clipboard.writeText(mail.address);
                alert('Đã copy email!');
            };

            return (
                <div className="glass p-5 rounded-3xl mb-4 animate-slide-up">
                    <h2 className="text-lg font-extrabold mb-3 flex items-center gap-2">
                        <Icon name="mail" size={22} className="text-orange-500" /> {t.tempMail}
                    </h2>
                    {!mail ? (
                        <button onClick={createMail} disabled={loading}
                            className="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-orange-500/30 disabled:opacity-60 transition">
                            {loading ? '⏳ Đang tạo...' : '📧 Tạo Mail Tạm'}
                        </button>
                    ) : (
                        <div className="bg-white/50 dark:bg-black/20 p-4 rounded-2xl text-sm">
                            <p className="font-bold text-base text-orange-500 break-all">{mail.address}</p>
                            <div className="flex gap-2 mt-3">
                                <button onClick={copy} className="flex-1 bg-blue-500 text-white py-2 rounded-lg text-xs font-bold">Copy</button>
                                <button onClick={fetchMails} className="flex-1 bg-gray-200 dark:bg-gray-700 py-2 rounded-lg text-xs font-bold">Tải hộp thư</button>
                                <button onClick={del} className="flex-1 bg-red-100 dark:bg-red-900/30 text-red-600 py-2 rounded-lg text-xs font-bold">Xóa</button>
                            </div>
                            {messages.length > 0 && (
                                <ul className="mt-3 space-y-2 max-h-60 overflow-y-auto no-scrollbar">
                                    {messages.map(m => (
                                        <li key={m.id} className="bg-white dark:bg-slate-800 p-2.5 rounded-lg">
                                            <p className="font-bold text-xs">{m.from?.address}</p>
                                            <p className="text-[11px] text-gray-500 line-clamp-1">{m.subject}</p>
                                            <p className="text-[10px] text-gray-400 mt-1">{new Date(m.createdAt).toLocaleString('vi-VN')}</p>
                                        </li>
                                    ))}
                                </ul>
                            )}
                            {messages.length === 0 && <p className="text-center text-xs text-gray-500 mt-3">Chưa có tin nhắn</p>}
                        </div>
                    )}
                    {error && <p className="mt-2 text-xs text-red-500 text-center">{error}</p>}
                </div>
            );
        }

                            <input type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} placeholder="Email (không bắt buộc)"

        /* ============================================================
           ADMIN LOGIN
           ============================================================ */
        function AdminLogin({ onLogin }) {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [err, setErr] = useState('');
            const submit = (e) => {
                e.preventDefault();
                if (u === ADMIN_USER && p === ADMIN_PASS) {
                    onLogin(true);
                } else {
                    setErr('Sai tài khoản hoặc mật khẩu!');
                }
            };
            return (
                <div className="max-w-md mx-auto px-3 mt-8 animate-fade-in">
                    <div className="glass-strong rounded-3xl p-6">
                        <div className="text-center mb-5">
                            <div className="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-500 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-blue-500/30">
                                <Icon name="shield" size={32} className="text-white" />
                            </div>
                            <h2 className="text-xl font-black mt-3">Admin Login</h2>
                            <p className="text-xs text-gray-500 mt-1">Đăng nhập để quản trị website</p>
                        </div>
                        <form onSubmit={submit} className="space-y-3">
                            <input value={u} onChange={e => setU(e.target.value)} placeholder="Tài khoản" required
                                className="w-full p-3 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 ring-blue-500" />
                            <input type="password" value={p} onChange={e => setP(e.target.value)} placeholder="Mật khẩu" required
                                className="w-full p-3 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 ring-blue-500" />
                            {err && <p className="text-xs text-red-500 text-center">{err}</p>}
                            <button type="submit" className="w-full bg-gradient-to-r from-blue-500 to-purple-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-500/30 transition">
                                🔓 Đăng nhập
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        /* ============================================================
           ADMIN PANEL
           ============================================================ */
        function AdminPanel({ products, setProducts, posts, setPosts, notifications, setNotifications, settings, setSettings, onLogout }) {
            const [tab, setTab] = useState('general');
            const [editProduct, setEditProduct] = useState(null);
            const [pForm, setPForm] = useState({ name: '', price: '', desc: '', stock: 0, image: '', categoryId: 'lq', category: 'Shop Liên Quân' });
            const [postForm, setPostForm] = useState({ title: '', content: '' });
            const [notifForm, setNotifForm] = useState({ title: '', content: '' });

            const saveProduct = () => {
                if (!pForm.name || !pForm.price) return alert('Nhập tên và giá!');
                const cat = CATEGORIES.find(c => c.id === pForm.categoryId);
                const payload = { ...pForm, category: cat?.name || 'Khác', stock: Number(pForm.stock) };
                if (editProduct) {
                    const arr = products.map(x => x.id === editProduct ? { ...payload, id: editProduct } : x);
                    setProducts(arr); localStorage.setItem('products', JSON.stringify(arr));
                } else {
                    const arr = [...products, { ...payload, id: Date.now() }];
                    setProducts(arr); localStorage.setItem('products', JSON.stringify(arr));
                }
                setPForm({ name: '', price: '', desc: '', stock: 0, image: '', categoryId: 'lq', category: 'Shop Liên Quân' });
                setEditProduct(null);
                alert('✅ Đã lưu sản phẩm!');
            };

            const delProduct = (id) => {
                if (!confirm('Xóa sản phẩm này?')) return;
                const arr = products.filter(x => x.id !== id);
                setProducts(arr); localStorage.setItem('products', JSON.stringify(arr));
            };

            const editP = (p) => {
                setEditProduct(p.id);
                setPForm({ name: p.name, price: p.price, desc: p.desc, stock: p.stock, image: p.image || '', categoryId: p.categoryId || 'lq', category: p.category });
            };

            const addPost = () => {
                if (!postForm.title || !postForm.content) return;
                const arr = [{ ...postForm, id: Date.now(), date: new Date().toISOString() }, ...posts];
                setPosts(arr); localStorage.setItem('posts', JSON.stringify(arr));
                setPostForm({ title: '', content: '' });
                alert('✅ Đã đăng bài!');
            };
            const delPost = (id) => {
                if (!confirm('Xóa bài viết?')) return;
                const arr = posts.filter(x => x.id !== id);
                setPosts(arr); localStorage.setItem('posts', JSON.stringify(arr));
            };

            const addNotif = () => {
                if (!notifForm.title || !notifForm.content) return;
                const arr = [{ ...notifForm, id: Date.now(), date: new Date().toISOString() }, ...notifications];
                setNotifications(arr); localStorage.setItem('notifications', JSON.stringify(arr));
                setNotifForm({ title: '', content: '' });
                alert('✅ Đã gửi thông báo!');
            };
            const delNotif = (id) => {
                const arr = notifications.filter(x => x.id !== id);
                setNotifications(arr); localStorage.setItem('notifications', JSON.stringify(arr));
            };

            const saveSettings = (key, val) => {
                const ns = { ...settings, [key]: val };
                setSettings(ns); localStorage.setItem('settings', JSON.stringify(ns));
            };

            const uploadImage = (e, callback) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => callback(reader.result);
                reader.readAsDataURL(file);
            };

            const tabs = [
                { k: 'general', label: 'Cài đặt', icon: 'settings' },
                { k: 'products', label: 'Sản phẩm', icon: 'shopping-bag' },
                { k: 'posts', label: 'Bài viết', icon: 'file-text' },
                { k: 'notifs', label: 'Thông báo', icon: 'bell' },
            ];

            return (
                <div className="max-w-4xl mx-auto px-3 animate-fade-in">
                    <div className="glass-strong rounded-3xl p-4 mb-4 flex justify-between items-center">
                        <div>
                            <h2 className="text-xl font-black flex items-center gap-2">
                                <Icon name="shield-check" size={22} className="text-green-500" /> Admin Panel
                            </h2>
                            <p className="text-xs text-gray-500">Quản trị toàn bộ website</p>
                        </div>
                        <button onClick={onLogout} className="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold">Đăng xuất</button>
                    </div>

                    <div className="flex gap-1 glass rounded-2xl p-1 mb-4 overflow-x-auto no-scrollbar">
                        {tabs.map(tb => (
                            <button key={tb.k} onClick={() => setTab(tb.k)}
                                className={`flex-1 min-w-fit px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1 whitespace-nowrap ${tab === tb.k ? 'bg-blue-500 text-white' : 'text-gray-500'}`}>
                                <Icon name={tb.icon} size={14} /> {tb.label}
                            </button>
                        ))}
                    </div>

                    {tab === 'general' && (
                        <div className="glass rounded-3xl p-5 space-y-3">
                            <h3 className="font-bold">⚙️ Cài đặt chung</h3>
                            <div>
                                <label className="text-xs font-bold text-gray-500">Tên website</label>
                                <input value={settings.siteName} onChange={e => saveSettings('siteName', e.target.value)}
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm mt-1" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-500">Tên profile (khác tên web)</label>
                                <input value={settings.profileName} onChange={e => saveSettings('profileName', e.target.value)}
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm mt-1" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-500">Username</label>
                                <input value={settings.username} onChange={e => saveSettings('username', e.target.value)}
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm mt-1" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-500">Bio</label>
                                <textarea value={settings.bio} onChange={e => saveSettings('bio', e.target.value)} rows="2"
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm mt-1" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-500">Ảnh đại diện</label>
                                <input value={settings.avatar} onChange={e => saveSettings('avatar', e.target.value)} placeholder="URL hoặc Upload"
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm mt-1 mb-1" />
                                <input type="file" accept="image/*" onChange={e => uploadImage(e, v => saveSettings('avatar', v))} className="text-xs" />
                            </div>
                            <div className="flex items-center gap-2">
                                <input type="checkbox" checked={settings.verified} onChange={e => saveSettings('verified', e.target.checked)} className="w-4 h-4" />
                                <label className="text-sm font-bold">Hiện tick xanh</label>
                            </div>
                        </div>
                    )}

                    {tab === 'products' && (
                        <div className="space-y-3">
                            <div className="glass rounded-3xl p-5 space-y-2">
                                <h3 className="font-bold">{editProduct ? '✏️ Sửa sản phẩm' : '➕ Thêm sản phẩm'}</h3>
                                <select value={pForm.categoryId} onChange={e => setPForm({ ...pForm, categoryId: e.target.value })}
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm">
                                    {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                                <input value={pForm.name} onChange={e => setPForm({ ...pForm, name: e.target.value })} placeholder="Tên sản phẩm"
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm" />
                                <div className="flex gap-2">
                                    <input value={pForm.price} onChange={e => setPForm({ ...pForm, price: e.target.value })} placeholder="Giá (500.000đ)"
                                        className="flex-1 p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm" />
                                    <input type="number" value={pForm.stock} onChange={e => setPForm({ ...pForm, stock: e.target.value })} placeholder="Kho"
                                        className="w-24 p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm" />
                                </div>
                                <input value={pForm.desc} onChange={e => setPForm({ ...pForm, desc: e.target.value })} placeholder="Mô tả"
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm" />
                                <div>
                                    <input value={pForm.image} onChange={e => setPForm({ ...pForm, image: e.target.value })} placeholder="URL ảnh (hoặc upload)"
                                        className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm mb-1" />
                                    <input type="file" accept="image/*" onChange={e => uploadImage(e, v => setPForm({ ...pForm, image: v }))} className="text-xs" />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={saveProduct} className="flex-1 bg-blue-500 text-white py-2.5 rounded-xl font-bold">{editProduct ? 'Cập nhật' : 'Thêm'}</button>
                                    {editProduct && <button onClick={() => { setEditProduct(null); setPForm({ name: '', price: '', desc: '', stock: 0, image: '', categoryId: 'lq', category: 'Shop Liên Quân' }); }} className="px-4 bg-gray-300 dark:bg-gray-700 rounded-xl font-bold text-sm">Hủy</button>}
                                </div>
                            </div>

                            <div className="glass rounded-3xl p-5">
                                <h3 className="font-bold mb-2">📦 Danh sách ({products.length})</h3>
                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                    {products.map(p => (
                                        <div key={p.id} className="flex items-center gap-2 bg-white/60 dark:bg-black/30 p-2 rounded-xl">
                                            {p.image && <img src={p.image} className="w-10 h-10 rounded-lg object-cover" />}
                                            <div className="flex-1 min-w-0">
                                                <p className="text-xs font-bold truncate">{p.name}</p>
                                                <p className="text-[10px] text-gray-500">{p.price} • Kho: {p.stock}</p>
                                            </div>
                                            <button onClick={() => editP(p)} className="text-blue-500 p-1"><Icon name="edit" size={14} /></button>
                                            <button onClick={() => delProduct(p.id)} className="text-red-500 p-1"><Icon name="trash-2" size={14} /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {tab === 'posts' && (

                                <input value={postForm.title} onChange={e => setPostForm({ ...postForm, title: e.target.value })} placeholder="Tiêu đề"
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm" />
                                <textarea value={postForm.content} onChange={e => setPostForm({ ...postForm, content: e.target.value })} placeholder="Nội dung..." rows="4"
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm" />
                                <button onClick={addPost} className="w-full bg-green-500 text-white py-2.5 rounded-xl font-bold">Đăng bài</button>
                            </div>
                            <div className="glass rounded-3xl p-5">
                                <h3 className="font-bold mb-2">📝 Danh sách ({posts.length})</h3>
                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                    {posts.map(p => (
                                        <div key={p.id} className="flex items-center gap-2 bg-white/60 dark:bg-black/30 p-2 rounded-xl">
                                            <div className="flex-1 min-w-0">
                                                <p className="text-xs font-bold truncate">{p.title}</p>
                                                <p className="text-[10px] text-gray-500 line-clamp-1">{p.content}</p>

                                <textarea value={notifForm.content} onChange={e => setNotifForm({ ...notifForm, content: e.target.value })} placeholder="Nội dung..." rows="3"
                                    className="w-full p-2.5 bg-white/60 dark:bg-black/30 border border-gray-200 dark:border-slate-700 rounded-xl text-sm" />
                                <button onClick={addNotif} className="w-full bg-blue-500 text-white py-2.5 rounded-xl font-bold">Gửi thông báo</button>
                            </div>

                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                    {notifications.map(n => (
                                        <div key={n.id} className="flex items-center gap-2 bg-white/60 dark:bg-black/30 p-2 rounded-xl">
                                            <div className="flex-1 min-w-0">
                                                <p className="text-xs font-bold truncate">{n.title}</p>
                                                <p className="text-[10px] text-gray-500 line-clamp-1">{n.content}</p>
                                            </div>
                                            <button onClick={() => delNotif(n.id)} className="text-red-500 p-1"><Icon name="trash-2" size={14} /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /* ============================================================
           ACCESSIBILITY FLOATING MENU
           ============================================================ */
        function AccessibilityMenu({ effect, setEffect, music, setMusic, setPage, setMenuOpen, t }) {
            const [open, setOpen] = useState(false);
            const [showMusic, setShowMusic] = useState(false);
            const [track, setTrack] = useState(0);

            const scrollTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
            const scrollBot = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            const search = () => {
                const q = prompt('🔍 Tìm kiếm từ khóa:');
                if (q) alert(`Kết quả cho "${q}": (demo) Sản phẩm, bài viết liên quan...`);
            };

            const effects = ['none', 'snow', 'flower', 'leaf', 'rain', 'volcano', 'fog'];
            const nextEffect = () => {
                const idx = effects.indexOf(effect);
                setEffect(effects[(idx + 1) % effects.length]);
            };

            const embedUrl = `https://w.soundcloud.com/player/?url=${encodeURIComponent(SC_TRACKS[track] || '')}&color=%233b82f6&auto_play=${music}&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false`;

            return (
                <>
                    {/* Popup tools */}
                    {open && (
                        <div className="fixed bottom-36 right-4 z-[60] glass-strong rounded-2xl p-2 flex flex-col gap-1 animate-slide-up shadow-2xl">
                            <button onClick={scrollTop} className="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-blue-100 dark:hover:bg-blue-900/30 text-xs font-bold">
                                <Icon name="arrow-up" size={16} className="text-blue-500" /> Lên đầu trang
                            </button>
                            <button onClick={scrollBot} className="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-blue-100 dark:hover:bg-blue-900/30 text-xs font-bold">
                                <Icon name="arrow-down" size={16} className="text-blue-500" /> Xuống cuối
                            </button>
                            <button onClick={search} className="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-blue-100 dark:hover:bg-blue-900/30 text-xs font-bold">
                                <Icon name="search" size={16} className="text-blue-500" /> Tìm kiếm
                            </button>
                            <button onClick={nextEffect} className="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-blue-100 dark:hover:bg-blue-900/30 text-xs font-bold">
                                <Icon name="sparkles" size={16} className="text-purple-500" /> Hiệu ứng: <span className="capitalize">{effect}</span>
                            </button>
                            <button onClick={() => { setMusic(!music); setShowMusic(!showMusic); }} className="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-blue-100 dark:hover:bg-blue-900/30 text-xs font-bold">
                                <Icon name="music" size={16} className="text-pink-500" /> Nhạc: {music ? 'Bật' : 'Tắt'}
                            </button>
                            <button onClick={() => setMenuOpen(true)} className="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-blue-100 dark:hover:bg-blue-900/30 text-xs font-bold">
                                <Icon name="menu" size={16} className="text-green-500" /> Mở menu
                            </button>
                        </div>
                    )}

                    {/* Mini music player */}
                    {showMusic && (
                        <div className="fixed bottom-52 right-4 z-[60] w-64 glass-strong rounded-2xl p-2 animate-slide-up">
                            <div className="flex justify-between items-center px-1 mb-1">
                                <span className="text-[10px] font-bold text-pink-500">🎵 Nhạc Chill</span>
                                <div className="flex gap-1">
                                    <button onClick={() => setTrack((track - 1 + SC_TRACKS.length) % SC_TRACKS.length)} className="text-gray-500 hover:text-blue-500">
                                        <Icon name="skip-back" size={12} />
                                    </button>
                                    <button onClick={() => setTrack((track + 1) % SC_TRACKS.length)} className="text-gray-500 hover:text-blue-500">
                                        <Icon name="skip-forward" size={12} />
                                    </button>
                                    <button onClick={() => setShowMusic(false)} className="text-red-500">
                                        <Icon name="x" size={12} />
                                    </button>
                                </div>
                            </div>
                            <iframe width="100%" height="60" scrolling="no" frameBorder="no" allow="autoplay" src={embedUrl}></iframe>
                        </div>
                    )}

                    {/* Floating button */}
                    <button
                        onClick={() => setOpen(!open)}
                        className="fixed bottom-24 right-4 md:bottom-6 z-[55] w-14 h-14 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 text-white shadow-2xl shadow-blue-500/50 hover:scale-110 transition flex items-center justify-center"
                    >
                        <Icon name={open ? 'x' : 'sliders'} size={24} />
                    </button>
                </>
            );
        }

        /* ============================================================
           MENU DRAWER
           ============================================================ */
        function MenuDrawer({ open, setOpen, settings, isAdmin, onLogout, setPage, notifications, t }) {
            if (!open) return null;

            const menuSections = [
                {
                    title: 'Tài khoản', items: [
                        { label: isAdmin ? 'Bảng điều khiển' : 'Đăng nhập Admin', icon: isAdmin ? 'shield-check' : 'log-in', action: () => { setPage(isAdmin ? 'admin' : 'admin-login'); setOpen(false); } },
                        ...(isAdmin ? [{ label: 'Đăng xuất', icon: 'log-out', action: () => { onLogout(); setOpen(false); } }] : []),
                    ]
                },
                {
                    title: 'Sản phẩm', items: [
                        { label: 'Tất cả sản phẩm', icon: 'shopping-bag', action: () => { setPage('shop'); setOpen(false); } },
                        ...CATEGORIES.map(c => ({ label: c.name, icon: c.icon, action: () => { setPage('shop'); setOpen(false); }, sub: c.subs })),
                    ]
                },
                {
                    title: 'Công cụ', items: [
                        { label: 'Check IP', icon: 'globe', action: () => { setPage('checkip'); setOpen(false); } },
                        { label: 'Thời tiết', icon: 'cloud-sun', action: () => { setPage('weather'); setOpen(false); } },
                        { label: 'Ghi chú', icon: 'sticky-note', action: () => { setPage('notes'); setOpen(false); } },
                        { label: 'Temp Mail', icon: 'mail', action: () => { setPage('tempmail'); setOpen(false); } },
                        { label: 'Check 4G/5G/Wifi', icon: 'wifi', action: () => { setPage('network'); setOpen(false); } },
                    ]
                },
                {
                    title: 'Nội dung', items: [
                        { label: 'Thông báo', icon: 'bell', badge: notifications.length, action: () => { setPage('notifications'); setOpen(false); } },
                        { label: 'Bài viết', icon: 'file-text', action: () => { setPage('posts'); setOpen(false); } },
                        { label: 'Contact Support', icon: 'headphones', action: () => { setPage('contact'); setOpen(false); } },
                    ]
                }
            ];

            return (
                <div className="fixed inset-0 z-[70]">
                    <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setOpen(false)} />
                    <div className="absolute left-0 top-0 bottom-0 w-[85%] max-w-sm glass-strong overflow-y-auto animate-slide-in-left">
                        {/* Header */}
                        <div className="sticky top-0 z-10 glass-strong p-4 border-b border-white/20 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <img src={settings.avatar} className="w-10 h-10 rounded-full" />
                                <div>
                                    <p className="font-bold text-sm flex items-center gap-1">{settings.profileName} {settings.verified && <BlueCheck size={14} />}</p>
                                    <p className="text-[10px] text-gray-500">@{settings.username}</p>
                                </div>
                            </div>
                            <button onClick={() => setOpen(false)} className="p-2 hover:bg-white/20 rounded-full">
                                <Icon name="x" size={20} />
                            </button>
                        </div>

                        {/* Menu items */}
                        <div className="p-3 space-y-4">
                            {menuSections.map(section => (
                                <div key={section.title}>
                                    <p className="text-[10px] font-black text-gray-500 uppercase px-2 mb-1">{section.title}</p>
                                    <div className="space-y-0.5">
                                        {section.items.map((item, idx) => (
                                            <button key={idx} onClick={item.action}
                                                className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-blue-50 dark:hover:bg-blue-900/20 transition text-left">
                                                <div className="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center text-blue-500 flex-shrink-0">
                                                    <Icon name={item.icon} size={16} />
                                                </div>
                                                <span className="flex-1 text-sm font-semibold">{item.label}</span>
                                                {item.badge > 0 && <span className="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{item.badge}</span>}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="p-4 text-center text-[10px] text-gray-500 border-t border-white/20">
                            © {new Date().getFullYear()} {settings.siteName} — Made with 💙
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================================================
           BOTTOM NAV (3 buttons)
           ============================================================ */
        function BottomNav({ page, setPage, setMenuOpen, t }) {
            return (
                <nav className="fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] max-w-md glass-strong rounded-3xl p-1.5 flex justify-around items-center z-50 shadow-2xl shadow-blue-500/20">
                    <button onClick={() => setMenuOpen(true)} className="dock-item flex flex-col items-center p-2 px-4 rounded-2xl text-gray-500 hover:text-blue-500">
                        <Icon name="menu" size={22} /><span className="text-[10px] font-bold mt-1">Menu</span>
                    </button>
                    <button onClick={() => setPage('shop')} className={`dock-item flex flex-col items-center p-2 px-4 rounded-2xl ${page === 'shop' ? 'text-blue-500' : 'text-gray-500'}`}>
                        <Icon name="shopping-bag" size={22} /><span className="text-[10px] font-bold mt-1">Shop</span>
                    </button>
                    <button onClick={() => setPage('contact')} className={`dock-item flex flex-col items-center p-2 px-4 rounded-2xl ${page === 'contact' ? 'text-blue-500' : 'text-gray-500'}`}>
                        <Icon name="headphones" size={22} /><span className="text-[10px] font-bold mt-1">Contact</span>
                    </button>
                </nav>
            );
        }

        /* ============================================================
           MAIN APP
           ============================================================ */
        function App() {
            const [lang, setLang] = useState('vi');
            const [darkMode, setDarkMode] = useState(true);
            const [page, setPage] = useState('home');
            const [effect, setEffect] = useState('snow');
            const [menuOpen, setMenuOpen] = useState(false);
            const [isAdmin, setIsAdmin] = useState(() => sessionStorage.getItem('isAdmin') === 'true');

            const [settings, setSettings] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('settings') || 'null') || {
                        siteName: 'Service Support',
                        profileName: 'Nguyễn Lê Thảo',
                        username: 'nguyenlethao',
                        bio: 'Chuyên cung cấp dịch vụ MMO: Meta, TikTok, Google, Shop Acc Game — Uy tín, nhanh chóng!',
                        avatar: 'https://ui-avatars.com/api/?name=NL&background=3b82f6&color=fff&size=256',
                        verified: true,
                    };
                } catch { return {}; }
            });
            const [products, setProducts] = useState(() => {
                try { return JSON.parse(localStorage.getItem('products') || 'null') || DEFAULT_PRODUCTS; } catch { return DEFAULT_PRODUCTS; }
            });
            const [posts, setPosts] = useState(() => {
                try { return JSON.parse(localStorage.getItem('posts') || 'null') || DEFAULT_POSTS; } catch { return DEFAULT_POSTS; }
            });
            const [notifications, setNotifications] = useState(() => {
                try { return JSON.parse(localStorage.getItem('notifications') || 'null') || [{ id: 1, title: 'Chào mừng!', content: 'Chào mừng bạn đến với Service Support — Cảm ơn đã ghé thăm!', date: new Date().toISOString() }]; } catch { return []; }
            });
            const [dismissNotif, setDismissNotif] = useState(() => {
                const t = localStorage.getItem('notifDismiss');
                return t && Date.now() < Number(t);
            });
            const [music, setMusic] = useState(false);

            const t = {
                vi: { home: 'Trang chủ', shop: 'Sản phẩm', posts: 'Bài viết', tools: 'Tiện ích', contact: 'Liên hệ', weather: 'Thời tiết', speedTest: 'Tốc độ mạng', ipCheck: 'Check IP', notes: 'Ghi chú', tempMail: 'Mail Tạm' },
                en: { home: 'Home', shop: 'Shop', posts: 'Posts', tools: 'Tools', contact: 'Contact', weather: 'Weather', speedTest: 'Speed Test', ipCheck: 'IP Check', notes: 'Notes', tempMail: 'Temp Mail' }
            }[lang];

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            const dismissNotifNow = () => {
                setDismissNotif(true);
                localStorage.setItem('notifDismiss', String(Date.now() + 12 * 60 * 60 * 1000));
            };

            const handleLogin = (v) => {
                setIsAdmin(v);
                sessionStorage.setItem('isAdmin', String(v));
                setPage('admin');
            };
            const handleLogout = () => {
                setIsAdmin(false);
                sessionStorage.removeItem('isAdmin');
                setPage('home');
            };

            // Render current page
            const renderPage = () => {
                switch (page) {
                    case 'home': return <ProfilePage t={t} settings={settings} products={products} posts={posts} setPage={setPage} />;
                    case 'shop': return <ShopPage products={products} t={t} />;
                    case 'contact': return <ContactPage t={t} />;
                    case 'posts': return <PostsPage posts={posts} />;
                    case 'notifications': return <NotificationsPage notifications={notifications} />;
                    case 'checkip': return <div className="max-w-2xl mx-auto px-3"><IpCheckWidget t={t} /></div>;
                    case 'weather': return <div className="max-w-2xl mx-auto px-3"><WeatherWidget t={t} /></div>;
                    case 'notes': return <div className="max-w-2xl mx-auto px-3"><NoteWidget t={t} /></div>;
                    case 'tempmail': return <div className="max-w-2xl mx-auto px-3"><TempMailWidget t={t} /></div>;
                    case 'network': return <div className="max-w-2xl mx-auto px-3"><SpeedTestWidget t={t} /></div>;
                    case 'admin-login': return <AdminLogin onLogin={handleLogin} />;
                    case 'admin': return isAdmin ? <AdminPanel
                        products={products} setProducts={setProducts}
                        posts={posts} setPosts={setPosts}
                        notifications={notifications} setNotifications={setNotifications}
                        settings={settings} setSettings={setSettings}
                        onLogout={handleLogout} /> : <AdminLogin onLogin={handleLogin} />;
                    default: return <ProfilePage t={t} settings={settings} products={products} posts={posts} setPage={setPage} />;
                }
            };

            return (
                <div className="min-h-screen pb-32">
                    <EffectManager type={effect} />

                    {/* Header */}
                    <header className="sticky top-2 z-40 mx-3 mt-2 glass-strong rounded-2xl p-3 flex justify-between items-center shadow-lg">
                        <button onClick={() => setPage('home')} className="flex items-center gap-2">
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-black text-sm">NL</div>
                            <div className="text-left">
                                <p className="font-black text-sm leading-none">{settings.siteName}</p>
                                <p className="text-[10px] text-gray-500">MMO Services</p>
                            </div>
                        </button>
                        <div className="flex gap-1.5">
                            <button onClick={() => setLang(lang === 'vi' ? 'en' : 'vi')}
                                className="p-2 bg-white/50 dark:bg-black/20 rounded-xl text-[10px] font-bold w-9 h-9">{lang.toUpperCase()}</button>
                            <button onClick={() => setDarkMode(!darkMode)}
                                className="p-2 bg-white/50 dark:bg-black/20 rounded-xl w-9 h-9 flex items-center justify-center">
                                <Icon name={darkMode ? 'sun' : 'moon'} size={16} />
                            </button>
                        </div>
                    </header>

                    {/* Notification banner */}
                    {!dismissNotif && notifications.length > 0 && (
                        <div className="mx-3 mt-3 bg-gradient-to-r from-blue-500 to-purple-500 text-white p-3 rounded-2xl flex justify-between items-center text-xs shadow-lg animate-slide-up">
                            <div className="flex items-start gap-2 flex-1">
                                <Icon name="bell" size={16} className="mt-0.5 flex-shrink-0" />
                                <div>
                                    <p className="font-bold">{notifications[0].title}</p>
                                    <p className="opacity-90 text-[11px]">{notifications[0].content}</p>
                                </div>
                            </div>
                            <button onClick={dismissNotifNow} className="ml-2 p-1 hover:bg-white/20 rounded-lg flex-shrink-0">
                                <Icon name="x" size={14} />
                            </button>
                        </div>
                    )}

                    {/* Page content */}
                    <main className="mt-4">
                        {renderPage()}
                    </main>

                    {/* Accessibility menu */}
                    <AccessibilityMenu
                        effect={effect} setEffect={setEffect}
                        music={music} setMusic={setMusic}
                        setPage={setPage} setMenuOpen={setMenuOpen} t={t}
                    />

                    {/* Menu drawer */}
                    <MenuDrawer
                        open={menuOpen} setOpen={setMenuOpen}
                        settings={settings} isAdmin={isAdmin}
                        onLogout={handleLogout} setPage={setPage}
                        notifications={notifications} t={t}
                    />

                    {/* Bottom nav */}
                    <BottomNav page={page} setPage={setPage} setMenuOpen={setMenuOpen} t={t} />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
