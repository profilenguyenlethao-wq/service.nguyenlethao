        }

        /* Liquid Glass Effect */
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .glass-strong {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .dark .glass-strong {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Floating Background Animation */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 20s infinite ease-in-out;
        }
        .dark .bg-orb { opacity: 0.3; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* iPhone Dock Animation */
        .dock-item { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s; }
        .dock-item:active { transform: scale(0.85); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 10px; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Draggable FAB */
        #fab-container {
            position: fixed;
            z-index: 50;
            touch-action: none;
            cursor: grab;
        }
        #fab-container:active { cursor: grabbing; }

        /* Premium Product Card */
        .product-card {

        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .dark .product-card:hover {
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Animations for Snow/Flower */
        .snowflake { position: fixed; top: -10px; color: #e0f2fe; font-size: 1em; pointer-events: none; animation: fall linear forwards; z-index: 0; }
        .flower { position: fixed; top: -10px; font-size: 1.5em; pointer-events: none; animation: fall linear forwards; z-index: 0; }
        @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0.2; } }
    </style>

        const compressImage = (file, maxW = 400, q = 0.7) => new Promise(res => {
            const r = new FileReader();
            r.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = h * maxW / w; w = maxW; }
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(c.toDataURL('image/jpeg', q));
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(file);
        });

        function useLucide() {
            useEffect(() => {
                let scheduled = false;
                const run = () => {
                    if (!window.lucide) return;
                    if (!document.querySelector('[data-lucide]')) return;
                    window.lucide.createIcons();
                };
                const schedule = () => {
                    if (scheduled) return;
                    scheduled = true;
                    requestAnimationFrame(() => { scheduled = false; run(); });
                };
                run();
                const obs = new MutationObserver(schedule);
                obs.observe(document.body, { childList: true, subtree: true });
                return () => obs.disconnect();
            }, []);
        }

        /* ================= EFFECTS ================= */
        function Effects({ type }) {
            useEffect(() => {
                const layer = document.getElementById('effect-layer');
                if (!layer) return;
                layer.innerHTML = '';
                if (type === 'none') return;
                
                let interval;
                const add = (html, cls, style, dur) => {
                    const el = document.createElement('div');
                    el.innerHTML = html; el.className = cls;
                    Object.assign(el.style, style);
                    layer.appendChild(el);
                    setTimeout(() => el.remove(), dur);
                };

                if (type === 'snow') {
                    interval = setInterval(() => {
                        add('❄', 'snowflake', { left: Math.random() * 100 + 'vw', animationDuration: (Math.random() * 4 + 4) + 's', opacity: Math.random() * 0.7 + 0.3, fontSize: (Math.random() * 10 + 12) + 'px' }, 8000);
                    }, 400);
                } else if (type === 'flower') {
                    const flowers = ['🌸', '🌺', '🌼', '🌷', '🍁', '🍂'];
                    interval = setInterval(() => {
                        add(flowers[Math.floor(Math.random() * flowers.length)], 'flower', { left: Math.random() * 100 + 'vw', animationDuration: (Math.random() * 4 + 5) + 's', fontSize: (Math.random() * 12 + 14) + 'px' }, 9000);

                }
                return () => { if (interval) clearInterval(interval); layer.innerHTML = ''; };
            }, [type]);
            return null;

        function TempMail() {
            const [mail, setMail] = useState(() => ls.get('tempmail', null));
            const [messages, setMessages] = useState([]);
            const [loading, setLoading] = useState(false);

            const create = async () => {
                setLoading(true);
                try {
                    const dr = await fetch('https://api.mail.tm/domains');
                    const dd = await dr.json();
                    if(!dd['hydra:member'] || dd['hydra:member'].length === 0) throw new Error("No domain");
                    const domain = dd['hydra:member'][0].domain;
                    const address = `user${Math.floor(Math.random() * 1000000)}@${domain}`;
                    const password = 'Password123!';
                    
                    const cr = await fetch('https://api.mail.tm/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                    if (!cr.ok) throw new Error("Create failed");
                    
                    const tr = await fetch('https://api.mail.tm/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
                    const td = await tr.json();
                    
                    const m = { address, token: td.token };
                    ls.set('tempmail', m); setMail(m);
                } catch (e) { alert('Lỗi tạo mail, thử lại sau giây lát!'); }
                setLoading(false);
            };

            const fetchM = async () => {
                if (!mail) return;
                try {
                    const r = await fetch('https://api.mail.tm/messages', { headers: { Authorization: `Bearer ${mail.token}` } });
                    const d = await r.json();
                    setMessages(d['hydra:member'] || []);
                } catch (e) { alert('Lỗi tải mail'); }
            };

            return (
                <div className="glass p-5 rounded-3xl animate-fade-in shadow-xl">
                    <h2 className="text-xl font-bold mb-3 flex items-center gap-2"><i data-lucide="mail" size="22" className="text-orange-500"></i> Email Tạm</h2>
                    {!mail ? (
                        <button onClick={create} disabled={loading} className="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-orange-500/30 transition active:scale-95">
                            {loading ? 'Đang tạo...' : 'Tạo Mail Ngẫu Nhiên'}
                        </button>
                    ) : (
                        <div className="glass-strong p-4 rounded-2xl text-sm">
                            <p className="font-bold text-orange-500 break-all mb-3">{mail.address}</p>
                            <div className="flex gap-2 mb-3">
                                <button onClick={fetchM} className="flex-1 glass py-2 rounded-xl text-xs font-bold hover:bg-white/50 transition">Tải hộp thư</button>
                                <button onClick={() => { ls.del('tempmail'); setMail(null); setMessages([]); }} className="flex-1 bg-red-500/10 text-red-500 py-2 rounded-xl text-xs font-bold hover:bg-red-500/20 transition">Đổi Mail Khác</button>
                            </div>
                            {messages.length > 0 && (
                                <ul className="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
                                    {messages.map(m => (
                                        <li key={m.id} className="bg-white/40 dark:bg-slate-800/40 p-3 rounded-xl text-xs">
                                            <p className="font-bold text-blue-500">{m.subject || '(Không tiêu đề)'}</p>
                                            <p className="text-gray-500 mt-1">Từ: {m.from?.address}</p>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    )}
                </div>
            );
        }

                );
            };

            const PostsTab = () => {
                const save = () => {
                    if (!form.title || !form.content) return alert('Nhập tiêu đề & nội dung');
                    if (editId) setData({ ...data, posts: data.posts.map(p => p.id === editId ? { ...form, id: editId, date: p.date } : p) });
                    else setData({ ...data, posts: [...data.posts, { ...form, id: Date.now(), date: new Date().toISOString() }] });
                    setForm({}); setEditId(null);
                };
                return (
                    <div className="space-y-4">
                        <div className="glass-strong p-4 rounded-2xl space-y-3">
                            <h4 className="font-bold text-sm text-green-500">{editId ? 'Sửa bài viết' : 'Viết bài mới'}</h4>
                            <input value={form.title || ''} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="Tiêu đề bài viết" className="w-full p-2.5 rounded-xl text-sm outline-none bg-white/50 dark:bg-slate-800/50" />
                            <textarea value={form.content || ''} onChange={e => setForm({ ...form, content: e.target.value })} placeholder="Nội dung..." rows="4" className="w-full p-2.5 rounded-xl text-sm outline-none bg-white/50 dark:bg-slate-800/50" />
                            <div className="flex items-center gap-3">
                                {form.image && <img src={form.image} className="w-12 h-12 rounded-lg object-cover" />}
                                <input type="file" accept="image/*" onChange={e => updImg(e, 'image', (k, v) => setForm({ ...form, [k]: v }))} className="text-xs" />
                            </div>
                            <div className="flex gap-2 pt-2">
                                <button onClick={save} className="flex-1 bg-green-500 text-white py-2.5 rounded-xl font-bold text-sm shadow-md active:scale-95">{editId ? 'Cập nhật' : 'Đăng bài'}</button>
                                {editId && <button onClick={() => { setEditId(null); setForm({}); }} className="bg-gray-500 text-white px-4 rounded-xl text-sm active:scale-95">Hủy</button>}
                            </div>
                        </div>
                        <div className="space-y-2 max-h-80 overflow-y-auto no-scrollbar">
                            {data.posts.map(p => (
                                <div key={p.id} className="glass-strong p-3 rounded-xl flex items-center gap-3 text-xs">
                                    <div className="flex-1 font-bold">{p.title}</div>
                                    <button onClick={() => { setForm(p); setEditId(p.id); window.scrollTo(0,0); }} className="p-2 bg-blue-500/10 text-blue-500 rounded-lg"><i data-lucide="edit" size="14"></i></button>
                                    <button onClick={() => setData({ ...data, posts: data.posts.filter(x => x.id !== p.id) })} className="p-2 bg-red-500/10 text-red-500 rounded-lg"><i data-lucide="trash-2" size="14"></i></button>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const NotifsTab = () => {
                const [text, setText] = useState('');
                return (
                    <div className="space-y-4">
                        <div className="flex gap-2">
                            <input value={text} onChange={e => setText(e.target.value)} placeholder="Nhập thông báo mới..." className="flex-1 p-3 rounded-xl text-sm outline-none glass-strong focus:ring-2 ring-blue-500" />
                            <button onClick={() => { if(!text)return; setData({ ...data, notifications: [...data.notifications, { id: Date.now(), text, createdAt: Date.now() }] }); setText(''); }} className="bg-blue-500 text-white px-5 rounded-xl font-bold shadow-md active:scale-95"><i data-lucide="plus"></i></button>
                        </div>
                        <div className="space-y-2">
                            {data.notifications.map(n => (
                                <div key={n.id} className="glass-strong p-3 rounded-xl flex items-center gap-3 text-xs">
                                    <div className="flex-1">{n.text}</div>
                                    <button onClick={() => setData({ ...data, notifications: data.notifications.filter(x => x.id !== n.id) })} className="p-2 bg-red-500/10 text-red-500 rounded-lg"><i data-lucide="trash-2" size="14"></i></button>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in pb-10">
                    <div className="glass p-4 rounded-3xl mb-5 flex justify-between items-center shadow-lg">
                        <h2 className="font-bold text-lg flex items-center gap-2"><i data-lucide="shield-check" size="22" className="text-red-500"></i> Bảng Điều Khiển</h2>
                        <button onClick={onLogout} className="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md active:scale-95 transition-all">Đăng xuất</button>
                    </div>
                    <div className="flex gap-2 overflow-x-auto no-scrollbar mb-5 pb-1">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => { setTab(t.id); setForm({}); setEditId(null); }} className={`whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition-all ${tab === t.id ? 'bg-blue-500 text-white shadow-md' : 'glass-strong hover:bg-white/50'}`}>
                                <i data-lucide={t.icon} size="14"></i> {t.label}
                            </button>
                        ))}
                    </div>
                    <div className="glass p-5 rounded-3xl shadow-xl min-h-[400px]">
                        {tab === 'profile' && <ProfileTab />}
                        {tab === 'site' && <SiteTab />}
                        {tab === 'products' && <ProductsTab />}
                        {tab === 'posts' && <PostsTab />}
                        {tab === 'notifs' && <NotifsTab />}
                    </div>
                </div>
            );
        }

        /* ================= DRAWER & NAV ================= */
        function Drawer({ open, onClose, activePage, onNavigate, data, isAdmin }) {
            const [expanded, setExpanded] = useState(null);
            const items = [
                { id: 'profile', label: 'Trang cá nhân', icon: 'user' },
                { id: 'shop', label: 'Cửa hàng', icon: 'shopping-bag', expandable: true },
                { id: 'notifications', label: 'Thông báo', icon: 'bell' },
                { id: 'posts', label: 'Bài viết', icon: 'newspaper' },
                { id: 'ipcheck', label: 'Check IP', icon: 'globe' },
                { id: 'weather', label: 'Thời tiết', icon: 'cloud-sun' },
                { id: 'notes', label: 'Ghi chú', icon: 'sticky-note' },
                { id: 'tempmail', label: 'Email Tạm', icon: 'mail' },
                { id: 'contact', label: 'Liên hệ hỗ trợ', icon: 'phone' }
            ];

            return (
                <>
                    {open && <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 transition-opacity" onClick={onClose}></div>}
                    <div className={`fixed top-0 left-0 h-full w-80 max-w-[85vw] glass-strong z-50 transform transition-transform duration-300 ease-out ${open ? 'translate-x-0' : '-translate-x-full'} flex flex-col shadow-2xl`}>
                        <div className="p-5 flex items-center gap-4 border-b border-white/20">
                            <img src={data.profile.avatar} className="w-14 h-14 rounded-full object-cover border-2 border-blue-500 shadow-md" alt="Avt" />
                            <div className="flex-1 min-w-0">
                                <p className="font-bold flex items-center text-base truncate">{data.profile.name}{data.profile.verified && <VerifiedIcon size={16} />}</p>
                                <p className="text-xs text-gray-500 truncate mt-0.5">@{ADMIN_USER}</p>
                            </div>
                            <button onClick={onClose} className="p-2 glass rounded-full hover:bg-red-500 hover:text-white transition-colors"><i data-lucide="x" size="18"></i></button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-1.5 no-scrollbar">
                            {items.map(it => (
                                <div key={it.id}>
                                    <button onClick={() => {
                                        if (it.expandable) setExpanded(expanded === it.id ? null : it.id);
                                        else { onNavigate(it.id); onClose(); }
                                    }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${activePage === it.id ? 'bg-blue-500 text-white shadow-lg shadow-blue-500/30' : 'hover:bg-white/40 dark:hover:bg-slate-800/40'}`}>
                                        <i data-lucide={it.icon} size="18" className={activePage === it.id ? 'text-white' : 'text-blue-500'}></i>
                                        <span className="flex-1 text-left">{it.label}</span>
                                        {it.expandable && <i data-lucide={expanded === it.id ? 'chevron-down' : 'chevron-right'} size="16"></i>}
                                    </button>
                                    
                                    {it.expandable && expanded === it.id && (
                                        <div className="ml-8 mt-1 space-y-1 border-l-2 border-blue-500/30 pl-2">
                                            {CATEGORIES.map(c => (
                                                <div key={c.name}>
                                                    <button onClick={() => { onNavigate('shop', c.name); onClose(); }} className="w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-blue-500/10 transition-colors">
                                                        {c.name}
                                                    </button>
                                                    {c.subs.length > 0 && (
                                                        <div className="ml-2">
                                                            {c.subs.map(s => (
                                                                <button key={s} onClick={() => { onNavigate('shop', s); onClose(); }} className="w-full text-left px-3 py-1.5 rounded-lg text-[11px] hover:bg-blue-500/10 text-gray-600 dark:text-gray-400 transition-colors">• {s}</button>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                            
                            <div className="pt-4 border-t border-white/20 mt-4">
                                {isAdmin ? (
                                    <button onClick={() => { onNavigate('admin'); onClose(); }} className="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold text-white bg-gradient-to-r from-red-500 to-orange-500 shadow-lg shadow-red-500/30 active:scale-95 transition-all">
                                        <i data-lucide="shield-check" size="18"></i> Vào Admin Panel
                                    </button>
                                ) : (
                                    <button onClick={() => { onNavigate('admin-login'); onClose(); }} className="w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold hover:bg-gray-500/10 transition-colors">
                                        <i data-lucide="lock" size="18" className="text-gray-500"></i> Đăng nhập Admin
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        /* ================= DRAGGABLE FAB & MUSIC ================= */
        function Accessibility({ effect, setEffect, musicOn, setMusicOn, track, setTrack }) {
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState({ x: window.innerWidth - 70, y: 100 });
            const [isDragging, setIsDragging] = useState(false);
            const dragRef = useRef(null);
            const effects = ['none', 'snow', 'flower'];

            // Xử lý kéo thả
            const onPointerDown = (e) => {
                setIsDragging(false);
                const startX = e.clientX || e.touches[0].clientX;
                const startY = e.clientY || e.touches[0].clientY;
                const startPosX = pos.x;
                const startPosY = pos.y;

                const onPointerMove = (ev) => {
                    setIsDragging(true);
                    const clientX = ev.clientX || ev.touches[0].clientX;
                    const clientY = ev.clientY || ev.touches[0].clientY;
                    const dx = clientX - startX;
                    const dy = clientY - startY;
                    
                    // Giới hạn trong màn hình
                    let newX = Math.max(10, Math.min(window.innerWidth - 60, startPosX + dx));
                    let newY = Math.max(10, Math.min(window.innerHeight - 60, startPosY + dy));
                    
                    setPos({ x: newX, y: newY });
                };

                const onPointerUp = () => {
                    document.removeEventListener('pointermove', onPointerMove);
                    document.removeEventListener('pointerup', onPointerUp);
                    setTimeout(() => setIsDragging(false), 100);
                };

                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
            };

            const handleClick = () => {
                if (!isDragging) setOpen(!open);
            };

            return (
                <>
                    {/* Nút FAB nhỏ gọn, có thể kéo */}
                    <div 
                        id="fab-container"
                        style={{ left: pos.x, top: pos.y }}
                        onPointerDown={onPointerDown}
                        onClick={handleClick}
                        className="w-12 h-12 glass-strong rounded-full flex items-center justify-center shadow-xl hover:scale-105 transition-transform"
                    >
                        <i data-lucide={open ? "x" : "sparkles"} size="20" className="text-blue-500 pointer-events-none"></i>
                    </div>
                    
                    {/* Menu Tiện ích */}
                    {open && (
                        <div 
                            style={{ left: Math.max(10, pos.x - 250), top: pos.y + 50 }} 
                            className="fixed z-50 w-64 glass-strong rounded-3xl p-4 animate-fade-in shadow-2xl border border-white/40"
                        >
                            <div className="flex justify-between items-center mb-3">
                                <p className="text-sm font-bold text-blue-500">Tiện ích</p>
                            </div>
                            
                            <div className="mb-4">
                                <p className="text-[11px] font-bold text-gray-500 mb-2">Hiệu ứng nền</p>
                                <div className="grid grid-cols-3 gap-2">
                                    {effects.map(e => (
                                        <button key={e} onClick={() => setEffect(e)} className={`text-[10px] font-bold py-1.5 rounded-xl capitalize transition-all ${effect === e ? 'bg-blue-500 text-white shadow-md' : 'glass hover:bg-white/60'}`}>{e === 'none' ? 'Tắt' : e}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="mb-2 border-t border-white/20 pt-3">
                                <div className="flex justify-between items-center mb-2">
                                    <p className="text-[11px] font-bold text-gray-500">Nhạc nền</p>
                                    <button onClick={() => setMusicOn(!musicOn)} className={`px-3 py-1 rounded-full text-[10px] font-bold transition-colors ${musicOn ? 'bg-green-500 text-white' : 'bg-gray-300 text-gray-600'}`}>{musicOn ? 'BẬT' : 'TẮT'}</button>
                                </div>
                                {musicOn && (
                                    <div className="space-y-2">
                                        <button onClick={() => setTrack((track + 1) % SC_TRACKS.length)} className="w-full glass rounded-xl py-2 text-[11px] font-bold flex justify-center items-center gap-2 hover:bg-white/60 transition">
                                            <i data-lucide="skip-forward" size="14"></i> Đổi bài hát
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Persistent Music Player (Không bị unmount làm tắt nhạc) */}
                    {musicOn && (
                        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 w-72 h-0 opacity-0 pointer-events-none z-0">
                            <iframe 
                                width="100%" 
                                height="100" 
                                scrolling="no" 
                                frameBorder="no" 
                                allow="autoplay" 
                                src={`https://w.soundcloud.com/player/?url=${encodeURIComponent(SC_TRACKS[track])}&color=%233b82f6&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false`}
                            ></iframe>
                        </div>
                    )}
                </>
            );
        }

        /* ================= MAIN APP ================= */
        function App() {
            useLucide();
            const [darkMode, setDarkMode] = useState(() => ls.get('darkMode', true));
            const [effect, setEffect] = useState(() => ls.get('effect', 'snow'));
            const [musicOn, setMusicOn] = useState(() => ls.get('musicOn', false));
            const [track, setTrack] = useState(0);
            const [activePage, setActivePage] = useState('profile');
            const [shopFilter, setShopFilter] = useState('');
            const [drawerOpen, setDrawerOpen] = useState(false);
            const [isAdmin, setIsAdmin] = useState(() => ls.get('isAdmin', false));

            const [data, setDataState] = useState(() => ({
                profile: ls.get('profile', DEFAULT_PROFILE),
                products: ls.get('products', DEFAULT_PRODUCTS),
                posts: ls.get('posts', DEFAULT_POSTS),
                notifications: ls.get('notifications', DEFAULT_NOTIFS),
                siteName: ls.get('siteName', 'Thao Service'),
                defaultEffect: ls.get('defaultEffect', 'snow')
            }));

            const setData = (d) => {
                setDataState(d);
                ls.set('profile', d.profile); ls.set('products', d.products); ls.set('posts', d.posts);
                ls.set('notifications', d.notifications); ls.set('siteName', d.siteName); ls.set('defaultEffect', d.defaultEffect);
            };

            useEffect(() => { ls.set('darkMode', darkMode); document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);
            useEffect(() => { ls.set('effect', effect); }, [effect]);
            useEffect(() => { ls.set('musicOn', musicOn); }, [musicOn]);
            useEffect(() => { ls.set('isAdmin', isAdmin); }, [isAdmin]);

            const navigate = (page, filter) => {
                setActivePage(page);
                if (filter !== undefined) setShopFilter(filter);
                if (page === 'shop' && !filter) setShopFilter('');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="max-w-4xl mx-auto p-3 pt-5 pb-32">
                    <Effects type={effect} />
                    
                    {/* Thanh Menu Trên đã được xóa hoàn toàn, thay vào đó là nút Setting nhỏ gọn */}
                    <div className="flex justify-between items-center mb-5 px-2">
                        <h1 className="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-cyan-400">{data.siteName}</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 glass-strong rounded-full shadow-md active:scale-90 transition-all">
                                <i data-lucide={darkMode ? 'sun' : 'moon'} size="18"></i>
                            </button>
                            <button onClick={() => setDrawerOpen(true)} className="p-2.5 glass-strong rounded-full shadow-md active:scale-90 transition-all">
                                <i data-lucide="menu" size="18" className="text-blue-500"></i>
                            </button>
                        </div>
                    </div>

                    {/* Page Content */}
                    <div className="min-h-[70vh]">
                        {activePage === 'profile' && <ProfileHome profile={data.profile} posts={data.posts} onNavigate={navigate} />}
                        {activePage === 'shop' && <Shop products={data.products} filter={shopFilter} setFilter={setShopFilter} />}
                        {activePage === 'posts' && (
                            <div className="animate-fade-in space-y-4">
                                <h2 className="text-2xl font-bold mb-4">Bài Viết</h2>
                                {data.posts.length === 0 && <p className="text-center text-gray-500 py-10">Chưa có bài viết</p>}
                                {[...data.posts].reverse().map(p => (
                                    <div key={p.id} className="glass p-5 rounded-3xl shadow-lg">
                                        {p.image && <img src={p.image} className="w-full h-48 object-cover rounded-2xl mb-4" alt="" />}
                                        <h3 className="font-bold text-lg text-blue-500">{p.title}</h3>
                                        <p className="text-xs text-gray-500 mt-1">{new Date(p.date).toLocaleDateString('vi-VN')}</p>
                                        <p className="text-sm mt-3 text-gray-700 dark:text-gray-300 whitespace-pre-wrap leading-relaxed">{p.content}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                        {activePage === 'notifications' && (
                            <div className="animate-fade-in space-y-3">
                                <h2 className="text-2xl font-bold mb-4">Thông Báo</h2>
                                {data.notifications.length === 0 && <p className="text-center text-gray-500 py-10">Không có thông báo</p>}
                                {[...data.notifications].reverse().map(n => (
                                    <div key={n.id} className="glass p-4 rounded-2xl flex gap-3 shadow-md">
                                        <div className="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center flex-shrink-0">
                                            <i data-lucide="bell" size="20" className="text-blue-500"></i>
                                        </div>
                                        <div className="flex-1 pt-1">
                                            <p className="text-sm font-medium">{n.text}</p>
                                            <p className="text-xs text-gray-500 mt-1">{new Date(n.createdAt).toLocaleString('vi-VN')}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {activePage === 'weather' && <Weather />}
                        {activePage === 'tempmail' && <TempMail />}
                        {activePage === 'contact' && <ContactPage profile={data.profile} />}
                        {activePage === 'admin-login' && <AdminLogin onLogin={() => { setIsAdmin(true); navigate('admin'); }} />}
                        {activePage === 'admin' && (isAdmin ? <AdminPanel data={data} setData={setData} onLogout={() => { setIsAdmin(false); navigate('profile'); }} /> : <AdminLogin onLogin={() => { setIsAdmin(true); navigate('admin'); }} />)}
                        
                        {/* Các trang placeholder cho đủ tính năng */}
                        {['ipcheck', 'notes'].includes(activePage) && (
                            <div className="glass p-10 rounded-3xl text-center animate-fade-in shadow-xl">
                                <i data-lucide="tool" size="48" className="text-blue-500 mx-auto mb-4 animate-bounce"></i>
                                <h2 className="text-xl font-bold">Tính năng đang bảo trì</h2>
                                <p className="text-sm text-gray-500 mt-2">Chức năng này sẽ được cập nhật trong phiên bản tới.</p>
                            </div>
                        )}
                    </div>

                    {/* Floating Tools */}
                    <Accessibility effect={effect} setEffect={setEffect} musicOn={musicOn} setMusicOn={setMusicOn} track={track} setTrack={setTrack} />
                    
                    {/* Drawer Menu */}
                    <Drawer open={drawerOpen} onClose={() => setDrawerOpen(false)} activePage={activePage} onNavigate={navigate} data={data} isAdmin={isAdmin} />

                    {/* Bottom iOS Nav (Nhỏ gọn, kính mờ) */}
                    <nav className="fixed bottom-5 left-1/2 -translate-x-1/2 w-[85%] max-w-sm glass-strong rounded-[2rem] p-2 flex justify-around items-center z-40 shadow-[0_10px_40px_rgba(0,0,0,0.2)] border border-white/40">
                        <button onClick={() => navigate('profile')} className={`dock-item flex flex-col items-center p-2 w-16 rounded-2xl ${activePage === 'profile' ? 'bg-blue-500 text-white shadow-md' : 'text-gray-500 hover:bg-white/50 dark:hover:bg-slate-800/50'}`}>
                            <i data-lucide="home" size="20"></i><span className="text-[9px] font-bold mt-1">Home</span>
                        </button>
                        <button onClick={() => navigate('shop')} className={`dock-item flex flex-col items-center p-2 w-16 rounded-2xl ${activePage === 'shop' ? 'bg-blue-500 text-white shadow-md' : 'text-gray-500 hover:bg-white/50 dark:hover:bg-slate-800/50'}`}>
                            <i data-lucide="shopping-bag" size="20"></i><span className="text-[9px] font-bold mt-1">Shop</span>
                        </button>
                        <button onClick={() => navigate('weather')} className={`dock-item flex flex-col items-center p-2 w-16 rounded-2xl ${activePage === 'weather' ? 'bg-blue-500 text-white shadow-md' : 'text-gray-500 hover:bg-white/50 dark:hover:bg-slate-800/50'}`}>
                            <i data-lucide="cloud-sun" size="20"></i><span className="text-[9px] font-bold mt-1">Weather</span>
                        </button>
                        <button onClick={() => navigate('contact')} className={`dock-item flex flex-col items-center p-2 w-16 rounded-2xl ${activePage === 'contact' ? 'bg-blue-500 text-white shadow-md' : 'text-gray-500 hover:bg-white/50 dark:hover:bg-slate-800/50'}`}>
                            <i data-lucide="phone" size="20"></i><span className="text-[9px] font-bold mt-1">Contact</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
