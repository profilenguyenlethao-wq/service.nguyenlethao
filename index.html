<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service Processing Support</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SweetAlert2 (Thông báo đẹp) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            transition: background 0.3s, color 0.3s; 
            background-color: #f8fafc;
            color: #0f172a;
            padding-bottom: 90px; /* Tránh bị menu đè */
        }
        .dark body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Liquid Glass Effect */
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        /* Bottom Sheet Animation */
        .bottom-sheet { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bottom-sheet.open { transform: translateY(0); }

        /* Snow & Flower Effect */
        .snowflake { position: fixed; top: -10px; color: #fff; font-size: 1em; pointer-events: none; animation: fall linear forwards; z-index: 0; }
        @keyframes fall { to { transform: translateY(105vh); } }
        
        .flower { position: fixed; top: -10px; font-size: 1.5em; pointer-events: none; animation: fall linear forwards; z-index: 0; }
        .fog { position: fixed; bottom: 0; left: 0; width: 100%; height: 30vh; background: linear-gradient(to top, rgba(255,255,255,0.9), transparent); pointer-events: none; z-index: 0; }
        .dark .fog { background: linear-gradient(to top, rgba(15,23,42,0.9), transparent); }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* iPhone Dock Animation */
        .dock-item { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s; }
        .dock-item:active { transform: scale(0.85); }
        .dock-item.active { color: #3b82f6; }
    </style>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6', darkBg: '#0f172a' } } } }
    </script>
</head>
<body class="min-h-screen relative">

    <div id="root" class="relative z-10"></div>

            name: "Nguyễn Lê Thảo",

            bio: "Chuyên cung cấp dịch vụ MMO, Support Meta, TikTok, Google, Tool & Bypass. Uy tín - Tốc độ - Bảo mật.",
            avatar: "https://ui-avatars.com/api/?name=Nguyen+Le+Thao&background=3b82f6&color=fff&size=200"
        };

        const DEFAULT_PRODUCTS = [
            { id: 1, category: "Shop Liên Quân", name: "Acc Kim Cương 100+", price: "500.000đ", desc: "Full tướng, ngọc đỏ", stock: 5, image: "https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=400&q=80" },
            { id: 2, category: "Shop Free Fire", name: "Acc FF Thách Đấu", price: "300.000đ", desc: "Full nhân vật, súng đẹp", stock: 2, image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&q=80" },
            { id: 3, category: "Meta", name: "UNLOCK 282", price: "150.000đ", desc: "Mở khóa tính năng 282", stock: 10, image: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=400&q=80" }

        // --- COMPONENTS ---
        function EffectManager({ type }) {
            useEffect(() => {
                const layer = document.getElementById('effect-layer');
                if(!layer) return;
                layer.innerHTML = '';
                
                if (type === 'snow') {
                    const interval = setInterval(() => {
                        const el = document.createElement('div');
                        el.innerHTML = '❄'; el.className = 'snowflake';
                        el.style.left = Math.random() * 100 + 'vw';
                        el.style.animationDuration = Math.random() * 3 + 2 + 's';
                        el.style.opacity = Math.random();
                        layer.appendChild(el);
                        setTimeout(() => el.remove(), 5000);
                    }, 200);
                    return () => clearInterval(interval);
                } else if (type === 'flower') {
                    const flowers = ['🌸', '🌺', '🌼', '🍁'];
                    const interval = setInterval(() => {
                        const el = document.createElement('div');
                        el.innerHTML = flowers[Math.floor(Math.random()*flowers.length)]; el.className = 'flower';
                        el.style.left = Math.random() * 100 + 'vw';
                        el.style.animationDuration = Math.random() * 4 + 3 + 's';
                        layer.appendChild(el);
                        setTimeout(() => el.remove(), 7000);
                    }, 400);
                    return () => clearInterval(interval);
                } else if (type === 'fog') {
                    layer.innerHTML = '<div class="fog"></div>';
                }
            }, [type]);
            return null;
        }

        function WeatherWidget({ t }) {
            const [weather, setWeather] = useState(null);
            const [loading, setLoading] = useState(false);
            const cities = [{ name: "Quy Nhơn", lat: 13.78, lon: 109.22 }, { name: "Nha Trang", lat: 12.24, lon: 109.19 }, { name: "Đà Nẵng", lat: 16.05, lon: 108.20 }, { name: "Hà Nội", lat: 21.03, lon: 105.85 }, { name: "HCM", lat: 10.82, lon: 106.63 }];

            const getWeather = async (lat, lon, name) => {
                setLoading(true);
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability&timezone=Asia/Ho_Chi_Minh`);
                    const data = await res.json();
                    setWeather({ name, current: data.current, hourly: data.hourly });
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            const checkMyLocation = async () => {
                setLoading(true);
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    const data = await res.json();
                    if(data.latitude) getWeather(data.latitude, data.longitude, `Vị trí: ${data.city}`);
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            return (
                <div className="glass p-4 rounded-2xl mb-4">
                    <h2 className="text-lg font-bold mb-3 flex items-center gap-2"><i data-lucide="cloud-sun" className="text-blue-500"></i> {t.weather}</h2>
                    <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                        {cities.map(c => (
                            <button key={c.name} onClick={() => getWeather(c.lat, c.lon, c.name)} className="whitespace-nowrap bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 px-3 py-1.5 rounded-full text-xs font-semibold">{c.name}</button>
                        ))}
                        <button onClick={checkMyLocation} className="whitespace-nowrap bg-green-500 text-white px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1"><i data-lucide="map-pin" size="14"></i> Vị trí</button>
                    </div>
                    {loading ? <div className="text-center py-4"><i data-lucide="loader" className="animate-spin inline"></i></div> : weather && (
                        <div className="mt-2 space-y-3">
                            <div className="bg-blue-50 dark:bg-blue-900/20 p-3 rounded-xl flex justify-between items-center">
                                <div>
                                    <p className="font-bold text-sm">{weather.name}</p>
                                    <p className="text-[10px] text-gray-500">Độ ẩm: {weather.current.relative_humidity_2m}% | Gió: {weather.current.wind_speed_10m}km/h</p>
                                </div>
                                <p className="text-2xl font-extrabold text-blue-500">{weather.current.temperature_2m}°C</p>
                            </div>
                            <div className="overflow-x-auto no-scrollbar flex gap-3 bg-white/40 dark:bg-black/20 p-2 rounded-xl">
                                {weather.hourly.time.slice(0, 8).map((time, idx) => (
                                    <div key={idx} className="text-center min-w-[50px]">
                                        <p className="text-[10px] text-gray-500">{time.split('T')[1]}</p>
                                        <p className="font-bold text-sm">{weather.hourly.temperature_2m[idx]}°</p>
                                        <p className="text-[9px] text-blue-500">{weather.hourly.precipitation_probability[idx]}%</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function IpCheckWidget({ t }) {
            const [ip, setIp] = useState(null);
            const check = async () => {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                setIp(data);
            };
            return (
                <div className="glass p-4 rounded-2xl mb-4">
                    <h2 className="text-lg font-bold mb-3 flex items-center gap-2"><i data-lucide="globe" className="text-purple-500"></i> {t.ipCheck}</h2>
                    <button onClick={check} className="w-full bg-purple-500 text-white py-2 rounded-xl text-sm font-bold shadow-lg shadow-purple-500/30">Check IP Của Tôi</button>
                    {ip && (
                        <div className="mt-3 text-xs space-y-1.5 bg-white/50 dark:bg-black/20 p-3 rounded-xl">
                            <p className="flex justify-between"><span className="text-gray-500">IP:</span> <span className="font-bold">{ip.ip}</span></p>
                            <p className="flex justify-between"><span className="text-gray-500">Mạng:</span> <span>{ip.org}</span></p>
                            <p className="flex justify-between"><span className="text-gray-500">Quốc gia:</span> <span>{ip.country_name}</span></p>
                            <p className="flex justify-between"><span className="text-gray-500">Thành phố:</span> <span>{ip.city}</span></p>
                        </div>
                    )}
                </div>
            );
        }

        function SpeedTestWidget({ t }) {
            const [speed, setSpeed] = useState(null);
            const [testing, setTesting] = useState(false);
            const testSpeed = async () => {
                setTesting(true); setSpeed(null);
                const start = performance.now();
                try {
                    await fetch('https://upload.wikimedia.org/wikipedia/commons/3/3d/LARGE_elevation.jpg?cache=' + Date.now(), { cache: 'no-store' });
                    const duration = (performance.now() - start) / 1000;
                    setSpeed(((5000000 * 8) / (duration * 1000000)).toFixed(2));
                } catch (e) { alert("Lỗi test!"); }
                setTesting(false);
            };
            return (
                <div className="glass p-4 rounded-2xl mb-4">
                    <h2 className="text-lg font-bold mb-3 flex items-center gap-2"><i data-lucide="wifi" className="text-green-500"></i> Tốc độ mạng</h2>
                    <button onClick={testSpeed} disabled={testing} className="w-full bg-green-500 text-white py-2 rounded-xl text-sm font-bold shadow-lg shadow-green-500/30">
                        {testing ? 'Đang test...' : 'Test Wifi / 4G'}
                    </button>
                    {speed && <p className="text-center mt-3 font-bold text-xl text-green-500">{speed} Mbps</p>}
                </div>
            );
        }

        function NoteWidget({ t }) {
            const [notes, setNotes] = useState(() => JSON.parse(localStorage.getItem('notes') || '[]'));
            const [input, setInput] = useState('');
            const add = () => { if(!input) return; const n = [...notes, { id: Date.now(), text: input }]; setNotes(n); localStorage.setItem('notes', JSON.stringify(n)); setInput(''); };
            const del = (id) => { const n = notes.filter(x => x.id !== id); setNotes(n); localStorage.setItem('notes', JSON.stringify(n)); };
            return (
                <div className="glass p-4 rounded-2xl mb-4">
                    <h2 className="text-lg font-bold mb-3 flex items-center gap-2"><i data-lucide="sticky-note" className="text-yellow-500"></i> Ghi chú</h2>
                    <div className="flex gap-2">
                        <input value={input} onChange={e=>setInput(e.target.value)} className="flex-1 bg-white/50 dark:bg-black/20 border border-gray-300 dark:border-gray-700 rounded-xl p-2 text-sm outline-none" placeholder="Nhập..." />
                        <button onClick={add} className="bg-yellow-500 text-white px-3 rounded-xl font-bold">+</button>
                    </div>
                    <ul className="mt-2 space-y-1 max-h-32 overflow-y-auto no-scrollbar">
                        {notes.map(n => <li key={n.id} className="flex justify-between bg-white/50 dark:bg-black/20 p-2 rounded-lg text-sm">{n.text} <button onClick={()=>del(n.id)} className="text-red-500"><i data-lucide="x" size="14"></i></button></li>)}
                    </ul>
                </div>
            );
        }

        function TempMailWidget({ t }) {
            const [mail, setMail] = useState(() => JSON.parse(localStorage.getItem('tempmail') || 'null'));
            const [loading, setLoading] = useState(false);
            const create = async () => {
                setLoading(true);
                try {
                    const d = await (await fetch('https://api.mail.tm/domains')).json();
                    const address = `user${Math.floor(Math.random()*99999)}@${d['hydra:member'][0].domain}`;
                    const password = 'Pass123!';
                    await fetch('https://api.mail.tm/accounts', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({address, password}) });
                    const tokenData = await (await fetch('https://api.mail.tm/token', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({address, password}) })).json();
                    const m = { address, token: tokenData.token }; setMail(m); localStorage.setItem('tempmail', JSON.stringify(m));
                } catch (e) { alert("Lỗi API!"); }
                setLoading(false);
            };
            return (
                <div className="glass p-4 rounded-2xl mb-4">
                    <h2 className="text-lg font-bold mb-3 flex items-center gap-2"><i data-lucide="mail" className="text-orange-500"></i> Mail Tạm</h2>
                    {!mail ? <button onClick={create} disabled={loading} className="w-full bg-orange-500 text-white py-2 rounded-xl text-sm font-bold">{loading ? 'Đang tạo...' : 'Tạo Mail Mới'}</button> : (
                        <div className="bg-white/50 dark:bg-black/20 p-3 rounded-xl text-sm">
                            <p className="font-bold text-orange-500 break-all">{mail.address}</p>
                            <button onClick={()=>{localStorage.removeItem('tempmail'); setMail(null);}} className="mt-2 text-red-500 text-xs">Xóa Mail</button>
                        </div>
                    )}
                </div>
            );
        }

        function MmoTools() {

                    {posts.slice(0, 2).map(post => (

                        <a href="https://facebook.com/nguyenlethaoservice" target="_blank" className="flex items-center gap-3 bg-blue-50 dark:bg-gray-800 p-3 rounded-xl hover:bg-blue-100 transition"><i data-lucide="facebook" className="text-blue-600"></i> <span className="font-semibold">Facebook: @nguyenlethaoservice</span></a>
                        <a href="tel:0898666218" className="flex items-center gap-3 bg-blue-50 dark:bg-gray-800 p-3 rounded-xl hover:bg-blue-100 transition"><i data-lucide="phone" className="text-green-500"></i> <span className="font-semibold">Call: 0898666218</span></a>
                        <a href="mailto:nguyenlethao.profile08@gmail.com" className="flex items-center gap-3 bg-blue-50 dark:bg-gray-800 p-3 rounded-xl hover:bg-blue-100 transition"><i data-lucide="mail" className="text-red-500"></i> <span className="font-semibold">Email Support</span></a>

        // --- ADMIN PANEL ---
        function AdminPanel({ products, setProducts, posts, setPosts, profile, setProfile, notification, setNotification, onLogout }) {
            const [name, setName] = useState('');
            const [price, setPrice] = useState('');
            const [desc, setDesc] = useState('');
            const [stock, setStock] = useState(0);
            const [img, setImg] = useState('');
            
            const addProduct = (e) => {
                e.preventDefault();
                const newP = [...products, { id: Date.now(), category: "Hệ thống", name, price, desc, stock: Number(stock), image: img }];
                setProducts(newP); localStorage.setItem('products', JSON.stringify(newP));
                setName(''); setPrice(''); setDesc(''); setStock(0); setImg('');
                Swal.fire('Thành công', 'Đã thêm sản phẩm!', 'success');
            };

            const delProduct = (id) => { const newP = products.filter(p => p.id !== id); setProducts(newP); localStorage.setItem('products', JSON.stringify(newP)); };

            return (
                <div className="animate-fade-in border-2 border-red-500/30 p-4 rounded-3xl bg-red-50/10">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-bold text-red-500 flex items-center gap-2"><i data-lucide="shield"></i> Admin Dashboard</h2>
                        <button onClick={onLogout} className="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold">Đăng Xuất</button>
                    </div>

                    <div className="space-y-4">
                        {/* Profile Settings */}
                        <div className="glass p-4 rounded-xl">
                            <h3 className="font-bold text-sm mb-2 text-blue-500">Cài đặt Profile</h3>
                            <input value={profile.name} onChange={e=>setProfile({...profile, name: e.target.value})} className="w-full p-2 mb-2 rounded-lg text-sm bg-white dark:bg-gray-800" placeholder="Tên Admin"/>
                            <input value={profile.avatar} onChange={e=>setProfile({...profile, avatar: e.target.value})} className="w-full p-2 mb-2 rounded-lg text-sm bg-white dark:bg-gray-800" placeholder="Link ảnh đại diện (URL)"/>
                            <textarea value={profile.bio} onChange={e=>setProfile({...profile, bio: e.target.value})} className="w-full p-2 rounded-lg text-sm bg-white dark:bg-gray-800" rows="2" placeholder="Giới thiệu bản thân"></textarea>
                            <button onClick={()=>{localStorage.setItem('profile', JSON.stringify(profile)); Swal.fire('Đã lưu!','','success')}} className="mt-2 w-full bg-blue-500 text-white py-1.5 rounded-lg text-sm font-bold">Lưu Profile</button>
                        </div>

                        {/* Product Management */}
                        <div className="glass p-4 rounded-xl">
                            <h3 className="font-bold text-sm mb-2 text-blue-500">Thêm Sản Phẩm</h3>
                            <form onSubmit={addProduct} className="space-y-2">
                                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Tên sản phẩm" className="w-full p-2 rounded-lg text-sm bg-white dark:bg-gray-800" required/>
                                <div className="flex gap-2">
                                    <input value={price} onChange={e=>setPrice(e.target.value)} placeholder="Giá" className="w-1/2 p-2 rounded-lg text-sm bg-white dark:bg-gray-800" required/>
                                    <input type="number" value={stock} onChange={e=>setStock(e.target.value)} placeholder="Kho" className="w-1/2 p-2 rounded-lg text-sm bg-white dark:bg-gray-800" required/>
                                </div>
                                <input value={img} onChange={e=>setImg(e.target.value)} placeholder="Link ảnh sản phẩm (URL)" className="w-full p-2 rounded-lg text-sm bg-white dark:bg-gray-800" />
                                <input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Mô tả ngắn" className="w-full p-2 rounded-lg text-sm bg-white dark:bg-gray-800" />
                                <button type="submit" className="w-full bg-green-500 text-white py-2 rounded-lg text-sm font-bold shadow-lg shadow-green-500/30">Thêm Ngay</button>
                            </form>
                            <div className="mt-3 space-y-1 max-h-32 overflow-y-auto no-scrollbar">
                                {products.map(p => (
                                    <div key={p.id} className="flex justify-between items-center bg-white dark:bg-gray-800 p-2 rounded-lg text-xs">
                                        <span className="truncate pr-2">{p.name}</span>
                                        <button onClick={()=>delProduct(p.id)} className="text-red-500"><i data-lucide="trash-2" size="14"></i></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [lang, setLang] = useState('vi');
            const [darkMode, setDarkMode] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            
            // Settings & Data
            const [effect, setEffect] = useState('snow');
            const [profile, setProfile] = useState(() => JSON.parse(localStorage.getItem('profile')) || DEFAULT_PROFILE);
            const [notification, setNotification] = useState(() => localStorage.getItem('notification') || "Chào mừng bạn đến với Service Processing Support!");
            const [showNotif, setShowNotif] = useState(true);
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('products')) || DEFAULT_PRODUCTS);
            const [posts, setPosts] = useState(() => JSON.parse(localStorage.getItem('posts')) || DEFAULT_POSTS);
            
            // Admin Auth State
            const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem('isAdmin') === 'true');
            const [showLogin, setShowLogin] = useState(false);
            const [fabOpen, setFabOpen] = useState(false);
            const [track, setTrack] = useState(0);

            const t = {
                vi: { home: "Trang chủ", shop: "Gian hàng", tools: "Tiện ích", contact: "Liên hệ", admin: "Admin", weather: "Thời tiết", ipCheck: "Check IP" },
                en: { home: "Home", shop: "Shop", tools: "Tools", contact: "Contact", admin: "Admin", weather: "Weather", ipCheck: "IP Check" }
            }[lang];

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                lucide.createIcons();
            });

            const handleDismissNotif = () => { setShowNotif(false); setTimeout(() => setShowNotif(true), 12 * 60 * 60 * 1000); };

            const handleLogin = (e) => {
                e.preventDefault();
                const user = e.target.username.value;
                const pass = e.target.password.value;
                if (user === 'admin' && pass === '123456') {
                    setIsAdmin(true); localStorage.setItem('isAdmin', 'true'); setShowLogin(false); setActiveTab('admin');
                    Swal.fire({title: 'Đăng nhập thành công!', icon: 'success', timer: 1500, showConfirmButton: false});
                } else {
                    Swal.fire('Lỗi', 'Sai tài khoản hoặc mật khẩu!', 'error');
                }
            };

            const handleLogout = () => { setIsAdmin(false); localStorage.removeItem('isAdmin'); setActiveTab('home'); Swal.fire('Đã đăng xuất', '', 'success'); };

            const embedUrl = `https://w.soundcloud.com/player/?url=${encodeURIComponent(SC_TRACKS[track])}&color=%233b82f6&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false`;

            return (
                <div className="max-w-md mx-auto p-4 pb-24">
                    <EffectManager type={effect} />
                    
                    {/* Header */}
                    <header className="flex justify-between items-center mb-6 glass p-3 rounded-2xl sticky top-2 z-40">
                        <div className="flex items-center gap-2">
                            <img src={profile.avatar} alt="Avatar" className="w-8 h-8 rounded-full border-2 border-blue-500" />
                            <h1 className="text-sm font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-cyan-400">{profile.name}</h1>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={()=>setLang(lang==='vi'?'en':'vi')} className="px-2 py-1 bg-gray-100 dark:bg-gray-800 rounded-lg text-xs font-bold">{lang.toUpperCase()}</button>
                            <button onClick={()=>setDarkMode(!darkMode)} className="p-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg">
                                <i data-lucide={darkMode ? "sun" : "moon"} size="16"></i>
                            </button>
                        </div>
                    </header>

                    {/* Notification */}
                    {showNotif && notification && (
                        <div className="bg-blue-500/10 border border-blue-500/20 text-blue-600 dark:text-blue-400 p-3 rounded-xl mb-4 flex justify-between items-center text-xs font-medium animate-fade-in">
                            <span><i data-lucide="bell" size="12" className="inline mr-1"></i> {notification}</span>
                            <button onClick={handleDismissNotif} className="p-1 hover:bg-blue-500/20 rounded"><i data-lucide="x" size="14"></i></button>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <div className="mb-6 min-h-[60vh]">
                        {activeTab === 'home' && <HomeTab profile={profile} posts={posts} t={t} />}
                        {activeTab === 'shop' && <ShopTab products={products} t={t} />}
                        {activeTab === 'contact' && <ContactTab t={t} />}
                        {activeTab === 'tools' && (
                            <div className="space-y-4">
                                <WeatherWidget t={t} />
                                <IpCheckWidget t={t} />
                                <SpeedTestWidget t={t} />
                                <NoteWidget t={t} />
                                <TempMailWidget t={t} />
                                <MmoTools />
                            </div>
                        )}
                        {activeTab === 'admin' && (
                            isAdmin ? <AdminPanel products={products} setProducts={setProducts} posts={posts} setPosts={posts} profile={profile} setProfile={setProfile} notification={notification} setNotification={setNotification} onLogout={handleLogout} /> 
                            : <div className="text-center py-10 glass rounded-3xl"><i data-lucide="lock" className="mx-auto text-gray-400 mb-2" size="48"></i><p className="text-gray-500">Vui lòng đăng nhập để truy cập.</p></div>
                        )}
                    </div>

                    {/* Floating Action Button (FAB - Trợ năng & Nhạc) */}
                    <button onClick={() => setFabOpen(!fabOpen)} className="fixed bottom-24 right-4 bg-gradient-to-tr from-blue-600 to-cyan-500 text-white p-4 rounded-full shadow-xl shadow-blue-500/40 z-50 transition-transform active:scale-90">
                        <i data-lucide="sparkles" size="24"></i>
                    </button>

                    {/* FAB Menu (Bottom Sheet) */}
                    <div className={`fixed inset-0 bg-black/50 backdrop-blur-sm z-50 transition-opacity ${fabOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setFabOpen(false)}>
                        <div className={`absolute bottom-0 left-0 w-full glass rounded-t-3xl p-6 transition-transform duration-300 ${fabOpen ? 'translate-y-0' : 'translate-y-full'}`} onClick={e => e.stopPropagation()}>
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-lg flex items-center gap-2"><i data-lucide="settings" className="text-blue-500"></i> Trợ Năng & Tiện Ích</h3>
                                <button onClick={()=>setFabOpen(false)} className="p-1 bg-gray-200 dark:bg-gray-800 rounded-full"><i data-lucide="x" size="20"></i></button>
                            </div>
                            
                            {/* Music Player in FAB */}
                            <div className="mb-4 bg-white/50 dark:bg-black/30 rounded-xl p-2">
                                <div className="flex justify-between items-center px-2 mb-1">
                                    <span className="text-xs font-bold text-blue-500"><i data-lucide="music" size="12" className="inline mr-1"></i>Nhạc Chill</span>
                                    <button onClick={()=>setTrack((track+1)%SC_TRACKS.length)} className="text-gray-500"><i data-lucide="skip-forward" size="14"></i></button>
                                </div>
                                <iframe width="100%" height="60" scrolling="no" frameBorder="no" allow="autoplay" src={embedUrl} className="rounded-lg"></iframe>
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} className="bg-white/50 dark:bg-gray-800 p-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1"><i data-lucide="arrow-up" size="14"></i> Lên đầu</button>
                                <button onClick={()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})} className="bg-white/50 dark:bg-gray-800 p-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1"><i data-lucide="arrow-down" size="14"></i> Xuống cuối</button>
                                <button onClick={()=>{
                                    const effects = ['none', 'snow', 'flower', 'fog'];
                                    setEffect(effects[(effects.indexOf(effect)+1)%effects.length]);
                                }} className="col-span-2 bg-blue-500 text-white p-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1 shadow-lg shadow-blue-500/30"><i data-lucide="sparkles" size="14"></i> Đổi hiệu ứng: {effect.toUpperCase()}</button>
                            </div>
                        </div>
                    </div>

                    {/* Login Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="glass p-6 rounded-3xl w-full max-w-sm animate-fade-in relative">
                                <button onClick={()=>setShowLogin(false)} className="absolute top-3 right-3 text-gray-500"><i data-lucide="x"></i></button>
                                <h2 className="text-xl font-bold text-center mb-4">Đăng Nhập Admin</h2>
                                <form onSubmit={handleLogin} className="space-y-3">
                                    <input name="username" placeholder="Tài khoản (admin)" className="w-full p-3 rounded-xl bg-white/50 dark:bg-black/20 border border-gray-300 dark:border-gray-700 outline-none text-sm" required/>
                                    <input name="password" type="password" placeholder="Mật khẩu (123456)" className="w-full p-3 rounded-xl bg-white/50 dark:bg-black/20 border border-gray-300 dark:border-gray-700 outline-none text-sm" required/>
                                    <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-500/30">Đăng Nhập</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Bottom Navigation Dock (iPhone Style) */}
                    <nav className="fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass rounded-2xl py-2 px-1 flex justify-around items-center z-40 shadow-xl border border-white/20">
                        <button onClick={()=>setActiveTab('home')} className={`dock-item flex flex-col items-center p-1 ${activeTab==='home'?'active':'text-gray-500'}`}>
                            <i data-lucide="user" size="20"></i><span className="text-[9px] font-bold mt-1">{t.home}</span>
                        </button>
                        <button onClick={()=>setActiveTab('shop')} className={`dock-item flex flex-col items-center p-1 ${activeTab==='shop'?'active':'text-gray-500'}`}>
                            <i data-lucide="shopping-bag" size="20"></i><span className="text-[9px] font-bold mt-1">{t.shop}</span>
                        </button>
                        <button onClick={()=>setActiveTab('tools')} className={`dock-item flex flex-col items-center p-1 ${activeTab==='tools'?'active':'text-gray-500'}`}>
                            <i data-lucide="layout-grid" size="20"></i><span className="text-[9px] font-bold mt-1">{t.tools}</span>
                        </button>
                        <button onClick={()=>setActiveTab('contact')} className={`dock-item flex flex-col items-center p-1 ${activeTab==='contact'?'active':'text-gray-500'}`}>
                            <i data-lucide="phone" size="20"></i><span className="text-[9px] font-bold mt-1">{t.contact}</span>
                        </button>
                        <button onClick={()=>{ isAdmin ? setActiveTab('admin') : setShowLogin(true) }} className={`dock-item flex flex-col items-center p-1 ${activeTab==='admin'?'text-red-500':'text-gray-500'}`}>
                            <i data-lucide="shield" size="20"></i><span className="text-[9px] font-bold mt-1">{t.admin}</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
